# Audio capture post-process — merge transcripts, structure, classify, extract.
#
# Manual: Actions → OpenKMS Audio Capture Post-Process → Run workflow → job_id from app_audio_capture_pipeline_jobs.
# Trigger API (backend):
#   POST /repos/{owner}/{repo}/actions/workflows/openkms-audio-capture-post-process.yml/dispatches

name: OpenKMS Audio Capture Post-Process

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Capture pipeline job UUID (app_audio_capture_pipeline_jobs.id)
        required: true
        type: string
      worker_cli_args:
        description: JSON array of openkms-cli args (from pipeline command template)
        required: false
        type: string

concurrency:
  group: openkms-audio-capture-post-process-${{ inputs.job_id }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: openkms-cli

jobs:
  audio-capture-post-process:
    name: audio-capture-post-process (${{ inputs.job_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: openkms-cli/uv.lock

      - name: Restore virtualenv cache
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: openkms-cli/.venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('openkms-cli/uv.lock') }}

      - name: Install dependencies
        run: uv sync --frozen --extra pipeline

      - name: Validate backend URL
        env:
          OPENKMS_API_URL: ${{ secrets.OPENKMS_API_URL }}
        run: |
          if [ -z "$OPENKMS_API_URL" ]; then
            echo "::error::GitHub secret OPENKMS_API_URL is not set."
            exit 1
          fi
          case "$OPENKMS_API_URL" in
            http://127.0.0.1:*|http://localhost:*|https://127.0.0.1:*|https://localhost:*)
              echo "::error::OPENKMS_API_URL points to localhost — GitHub runners cannot reach your machine."
              exit 1
              ;;
          esac
          curl -fsS --max-time 15 "${OPENKMS_API_URL%/}/health" || {
            echo "::error::Backend health check failed."
            exit 1
          }

      - name: Run capture post-process
        env:
          OPENKMS_API_URL: ${{ secrets.OPENKMS_API_URL }}
          OPENKMS_AUTH_MODE: local
          OPENKMS_CLI_BASIC_USER: ${{ secrets.OPENKMS_CLI_BASIC_USER }}
          OPENKMS_CLI_BASIC_PASSWORD: ${{ secrets.OPENKMS_CLI_BASIC_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
        run: |
          ARGS_JSON='${{ inputs.worker_cli_args }}'
          if [ -n "$ARGS_JSON" ] && [ "$ARGS_JSON" != "null" ]; then
            uv run openkms-cli $(python3 -c 'import json,sys; print(" ".join(json.loads(sys.argv[1])))' "$ARGS_JSON")
          else
            uv run openkms-cli audio-capture post-process --job-id "${{ inputs.job_id }}"
          fi

      - name: Mark job failed on workflow error
        if: failure()
        env:
          OPENKMS_API_URL: ${{ secrets.OPENKMS_API_URL }}
          OPENKMS_CLI_BASIC_USER: ${{ secrets.OPENKMS_CLI_BASIC_USER }}
          OPENKMS_CLI_BASIC_PASSWORD: ${{ secrets.OPENKMS_CLI_BASIC_PASSWORD }}
        run: |
          JOB_ID="${{ inputs.job_id }}"
          curl -fsS -X PATCH "${OPENKMS_API_URL%/}/internal-api/audio-capture-pipeline/jobs/${JOB_ID}" \
            -u "${OPENKMS_CLI_BASIC_USER}:${OPENKMS_CLI_BASIC_PASSWORD}" \
            -H "Content-Type: application/json" \
            -d '{"stage":"failed","error_message":"GitHub Actions worker failed before capture post-process completed"}' \
            || echo "::warning::Could not mark capture pipeline job as failed"
