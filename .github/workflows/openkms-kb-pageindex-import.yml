# PageIndex knowledge base import — isolated from document parse pipeline.
#
# Manual: Actions → OpenKMS KB PageIndex Import → Run workflow → job_id from app_kb_import_jobs.
# Trigger API (backend):
#   POST /repos/{owner}/{repo}/actions/workflows/openkms-kb-pageindex-import.yml/dispatches

name: OpenKMS KB PageIndex Import

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: PageIndex KB import job UUID (app_kb_import_jobs.id)
        required: true
        type: string

concurrency:
  group: openkms-kb-pageindex-import-${{ inputs.job_id }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: openkms-cli

jobs:
  pageindex-import:
    name: pageindex-import (${{ inputs.job_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: openkms-cli/uv.lock

      - name: Restore virtualenv cache
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: openkms-cli/.venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('openkms-cli/uv.lock') }}

      - name: Install dependencies
        run: uv sync --frozen --extra pipeline

      - name: Validate backend URL
        env:
          OPENKMS_API_URL: ${{ secrets.OPENKMS_API_URL }}
        run: |
          if [ -z "$OPENKMS_API_URL" ]; then
            echo "::error::GitHub secret OPENKMS_API_URL is not set."
            exit 1
          fi
          case "$OPENKMS_API_URL" in
            http://127.0.0.1:*|http://localhost:*|https://127.0.0.1:*|https://localhost:*)
              echo "::error::OPENKMS_API_URL points to localhost — GitHub runners cannot reach your machine."
              exit 1
              ;;
          esac
          curl -fsS --max-time 15 "${OPENKMS_API_URL%/}/health" || {
            echo "::error::Backend health check failed."
            exit 1
          }

      - name: Run PageIndex KB import
        env:
          OPENKMS_API_URL: ${{ secrets.OPENKMS_API_URL }}
          OPENKMS_AUTH_MODE: local
          OPENKMS_CLI_BASIC_USER: ${{ secrets.OPENKMS_CLI_BASIC_USER }}
          OPENKMS_CLI_BASIC_PASSWORD: ${{ secrets.OPENKMS_CLI_BASIC_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
        run: |
          uv run openkms-cli kb pageindex-import --job-id "${{ inputs.job_id }}"
