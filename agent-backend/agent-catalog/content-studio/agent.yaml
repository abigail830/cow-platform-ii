id: content-studio
displayName: Content Studio
description: Generate Word documents, PowerPoint decks, and HTML reveal.js presentations.
icon: Presentation

model:
  configName: gpt-5.4
  profile: azure-openai

prompt: ./prompt.md

skills:
  - ./skills/html-slides
  - ./skills/pptx
  - ./skills/docx

tools:
  packs: []

mcp: []

sandbox:
  provider: e2b
  templateId: okf-content-studio:1.2
  cwd: /home/user/content-studio

access:
  defaultForRoles:
    - admin
    - agent-player

a2a:
  enabled: true
