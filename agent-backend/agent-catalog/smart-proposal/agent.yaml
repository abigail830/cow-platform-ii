id: smart-proposal
displayName: Proposal Chef
description: Smart proposal compose assistant using the OKF knowledge bundle.
icon: ChefHat

model:
  configName: gpt-5.4-mini
  profile: glm-4.7-flash

prompt: ./prompt.md

skills: []

tools:
  packs:
    - name: okf
      bundle: ${OKF_BUNDLE_PATH}

mcp: []

sandbox:
  provider: none

access:
  defaultForRoles:
    - admin
    - agent-player

a2a:
  enabled: true
  skills:
    - id: smart-proposal
      name: Proposal Chef
      description: Smart proposal compose assistant using the OKF knowledge bundle.
      tags:
        - product:smart-proposal
        - role:compose
      examples:
        - Draft a proposal outline for a new enterprise client.
        - Summarize the key sections we should include in a services proposal.
