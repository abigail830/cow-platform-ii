id: content-studio
displayName: Content Studio
description: Generate Word documents, PowerPoint decks, and HTML reveal.js presentations.
icon: Presentation

model:
  # configName: gpt-5.4
  configName: deepSeek-V4-Flash
  profile: glm-4.7-flash

prompt: ./prompt.md

skills:
  - /agent-assets/skills/html-slides
  - /agent-assets/skills/pptx
  - /agent-assets/skills/docx

mcp: []

sandbox:
  provider: e2b
  templateId: okf-content-studio:1.2
  cwd: /home/user/content-studio

