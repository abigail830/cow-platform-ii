id: kb-qa
displayName: Knowledge Q&A
description: Answer questions using hybrid search over knowledge bases, with web search when KB coverage or timeliness is insufficient.
icon: MessageCircleQuestion

model:
  # configName: glm-4.7-flash
  configName: deepSeek-V4-Flash
  # configName: qwen3.7-flash
  profile: glm-4.7-flash

prompt: ./prompt.md

skills:
  - /agent-assets/skills/kb-qa

#-------------------------------------------------
# {
#   "mcpServers": {
#     "okf-hybrid-search": {
#       "url": "https://cow-platform.vercel.app/api/mcp/hybrid-search",
#       "headers": {
#         "Authorization": "Bearer okf_你的密钥"
#       }
#     }
#   }
# }
#-------------------------------------------------
mcp:
  - name: hybrid-search
    urlEnv: HYBRID_SEARCH_MCP_URL
    transport: streamable-http
    headersEnv:
      Authorization: HYBRID_SEARCH_MCP_API_KEY
    allowTools:
      - mcp__hybrid-search__list_knowledge_bases
      - mcp__hybrid-search__hybrid_search
  - name: zhipu-web-search
    urlEnv: ZHIPU_WEB_SEARCH_MCP_URL
    transport: streamable-http
    headersEnv:
      Authorization: ZHIPU_API_KEY
    allowTools:
      - mcp__zhipu-web-search__web_search_prime


context:
  temporal: true
  timezone: Asia/Shanghai

access:
  defaultForRoles:
    - admin
    - agent-player

a2a:
  enabled: true
  skills:
    - id: kb-qa
      name: Knowledge Q&A
      description: Answer questions using hybrid search over accessible knowledge bases, with web search when needed.
      tags:
        - product:kb-qa
        - retrieval:hybrid-search
        - retrieval:web-search
      examples:
        - What does our documentation say about deployment?
        - Search the FAQ knowledge base for refund policy.
