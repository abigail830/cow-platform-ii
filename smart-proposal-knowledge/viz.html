** regulated/performed? | VN payroll for VN factory (often = entity jurisdiction) |\n\n**Region** is always about **us**. **Entity jurisdiction** is about **the subject company** in that proposal section.\n\n### What is NOT \u00abjurisdiction\u00bb in this bundle\n\n| Term | Use instead | Notes |\n|------|-------------|-------|\n| Client's home country (\u4e2d\u56fd\u5ba2\u6237) | `client_domicile: CN` *(optional, deal metadata)* | Ultimate parent nationality; rarely drives template/blocks |\n| Where the PDF is sent from | `region` | Already covered |\n| Multi-country **engagement** | Multiple proposals or `entity_jurisdictions: [...]` | One deal \u2260 one jurisdiction |\n\n## Multi-jurisdiction example (\u4e2d\u56fd\u5ba2\u6237\u51fa\u6d77)\n\nScenario: PRC client \u2192 BVI holdco (tax) + SG/HK opco + VN factory.\n\n| Layer | Values | Proposal handling |\n|-------|--------|-------------------|\n| Client domicile | CN | Deal context only; do not copy PII into concepts |\n| Entity 1 \u2014 holdco | `entity_jurisdiction: BVI` | Harneys UK letter \u2014 `template_id: harneys-uk` |\n| Entity 2 \u2014 trading | `entity_jurisdiction: SG` or `HK` | InCorp `region:SG` or `region:HK` proposal |\n| Entity 3 \u2014 factory | `entity_jurisdiction: VN` | InCorp `region:VN` \u2014 CS / tax / payroll / HR |\n| **Engagement** | `{BVI, SG, VN}` | **3 documents** or 1 master doc with 3 scoped fee modules |\n\n```text\nEngagement (deal)\n\u251c\u2500\u2500 Proposal A  region:UK   entity_jurisdictions:[BVI]     Harneys holdco\n\u251c\u2500\u2500 Proposal B  region:SG   entity_jurisdictions:[SG]      SG opco\n\u2514\u2500\u2500 Proposal C  region:VN   entity_jurisdictions:[VN]      VN subsidiary + payroll\n```\n\nDo **not** tag a single Reference Proposal as `jurisdiction:BVI` when the body also covers VN factory services \u2014 split artifacts or list all `entity_jurisdictions`.\n\n## Harneys: region \u00d7 entity jurisdiction\n\nHarneys **regions** (HK, UK) issue proposals for **entity jurisdictions** (BVI, Cayman) where the vehicle is formed.\n\n| Sample | Issuing region | Entity jurisdiction |\n|--------|----------------|---------------------|\n| `harneys-uk-BVI_*` | UK | BVI |\n| `harneys-uk-CAYMAN_*` | UK | Cayman |\n| `harneys-hk-Incorporation` | HK | HK |\n\n## InCorp regions\n\nOperating markets (issuing `region`): SG, AU, PH, VN, MY, ID, HK, CN, IN, \u2026\n\nFor **local incorporation** proposals, `region` and `entity_jurisdiction` usually match (SG office \u2192 SG company). For **cross-border** work (SG office helping a BVI structure), tag both explicitly.\n\n## Rikvin (InCorp SG immigration)\n\nRikvin is a **brand track** under InCorp SG \u2014 not a separate BU or issuing region. Tag `rikvin` when routing immigration-only proposals or EP modules with the subsidiary disclaimer.\n\n| Concept | Value |\n|---------|-------|\n| Tags | `incorp`, `rikvin`, `region:SG`, `jurisdiction:SG` |\n| Services | Employment Pass, DP, PEP/ONE Pass, education verification |\n| Routing | [Rikvin \u2014 SG immigration](/meta/region-routing.md#rikvin--sg-immigration) |\n\n## Frontmatter conventions\n\n**Single-entity proposal** (most reference samples):\n\n```yaml\ntags: [incorp, region:VN, jurisdiction:VN]\n# jurisdiction: = primary entity_jurisdiction (shorthand tag)\n```\n\n**Multi-entity proposal** (future):\n\n```yaml\ntags: [incorp, region:SG]\nentity_jurisdictions: [BVI, SG, VN]\nprimary_entity_jurisdiction: BVI   # drives Harneys block pack when mixed\n```\n\nOptional deal-level only (not on Reference Proposal bodies):\n\n```yaml\nclient_domicile: CN\n```\n\n## Path conventions\n\n| Content | Path |\n|---------|------|\n| Region-owned prose (AU Payment Options) | `blocks/{bu}/regions/{region}/` |\n| Entity-law prose (BVI Approved Manager) | `blocks/{bu}/jurisdictions/{entity_jurisdiction}/` |\n| BU-wide shared | `blocks/{bu}/shared/` |\n\n`catalogs/products/{region}.md` keys off **issuing region** (which DB to query).  \nHarneys MDM / required-docs keys off **entity jurisdiction** (BVI vs Cayman).\n\n## Routing\n\n- [Region routing](/meta/region-routing.md) \u2014 layout & catalog by **issuing region**\n- Entity jurisdiction \u2014 Harneys block packs, `selection` on Section Blocks, MDM product scope"}, {"id": "meta/locale-references", "type": "Reference", "title": "Locale references", "description": "How to register multilingual and placeholder-shell Reference Proposals without forking templates. One template_id per product spine; locale samples are extra references only.", "tags": ["meta", "locale", "i18n", "examples"], "group": "meta", "sz": 33, "body": "# Locale references\n\nOne **Proposal Template** per product spine. Language variants are extra **Reference Proposal** concepts \u2014 not Unmapped, not separate templates.\n\n## Frontmatter\n\n| Field | When | Values |\n|-------|------|--------|\n| `template_id` | Always (when mapped) | Same as anchor \u2014 e.g. `vn-incorp` |\n| `reference_role` | Non-anchor samples | `locale` (omit on anchor = default anchor) |\n| `locale` | Language of this file | `zh-CN`, `en`, `bilingual`, \u2026 |\n| `content_mode` | Optional | `filled` (default), `placeholder` (`[[merge]]` shell study) |\n\nTemplate `anchor_example` always points to the **primary anchor** (usually `content_mode: filled`). Locale rows live only in [examples/index.md](/examples/index.md#locale-references-same-template).\n\n## Three patterns\n\n| Pattern | Example | Blocks |\n|---------|---------|--------|\n| **Anchor in locale X** | `hk-incorp` anchor is zh-CN | Promote blocks from anchor extraction; `locale` tags which language this anchor uses |\n| **Locale reference** | `vn-incorp` + zh-CN placeholder PPT | Same `sections[]` as template; compose picks block text by `locale` at runtime (future) or separate block paths per locale when promoted |\n| **Bilingual single file** | `harneys-hk` EN + zh-CN in one docx | One block per section; body contains both languages |\n\n## Do not\n\n- Create `vn-incorp-zh-cn` template_id \u2014 use `vn-incorp` + `reference_role: locale`\n- List locale samples under Unmapped when `template_id` is known\n- Duplicate spine tables between anchor and locale concepts \u2014 index table is enough\n- Promote locale placeholder prose into blocks when anchor `text.txt` has the canonical wording\n\n## Adding a new locale sample\n\n1. Ingest docx/pptx \u2192 `references/extractions/{slug}/`\n2. Write `examples/{name}.md` with `template_id`, `reference_role: locale`, `locale`\n3. Add one row to **Locale references** in `examples/index.md`\n4. Promote translated blocks only when anchor extraction lacks that language"}, {"id": "meta/region-routing", "type": "Reference", "title": "Region routing", "description": "Default quotation layout, templates, and catalog seeds by **BU** and issuing region. Layouts are shape-named; region only sets defaults. See layouts/index.md.", "tags": ["meta", "routing", "region"], "group": "meta", "sz": 44, "body": "# Region routing\n\n**Region** = issuing office. **Layout** = fee-table shape ([catalog](/layouts/index.md)). Defaults are **per BU** (InCorp, Rikvin, Harneys) \u2014 not a single global region table.\n\nExample \u2194 template mapping lives in [examples/index.md](/examples/index.md) only.\n\n## Layout selection order\n\n1. Explicit user / agent request (any `layout_id` from [registry](/layouts/index.md))\n2. Package `default_layout`\n3. **BU + region** default (tables below: InCorp \u2192 Rikvin \u2192 Harneys)\n4. Fallback: **`fee-billing`**\n\n## InCorp \u2014 by issuing region\n\n| Region | Default layout | Default `template_id` | Product catalog | Package catalog |\n|--------|----------------|----------------------|-----------------|-----------------|\n| SG | [oneoff-recurring](/layouts/oneoff-recurring.md) | `sg-incorp` (+ `sg-audit` special) | [sg](/catalogs/products/sg.md) | [sg](/catalogs/packages/sg.md) |\n| AU | [multi-frequency](/layouts/multi-frequency.md) | `au-advisory` (+ `au-audit` special) | [au](/catalogs/products/au.md) | [au](/catalogs/packages/au.md) |\n| PH | [multi-frequency](/layouts/multi-frequency.md) | `ph-incorp` (+ `ph-recruitment` special) | [ph](/catalogs/products/ph.md) | [ph](/catalogs/packages/ph.md) |\n| HK | TBD | `hk-incorp` | planned | planned |\n| VN | TBD | `vn-incorp` | planned | planned |\n| MY | [fee-billing](/layouts/fee-billing.md) | `sp-flexible` | [my](/catalogs/products/my.md) | [my](/catalogs/packages/my.md) |\n| ID | TBD | `sp-flexible` | planned | planned |\n| IN | TBD | `sp-flexible` | planned | planned |\n| CN | TBD | `sp-flexible` | planned | planned |\n\nCells marked **planned** are filled in Phase 2+.\n\n## Rikvin \u2014 SG immigration\n\nRikvin is **not** a separate issuing region. It is an **InCorp SG** brand track for regulated immigration services (Employment Pass, DP, PEP/ONE Pass, education verification).\n\nRoute here when `rikvin` is in tags, or scope is immigration-only \u2014 not the generic InCorp SG row above.\n\n| Field | Value |\n|-------|-------|\n| BU / brand | `incorp` + tag `rikvin` |\n| Issuing region | SG (same office as InCorp SG) |\n| Entity jurisdiction | SG |\n| Default layout | [oneoff-recurring](/layouts/oneoff-recurring.md) |\n| Default `template_id` | `sg-incorp` (Rikvin blocks; not a separate template) |\n| Product catalog | [sg](/catalogs/products/sg.md) \u2014 immigration SKUs |\n| Package catalog | [sg](/catalogs/packages/sg.md) |\n\n**Composition patterns**\n\n| Pattern | Notes |\n|---------|-------|\n| Standalone immigration proposal | Rikvin-branded fees + subsidiary disclaimer after each fee block |\n| EP module inside broader InCorp SG deck | CS/accounting + EP table + Rikvin disclaimer on same `sg-incorp` spine |\n\n**Block candidates (Phase 2):** Rikvin disclaimer (UEN / EA licence) \u2192 `blocks/incorp/regions/sg/`.\n\n## Harneys \u2014 issuing region \u00d7 entity jurisdiction\n\n| Issuing region | Entity jurisdiction | `template_id` |\n|----------------|---------------------|---------------|\n| UK | BVI | `harneys-uk` |\n| UK | Cayman | `harneys-uk` |\n| HK | HK | `harneys-hk` |\n\n## BU summary\n\n| BU | Issuing regions | Routing section | How entity jurisdiction works |\n|----|-----------------|-----------------|------------------------------|\n| **InCorp** | SG, AU, PH, HK, VN, MY, ID, IN, CN | [InCorp table](#incorp--by-issuing-region) | Default: entity jurisdiction = issuing region. Cross-border: tag both explicitly. |\n| **Rikvin** | SG only (`incorp` + `rikvin` tag) | [Rikvin table](#rikvin--sg-immigration) | SG immigration; shares InCorp SG layout/catalog defaults. |\n| **Harneys** | HK, UK | [Harneys table](#harneys--issuing-region--entity-jurisdiction) | Entity jurisdiction \u2260 region (BVI, Cayman, \u2026). |\n\n[BU / region / jurisdiction](/meta/bu-region-jurisdiction.md)\n\n## Data source priority\n\n1. **Live** \u2014 [Data Adapter](/catalogs/adapters/) \u2014 MySQL per **issuing region**; PG MDM per **entity jurisdiction** (Harneys)\n2. **Seed** \u2014 `catalogs/products/{region}.md`\n3. **Structure only** \u2014 Reference Proposal concepts (`template_id` in frontmatter; catalog at [examples/index.md](/examples/index.md))"}, {"id": "meta/type-vocabulary", "type": "Reference", "title": "Smart Proposal type vocabulary", "description": "OKF concept types and path patterns for the smart-proposal-knowledge bundle. Section prose uses a single Section Block type with optional inclusion rules.", "tags": ["meta", "vocabulary", "smart-proposal-knowledge"], "group": "meta", "sz": 56, "body": "# Type vocabulary\n\nCanonical spec: [SPEC.md](../../SPEC.md). Only `type` is required per concept.\n\n| `type` | Concept path pattern | Purpose |\n|--------|---------------------|---------|\n| `Extraction Spine` | `references/extractions/{slug}/spine.md` | Layer 1 PII-redacted section index from office ingest |\n| `Shell Zone Map` | `references/extractions/{run}/word/zones.md`, `.../pptx/slides.md` | Layer 1 Output Shell zone/slide map from brand shell ingest |\n| `Proposal Template` | `templates/{id}.md` | Section spine, block references, fee_layout, export config |\n| `Section Block` | `blocks/{bu}/regions/{region}/{name}.md` or `blocks/{bu}/jurisdictions/{jurisdiction}/{name}.md` | Reusable chapter prose **with optional inclusion rules** |\n| `Quotation Layout` | `layouts/{layout_id}.md` | Fee table columns and formatting |\n| `Layout Registry` | `layouts/index.md` | Layout list and region defaults |\n| `Product Catalog` | `catalogs/products/{region}.md` | SKU seed data |\n| `Package Catalog` | `catalogs/packages/{region}.md` | Bundle seed data |\n| `Data Adapter` | `catalogs/adapters/*.md` | Live DB query contract (MySQL / PG MDM) |\n| `Output Shell` | `brand/ascentium-{word,pptx}-shell.md` | Brand master \u2014 anchors, placeholders, sealed zones |\n| `Reference Proposal` | `examples/{name}.md` | Structure index from sample docx/pptx (no PII) |\n| `Brand Guideline` | `brand/*.md` | Colors, fonts, UX constraints |\n| `Attested Computation` | `computations/*.md` | Verifiable fee or tax logic |\n| `Playbook` | `playbooks/*.md` | Matching, compose, assembly rules |\n| `Reference` | `meta/*.md` | Bundle meta documentation |\n\n## Section Block model (unified)\n\nAll proposal prose sections are **`Section Block`**. There is no separate `Category Catalog` or `Document Block`.\n\nDifference between \"fixed\" and \"conditional\" sections is **not** a different `type` \u2014 it is whether the block carries **inclusion rules**.\n\n### Always-on vs conditional\n\n| Pattern | How it is expressed |\n|---------|---------------------|\n| **Fixed section** (e.g. Introduction) | Template references block; block has no `selection` (or `selection.mode: always`) |\n| **Conditional section** (e.g. Individual KYC) | Same `Section Block`; frontmatter `selection` defines when to include |\n| **Composed chapter** (e.g. Required documents) | Template defines a `compose_group`; multiple blocks with matching `compose_group` are merged when each passes its `selection` |\n\n### Recommended `selection` frontmatter (optional)\n\n```yaml\nselection:\n  mode: conditional          # always | conditional | append_when_any\n  include_when: \"...\"        # natural language or structured trigger (fee rows, packages, region)\n  exclude_when: \"...\"\n  append_when_any: [block_id, ...]   # for closing / footer blocks\n  requires_structure: false  # if true, need client structure facts before compose\n  trigger_source: solution_and_fees    # which proposal section feeds triggers\n  order: 10\ncompose_group: harneys-required-docs   # blocks merged under same template chapter\npost_process: \"...\"          # agent-only notes (e.g. prune Reserve Director item)\n```\n\nRules in `selection` are **agent-facing**; the block body is **client-facing** prose only.\n\n### Proposal Template references blocks\n\nTemplate body (or frontmatter) lists the spine \u2014 no separate catalog file:\n\n```yaml\nsections:\n  - id: introduction\n    block: /blocks/harneys/introduction-bvi.md\n    required: true\n\n  - id: required_documents\n    title: Required documents\n    compose_group: harneys-required-docs\n    trigger_source: solution_and_fees\n```\n\nConsumer resolves: load all `Section Block` concepts with `compose_group: harneys-required-docs`, evaluate each `selection`, sort by `order`, apply `post_process`, concatenate.\n\n### Block paths vs Reference Proposals\n\n| Source | Target | Auto on ingest? |\n|--------|--------|-----------------|\n| [Reference Proposal](/examples/index.md) | Spine, fee pattern, block **candidates** | Yes |\n| Sample paragraph text | [Section Block](/blocks/index.md) body | **No** \u2014 promote after dedup, placeholderize, human `verified` |\n\nPath pattern: `blocks/{bu}/regions/{region}/`, `blocks/{bu}/jurisdictions/{jurisdiction}/`, or `blocks/{bu}/shared/` (cross-region optional sections) \u2014 see [bu-region-jurisdiction](/meta/bu-region-jurisdiction.md).\n\n### Section Block `render`\n\n| Value | Body source |\n|-------|-------------|\n| `text` | `references/extractions/{slug}/text.txt` \u2014 placeholderize PII |\n| `visual_pending` | Image-only in sample \u2014 spine in body, no synthesized prose |\n| `visual_asset` | `resource: references/ux/...` when registered |\n\nPromotion workflow: extract from `references/extractions/{slug}/text.txt` per bundle conventions. Pilot path: `blocks/incorp/regions/sg/`.\n\n## Legacy mapping\n\n| agent-platform | OKF (unified) |\n|----------------|---------------|\n| `blocks/introduction-bvi.md` | `Section Block` \u2014 no `selection` |\n| `knowledge.category: harneys` + catalog + `peripheral/required-docs/harneys/*.md` | Multiple `Section Block` under `blocks/harneys/` each with `selection` + shared `compose_group` |\n| `required-docs-harneys-catalog.md` | **Dissolved** \u2014 rules move onto each block's `selection`; compose list lives in Proposal Template `harneys-uk` |\n\n## Removed types (do not use)\n\n| Former type | Replaced by |\n|-------------|-------------|\n| `Category Catalog` | `selection` on `Section Block` + `compose_group` on template |\n| `Document Block` | `Section Block` |\n| `Credential Block` | `Section Block` under `blocks/{bu}/` |\n| `Team Bio Block` | `Section Block` under `blocks/audit/` or region folder |\n\n## Recommended frontmatter (v0.2)\n\nBeyond `type`, set when known: `title`, `description`, `tags`, `resource`, `sources`, `status`, `generated`, `verified`, `stale_after`.\n\n### Routing fields (do not duplicate in markdown links)\n\n| Concept | Field | Authoritative catalog |\n|---------|-------|----------------------|\n| `Reference Proposal` | `template_id` | [examples/index.md](/examples/index.md) |\n| `Reference Proposal` | `reference_role`, `locale`, `content_mode` | [locale-references.md](/meta/locale-references.md) |\n| `Proposal Template` | `template_id`, `anchor_example`, `sections[]` | [templates/index.md](/templates/index.md) |\n\nEach relationship is declared once \u2014 see project skill `linking-policy.md` under `.cursor/skills/smart-proposal-knowledge/references/`.\n\n## Region tags\n\n`SG`, `AU`, `PH`, `MY`, `HK`, `VN`, `BVI`, `Cayman`, `InCorp`, `Harneys`, `Rikvin`."}, {"id": "references/extractions/brand-shell-20260726/pptx/slides", "type": "Shell Zone Map", "title": "Layer 1 slide map \u2014 Ascentium PPT shell", "description": "PPT Output Shell slide roles, merge keys, and content-insert rules from office ingest.", "tags": [], "group": "references", "sz": 32, "body": "# PPT brand shell \u2014 slide map (Layer 1)\n\nSource: `references/templates/ascentium-pptx-brand-shell.pptx`  \nExtractor: `officecli view text` + `outline` (2026-07-26)\n\nPromoted to [Ascentium PPT brand shell](/brand/ascentium-pptx-shell.md).\n\n## Slide zones\n\n| # | Role | Marker text | Agent action |\n|---|------|-------------|--------------|\n| 1 | Title / cover | `{{proposal_title}}`, `{{proposal_date}}`, `PRIVATE & CONFIDENTIAL` | `merge` |\n| 2 | Why Partner / KPIs | `Why Partner with Ascentium?` + stat tiles | Keep unless user drops credentials |\n| 3 | Global footprint | `Our Global Footprint` + region lists | Keep unless user drops |\n| 4 | Service offerings | `Our Service Offerings` + capability grid | Keep or trim on request |\n| 5 | **Sealed tail** | `We Are Ascentium` | **Never add proposal body here** |\n| 6 | **Contact** | `Contact Us` + merge fields | `merge`; must stay last |\n\n## Merge keys (observed in file)\n\n| Key | Slide |\n|-----|-------|\n| `proposal_title` | 1 |\n| `proposal_date` | 1 |\n| `contact_name` | 6 |\n| `contact_title` | 6 |\n| `contact_email` | 6 |\n| `contact_number` | 6 |\n\n## Content insertion\n\n- Insert all proposal content slides **after slide 4** (`--after /slide[4]`, chain as indices shift).\n- Use layout **`Clean Slide - White`** \u2014 never default cover layout.\n- **Never** `--after /slide[5]` or `/slide[6]` on the pristine 6-slide shell.\n\n## Body shape defaults (content slides)\n\n| Element | Props |\n|---------|-------|\n| Body text | `x=1.5cm y=3.5cm width=22cm height=12cm size=18pt font=Poppins` |\n| Table | `x=1.5cm y=3.8cm height=12cm` + `colWidths` in cm (~22cm total) |\n\n## Deprecated\n\n`page_title` content slot removed (Jul 2026 trim). Do not merge body headings via `page_title`."}, {"id": "references/extractions/brand-shell-20260726/word/zones", "type": "Shell Zone Map", "title": "Layer 1 zone map \u2014 Ascentium Word shell", "description": "Word Output Shell page zones, merge keys, and body-insert anchors from office ingest.", "tags": [], "group": "references", "sz": 34, "body": "# Word brand shell \u2014 zone map (Layer 1)\n\nSource: `references/templates/ascentium-word-brand-shell.docx`  \nExtractor: `officecli view text` + `query p` (2026-07-26)\n\nPromoted to [Ascentium Word brand shell](/brand/ascentium-word-shell.md).\n\n## Page zones\n\n| Zone | paraId | Signals | Agent action |\n|------|--------|---------|--------------|\n| Cover background | `00EDE8E5` | Full-page image (20.9\u00d729.7 cm, behind text) | Leave as-is |\n| Cover title slots | `6896C053`, `7A5D3034` | `{{proposal_title}}`, `{{proposal_date}}` | `merge` |\n| Credentials / offerings art | `340ADF8B` | 4 decorative images + page break at end | **Do not add proposal body here** |\n| **Body insert zone** | *(before)* `202EA4F9` | Empty \u2014 all proposal sections stack here | `add \u2026 --before /body/p[@paraId=202EA4F9]` |\n| Back-cover art | `202EA4F9` | `pageBreakBefore=true` + full-page image | **Sealed \u2014 never insert after** |\n| Close heading | `3CBF0169` | Static `CONTACT US` (#FF6816, 30pt) | Leave as-is |\n| Contact merge fields | `7D32076F`, `035430D4`, `4FE1E019` | `{{our_contact_name}}`, `{{our_contact_title}}`, `{{our_contact_number}}` | `merge` |\n| Footer URL | `275F09EF` | `https://www.ascentium.com` | Leave as-is |\n\n## Merge keys (observed in file)\n\n| Key | Location |\n|-----|----------|\n| `proposal_title` | Cover |\n| `proposal_date` | Cover |\n| `our_contact_name` | Back cover |\n| `our_contact_title` | Back cover |\n| `our_contact_number` | Back cover |\n\n> Legacy flexon docs use `contact_name` / `contact_title` / `contact_number` \u2014 this shell file uses `our_contact_*`. Map at merge time.\n\n## Body typography defaults (for `add`)\n\n| Prop | Value |\n|------|-------|\n| `font` | Poppins |\n| `size` | 11pt body, 16pt major headings |\n| `lineSpacing` | 1.0x, `lineRule=auto` |\n| `spaceAfter` | 6pt |\n| `pageBreakBefore` | true on major chapter headings **except** the first body chapter |\n\n## Table width\n\nPrintable body width \u2248 **8800 twips**. Example 3-col: `2200,3200,3400`.\n\n## Deprecated anchors (do not use)\n\n`52E883DC`, `4676E560` \u2014 see `ascentium-word-brand-shell.anchors.json`."}, {"id": "references/extractions/harneys-hk-incorporation/spine", "type": "Extraction Spine", "title": "Layer 1 spine \u2014 harneys-hk-incorporation", "description": "PII-redacted section index from office ingest (Layer 1 staging).", "tags": [], "group": "references", "sz": 27, "body": "# Spine (PII-redacted)\n\nSource: `harneys-hk-Incorporation.docx`\n\n## Stats\n207 paragraphs, 19 tables, 5 images. Bilingual EN/ZH. Content control wrapper on cover.\n\n## Document type\nHarneys/Ascentium **company formation & administration rates schedule** (HK), not a standard fee letter.\n\n## Structure\n| Zone | Content |\n|------|---------|\n| Cover | COMPANY FORMATION AND ADMINISTRATION RATES / \u516c\u53f8\u6210\u7acb\u53ca\u7ba1\u7406\u8d39\u7528 / `{{client.company_name}}` |\n| Main rates | tbl[1] \u2014 37-row master schedule |\n| Footnotes | Foot Notes \u811a\u6ce8, Notes \u6ce8 |\n| Supporting tables | tbl[2]\u2013tbl[19] \u2014 jurisdiction-specific rate blocks |\n\n## Fee pattern\nMatrix-style administration rates. **Not** `oneoff-recurring` layout.\n\n## Tags\nHarneys, HK, bilingual, rates-schedule"}, {"id": "references/extractions/harneys-uk-bvi-all-options/spine", "type": "Extraction Spine", "title": "Layer 1 spine \u2014 harneys-uk-bvi-all-options", "description": "PII-redacted section index from office ingest (Layer 1 staging).", "tags": [], "group": "references", "sz": 28, "body": "# Spine (PII-redacted)\n\nSource: `harneys-uk-BVI_All_Options.docx`\n\n## Stats\n166 paragraphs, 11 tables, 17 images.\n\n## Section spine\n1. Cover letter \u2014 services requested (Incorporation, Approved Manager, Compliance, Director services)\n2. About Ascentium / Fiduciary heritage\n3. **Incorporation** \u2014 setup fee block + tbl[1]; annual maintenance + tbl[2]\n4. Excluded / ad-hoc services list (certificates, FATCA, courier, etc.)\n5. KYC table tbl[3]\n6. Approved Manager regime \u2014 benefits + tbl[4]\n7. Service descriptions (company formation, registered agent, compliance, AEOI)\n8. **Optional Items** \u2014 tbl[5]\n9. **Annual fees** \u2014 tbl[6]\u2013tbl[8]\n10. AEOI full scope\n11. What we will need from you / General\n\n## Fee pattern\nOption blocks: incorporation one-off + annual maintenance + optional line items. USD. Harneys options-letter format.\n\n## Layout\nCustom Harneys/BVI \u2014 not `oneoff-recurring` or `multi-frequency`."}, {"id": "references/extractions/harneys-uk-cayman-all-options/spine", "type": "Extraction Spine", "title": "Layer 1 spine \u2014 harneys-uk-cayman-all-options", "description": "PII-redacted section index from office ingest (Layer 1 staging).", "tags": [], "group": "references", "sz": 27, "body": "# Spine (PII-redacted)\n\nSource: `harneys-uk-CAYMAN_All_Options.docx`\n\n## Stats\n325 paragraphs, 10 tables, 21 images.\n\n## Section spine\n1. Cover letter \u2014 Cayman services requested\n2. About Ascentium\n3. **Incorporation** \u2014 setup + annual blocks\n4. **Foundation** \u2014 Cayman foundation explainer + fees (without Supervisor)\n5. **CIMA regulated SPC fund transfer** \u2014 scope, annual fees, work outside scope\n6. Optional items / annual fee tables\n7. What we will need from you\n\n## Fee pattern\nMulti-pr PII-redacted)\n\nSource: `incorp-ph-CS-payroll-bookkeeping-ep.docx`\n\n## Stats\n\n395 paragraphs, 10 tables, 35 images. In.Corp PH template.\n\n## Section spine\n\n1. Cover + TOC + credentials (About \u2192 Accreditations)\n2. RE: FEE PROPOSAL letter\n3. **SERVICES AND FEES** \u2014 four fee modules:\n   - INCORPORATION AND POST-COMPLIANCE \u2014 tbl[4] (Monthly / Annually / One-off / **Total**)\n   - PAYROLL SERVICES \u2014 tbl[5]\n   - GENERAL BOOKKEEPING AND TAX COMPLIANCE \u2014 tbl[6]\n   - IMMIGRANT VISA \u2013 PERMANENT RESIDENT VISA \u2014 tbl[7] (One-off / Total)\n4. **SERVICE SLAs** \u2014 tbl[8] work-product SLA matrix; DEPOSIT FOR EXPENSES; REFUND POLICY \u2014 tbl[9]\n5. **CORPORATE SECRETARIAL AND RESIDENT Agent SERVICES** \u2014 scope / exclusions / terms / indemnity\n6. **Corporate Treasurer Service** \u2014 post-incorporation officer scope\n7. **Nominee Director Service**\n8. **GENERAL BOOKKEEPING AND TAX COMPLIANCE** \u2014 terms A\u2013F\n9. **PAYROLL SERVICES** \u2014 scope + terms; payroll schedule tbl[10]\n10. **IMMIGRATION** \u2014 scope / exclusions\n11. **UNIFIED TERMS AND CONDITIONS** \u2014 pre-termination / freezework / data privacy / governing law\n\n## Fee pattern\n\nPHP. Layout `multi-frequency` with optional **Total** column.\n\n| Module | Table | Rows | Total column |\n|--------|-------|------|--------------|\n| Incorporation and post-compliance | tbl[4] | 13 | Yes |\n| Payroll | tbl[5] | 6 | Yes |\n| Bookkeeping and tax | tbl[6] | 7 | Yes |\n| Immigrant visa | tbl[7] | 2 | Yes (one-off only) |\n\nTotal column rollup validated by [fee-table-total-column](/computations/fee-table-total-column.md).\n\n## Section Block candidates\n\nSERVICE SLAs (tbl[8] + deposit + refund), CS scope/exclusions/terms, corporate treasurer, nominee director, bookkeeping terms, payroll scope/terms, immigration scope/exclusions, unified T&Cs\n\n## Notes\n\nSupersedes `incorp-ph-cs` anchor \u2014 adds payroll, bookkeeping, EP fee modules and full SERVICE SLAs const PALETTE=["#6E56CF","#D97757","#22C55E","#3B82F6","#EAB308","#EC4899","#14B8A6","#F97316","#A855F7","#0EA5E9","#84CC16","#EF4444","#64748B"];
const byId=Object.fromEntries(NODES.map(n=>[n.id,n]));
const outL={}, inL={};
NODES.forEach(n=>{outL[n.id]=[];inL[n.id]=[];});
EDGES.forEach(e=>{outL[e.source].push(e.target);inL[e.target].push(e.source);});
const types=[...new Set(NODES.map(n=>n.type))].sort();
const color=Object.fromEntries(types.map((t,i)=>[t,PALETTE[i%PALETTE.length]]));
const off=new Set();
const cy=cytoscape({container:document.getElementById('cy'),minZoom:.2,maxZoom:1.6,wheelSensitivity:.2,

 style:[
  {selector:'node',style:{'background-color':'data(c)','label':'data(title)','color':'#e6e8ee',
   'font-size':10,'text-wrap':'wrap','text-max-width':120,'text-valign':'bottom','text-margin-y':4,
   'text-outline-width':2,'text-outline-color':'#0e0f13','min-zoomed-font-size':6,
   'width':'data(sz)','height':'data(sz)'}},
  {selector:'edge',style:{'width':1.2,'line-color':'#3a4150','target-arrow-color':'#3a4150',
   'target-arrow-shape':'triangle','arrow-scale':.8,'curve-style':'bezier','opacity':.7}},
  {selector:'.dim',style:{'opacity':.10}},{selector:'.hl',style:{'border-width':3,'border-color':'#fff'}}
 ],
 layout:{name:'cose',animate:false,nodeRepulsion:9000,idealEdgeLength:90,padding:40}});
const side=document.getElementById('side');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function relList(title,arr){if(!arr.length)return'';
 return `<div class="rel"><h4>${title}</h4>${arr.map(id=>`<a data-go="${esc(id)}">${esc((byId[id]||{}).title||id)}</a>`).join('')}</div>`;}
// Resolve an in-body markdown link href to a concept id, mirroring build()'s
// resolution: strip #anchor, require .md, absolute strips leading /, relative
// resolves against the current concept's dir. Returns null if it's not a concept.
function resolveHref(cid,href){let t=(href||'').split('#')[0];if(!t.endsWith('.md'))return null;
 let tgt;if(t[0]==='/'){tgt=t.replace(/^\/+/,'').slice(0,-3);}
 else{const base=cid.split('/').slice(0,-1);
  for(const seg of t.slice(0,-3).split('/')){if(seg===''||seg==='.')continue;
   if(seg==='..'){if(!base.length)return null;base.pop();}else base.push(seg);}
  tgt=base.join('/');}
 return byId[tgt]?tgt:null;}
function show(id){const n=byId[id];if(!n)return;const c=color[n.type];
 side.innerHTML=`<span class="type" style="background:${c}">${esc(n.type)}</span>
 <h2>${esc(n.title)}</h2><div class="desc">${esc(n.description)||'<span class=empty>no description</span>'}</div>
 <div class="tags">${(n.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
 ${relList('Links to',outL[id])}${relList('Cited by',inL[id])}
 <div class="body">${n.body?DOMPurify.sanitize(marked.parse(n.body)):'<span class=empty>empty body</span>'}</div>`;
 side.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>select(a.getAttribute('data-go')));
 side.querySelectorAll('.body a[href]').forEach(a=>{const tgt=resolveHref(id,a.getAttribute('href'));
  if(tgt)a.onclick=e=>{e.preventDefault();select(tgt);};});}
function select(id){const ele=cy.getElementById(id);if(!ele.length)return;show(id);
 cy.elements().removeClass('hl').addClass('dim');const nb=ele.closedNeighborhood();nb.removeClass('dim');ele.addClass('hl');
 cy.animate({center:{eles:ele},duration:250});
 try{if(decodeURIComponent((location.hash||'').slice(1))!==id)location.hash=encodeURIComponent(id);}catch(e){}}
cy.on('tap','node',e=>select(e.target.id()));
cy.on('tap',e=>{if(e.target===cy)cy.elements().removeClass('dim hl');});
function applyFilter(){const q=document.getElementById('search').value.toLowerCase();const ty=document.getElementById('type').value;
 cy.batch(()=>cy.nodes().forEach(n=>{const d=n.data();
  const m=(!q||(d.title+' '+d.type+' '+d.description+' '+(d.tags||[]).join(' ')).toLowerCase().includes(q))
        &&(!ty||d.type===ty)&&!off.has(d.type);
  n.style('display',m?'element':'none');}));}
let debounce;
document.getElementById('search').oninput=()=>{clearTimeout(debounce);debounce=setTimeout(applyFilter,150);};
document.getElementById('type').oninput=applyFilter;
const tysel=document.getElementById('type');types.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;tysel.appendChild(o);});
let curLayout='cose';
document.getElementById('layout').onchange=e=>{const v=e.target.value;
 if(v==='cose'&&NODES.length>1000&&!confirm(`force layout on ${NODES.length} concepts can freeze this tab — run anyway?`)){e.target.value=curLayout;return;}
 curLayout=v;cy.layout({name:v,animate:true,padding:40,nodeRepulsion:9000,idealEdgeLength:90}).run();};
document.getElementById('legend').innerHTML=types.map(t=>`<span class="chip" data-t="${esc(t)}"><span class="dot" style="background:${color[t]}"></span>${esc(t)} (${NODES.filter(n=>n.type===t).length})</span>`).join('');
document.querySelectorAll('#legend .chip').forEach(ch=>ch.onclick=()=>{const t=ch.getAttribute('data-t');
 if(off.has(t)){off.delete(t);ch.classList.remove('off');}else{off.add(t);ch.classList.add('off');}applyFilter();});
document.getElementById('layout').value='cose';
const Q=new URLSearchParams(location.search),QL=Q.get('layout'),QS=Q.get('select');
if(QL&&[...document.querySelectorAll('#layout option')].some(o=>o.value===QL)){document.getElementById('layout').value=QL;curLayout=QL;cy.layout({name:QL,animate:false,padding:40,nodeRepulsion:9000,idealEdgeLength:90}).run();}
function fromHash(){try{const h=decodeURIComponent((location.hash||'').slice(1));if(h&&byId[h])select(h);}catch(e){}}
addEventListener('hashchange',fromHash);
if(QS&&byId[QS])select(QS);else fromHash();
