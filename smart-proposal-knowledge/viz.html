<script>
const NODES=[{"id": "blocks/harneys/jurisdictions/bvi/adhoc-excluded-services", "type": "Section Block", "title": "Ad-hoc excluded services (BVI)", "description": "Services not included in annual maintenance \u2014 BVI anchor.", "tags": ["harneys", "jurisdiction:BVI", "template:harneys-uk"], "group": "blocks", "sz": 33, "body": "### Services and documents not included in the annual maintenance costs\n\nCosts not covered by our annual maintenance fee:\n\nCapital contribution: Fees to prepare resolutions for capital contributions will be estimated by our strategic alliance partner Harneys law firm. The costs will depend on the complexity of each case, however, for simple resolutions involving contributions only in cash, the fee will be $650 + disbursements of $150 to update the Register of Members.\n\nRedemption or distributions of dividends: Fees to prepare resolutions for redemption or distributions of dividends will be estimated by strategic alliance partner Harneys law firm. The costs will depend on the complexity of each case, however, for simple resolutions involving redemptions/distributions only in cash, the fee will be $850 + disbursements of $150 to update the Register of Members.\n\nCertificate of Good Standing: Certificate confirming that the company is in good standing and has met its statutory obligations. The fee is $170. The BVI Registry charges an additional $50 to provide a physical (hard copy) Certificate of Good Standing (if requested).\n\nCertificate of Incumbency: Certificate confirming the current shareholders and directors of the company. The fee is $300.\n\nW-8 BEN-E (FATCA/CRS): To complete the W-8 BEN-E form, the company will need to be classified for FATCA/CRS purposes. To determine the applicable fees, we will require details of the company's asset types and management structure.\n\nNotarisation with Apostille: Notarisation with Apostille of documents. The fee is $650 + courier costs. This fee does not include the preparation of Power of Attorney (PoA).\n\nCourier: We use DHL for courier services. The fee is $100 per document shipment. Courier charges are not mandatory and will only apply if physical documents are requested (except for incorporations).\n\nFee amounts are illustrative from anchor sample \u2014 materialize from catalog at compose time."}, {"id": "blocks/harneys/jurisdictions/bvi/approved-manager-regime", "type": "Section Block", "title": "Approved Manager regime (BVI)", "description": "BVI Approved Manager benefits \u2014 BVI anchor only.", "tags": ["harneys", "jurisdiction:BVI", "template:harneys-uk"], "group": "blocks", "sz": 29, "body": "The BVI Approved Manager regime allows eligible investment managers and advisers to be regulated under a simple approval process using a cost-effective and flexible framework, backed by the credibility of the BVI Financial Services Commission (FSC).\n\nKey benefits include:\n\n- Fast approval \u2013 applications are typically approved within seven days\n- Lower costs \u2013 reduced setup and ongoing compliance expenses\n- Light regulation \u2013 streamlined requirements allow managers to focus on core activities\n- High AUM limits \u2013 up to US$400m (open-ended) and US$1bn (closed-ended)\n- Global flexibility \u2013 ability to manage BVI and non-BVI funds\n- Flexible structures \u2013 accommodates various legal and operational models\n- Reduced overheads \u2013 minimal local infrastructure required\n- Strong reputation \u2013 a stable, well-regulated, and respected international jurisdiction\n\nThe BVI Approved Manager regime delivers the right balance of credibility, flexibility, and efficiency for managers looking to establish and grow their business."}, {"id": "blocks/harneys/jurisdictions/bvi/services-requested", "type": "Section Block", "title": "Services requested (BVI)", "description": "BVI-specific services requested list intro from BVI anchor sample.", "tags": ["harneys", "jurisdiction:BVI", "template:harneys-uk"], "group": "blocks", "sz": 24, "body": "Services requested in British Virgin Islands:\n\n{{services_requested_bullets}}"}, {"id": "blocks/harneys/jurisdictions/cayman/market-narrative", "type": "Section Block", "title": "Cayman market narrative", "description": "Cayman jurisdiction narrative \u2014 Cayman anchor only.", "tags": ["harneys", "jurisdiction:Cayman", "template:harneys-uk"], "group": "blocks", "sz": 29, "body": "The Cayman Islands is the fifth-largest banking centre in the world and one of the world's leading international financial centres. This highly regulated and politically stable jurisdiction offers a wide array of services including mutual funds, company management, structured financing, shipping registration, insurance, and securities listings on the stock exchange.\n\nSince the introduction of the Mutual Funds Law in 1993 (now the Mutual Funds Act), which has been replicated by jurisdictions around the world, the Cayman Islands has grown to be the world's leading offshore investment funds jurisdiction.\n\nCayman benefits from an internationally experienced and qualified workforce as well as experienced lawyers, accountants, and auditors. As a British Overseas Territory, Cayman's laws are based largely on the laws of the United Kingdom, providing a familiar and credible legal framework for institutional and sophisticated investors.\n\nFor regulated investment funds such as the Fund and its SP, this environment offers a robust, well-regarded and business-friendly framework, with mature regulation, access to first-class professional advisers, and an efficient regulator in CIMA."}, {"id": "blocks/harneys/jurisdictions/cayman/services-requested", "type": "Section Block", "title": "Services requested (Cayman)", "description": "Cayman-specific services requested narrative from Cayman anchor sample.", "tags": ["harneys", "jurisdiction:Cayman", "template:harneys-uk"], "group": "blocks", "sz": 25, "body": "Services requested in Cayman Islands:\n\n{{services_requested_bullets}}\n\n{{cayman_engagement_narrative}}\n\nIn this context, we will provide registered office and registered agent services to the Fund in accordance with the Cayman Islands law."}, {"id": "blocks/harneys/regions/hk/rates-footnotes", "type": "Section Block", "title": "Rates schedule footnotes (HK)", "description": "Bilingual footnotes [1]\u2013[10] from HK anchor sample.", "tags": ["harneys", "region:HK", "jurisdiction:HK", "template:harneys-hk"], "group": "blocks", "sz": 36, "body": "## Foot Notes \u811a\u6ce8\n\n**[1]** Includes standard memorandum and articles, registered office for remainder of year of incorporation, certificate of incorporation (e-copy), first registers, organisational resolutions and initial filing of register of directors.\n\n\u5305\u62ec\u6807\u51c6\u7ae0\u7a0b\uff0c\u6ce8\u518c\u9996\u5e74\u767b\u8bb0\u5730\u5740\u670d\u52a1\uff0c\u516c\u53f8\u6ce8\u518c\u8bc1\u4e66\uff08\u7535\u5b50\u526f\u672c\uff09\uff0c\u516c\u53f8\u540d\u518c\uff0c\u7ec4\u7ec7\u51b3\u8bae\u4e66\u548c\u9996\u6b21\u8463\u4e8b\u540d\u518c\u5907\u6848\u3002\n\n**[2]** Includes standard initial limited partnership agreement, registered office for remainder of year of formation, certificate of limited partnership (e-copy), first registers, and organisational resolutions.\n\n\u5305\u62ec\u6807\u51c6\u6709\u9650\u5408\u4f19\u534f\u8bae\uff0c\u6ce8\u518c\u9996\u5e74\u767b\u8bb0\u5730\u5740\u670d\u52a1\uff0c\u6709\u9650\u5408\u4f19\u8bc1\u4e66\uff08\u7535\u5b50\u526f\u672c\uff09\uff0c\u516c\u53f8\u540d\u518c\u548c\u7ec4\u7ec7\u51b3\u8bae\u4e66\u3002\n\n**[3]** Assumes a share capital of US$50,000 or less. For government fee for other share capitals, please see the following table:\n\n\u5047\u8bbe\u80a1\u672c\u4e3aUS$50,000\u6216\u4ee5\u4e0b\u3002\u6709\u5173\u5176\u4ed6\u80a1\u672c\u7684\u653f\u5e9c\u8d39\u7528\uff0c\u8bf7\u67e5\u9605\u4ee5\u4e0b\u8868\u683c\uff1a\n\n**[4]** Assumes a share capital of US$50,000 or less. For government fee for other share capitals, please see the following table:\n\n\u5047\u8bbe\u80a1\u672c\u4e3aUS$50,000\u6216\u4ee5\u4e0b\u3002\u6709\u5173\u5176\u4ed6\u80a1\u672c\u7684\u653f\u5e9c\u8d39\u7528\uff0c\u8bf7\u67e5\u9605\u4ee5\u4e0b\u8868\u683c\uff1a\n\n**[5]** Assumes the partnership is unregulated by CIMA. Government fee for regulated partnership is US$1,586.\n\n\u5047\u8bbe\u6709\u9650\u5408\u4f19\u5e76\u4e0d\u662f\u53d7CIMA\u7ba1\u5236\u3002\u53d7\u7ba1\u5236\u7684\u6709\u9650\u5408\u4f19\u7684\u653f\u5e9c\u8d39\u7528\u662fUS$1,586\u3002\n\n**[6]** Each Cayman company is required to confirm whether or not relevant activity was conducted annually through Economic Substance Notification filing. Where relevant activity was conducted, the entity has 12 months after the financial year end in which to submit a subsequent Economic Substance Reporting. The scope of this reporting is dependent on which relevant activity or activities were conducted, and whether the entity is tax resident in another jurisdiction outside of the Cayman Islands. In the event Harneys is appointed as the responsible party to submit the reporting, our fee will be US$750.\n\n\u6bcf\u5bb6\u5f00\u66fc\u516c\u53f8\u90fd\u5fc5\u987b\u901a\u8fc7\u63d0\u4ea4\u7ecf\u6d4e\u5b9e\u8d28\u901a\u77e5\u6765\u786e\u8ba4\u662f\u5426\u6bcf\u5e74\u8fdb\u884c\u4e86\u76f8\u5173\u6d3b\u52a8\u3002 \u5982\u679c\u8fdb\u884c\u4e86\u76f8\u5173\u6d3b\u52a8\uff0c\u5b9e\u4f53\u5728\u8d22\u653f\u5e74\u5ea6\u7ed3\u675f\u540e\u7684 12 \u4e2a\u6708\u5185\u63d0\u4ea4\u968f\u540e\u7684\u7ecf\u6d4e\u5b9e\u8d28\u62a5\u544a\u3002\u672c\u62a5\u544a\u7684\u8303\u56f4\u53d6\u51b3\u4e8e\u8fdb\u884c\u4e86\u54ea\u4e9b\u76f8\u5173\u6d3b\u52a8\uff0c\u4ee5\u53ca\u8be5\u5b9e\u4f53\u662f\u5426\u662f\u5f00\u66fc\u7fa4\u5c9b\u4ee5\u5916\u53e6\u4e00\u4e2a\u53f8\u6cd5\u7ba1\u8f96\u533a\u7684\u7a0e\u52a1\u5c45\u6c11\u3002\u5982\u679c \u8861\u529b\u65af\u88ab\u6388\u6743\u63d0\u4ea4\u62a5\u544a\uff0c\u6211\u4eec\u7684\u8d39\u7528\u5c06\u4e3a 750 \u7f8e\u5143\u3002\n\n**[7]** Annual service fees will be waived for the year of transfer-in if annual renewal has been completed by the existing agent.\n\n\u5728\u8f6c\u5165\u5f53\u5e74\u5982\u73b0\u6709\u4ee3\u7406\u5df2\u5b8c\u6210\u5e74\u68c0\u6211\u4eec\u5c06\u8c41\u514d\u5e74\u5ea6\u670d\u52a1\u8d39\u7528\u3002\n\n**[8]** Accounting services must be done in conjunction with the audit. For accounting services fees, please see the following table:\n\n\u4f1a\u8ba1\u670d\u52a1\u5fc5\u987b\u4e0e\u5ba1\u8ba1\u670d\u52a1\u4e00\u8d77\u3002\u6709\u5173\u4f1a\u8ba1\u670d\u52a1\u8d39\u7528\uff0c\u8bf7\u67e5\u9605\u4ee5\u4e0b\u8868\u683c\uff1a\n\n**[9]** Audit services must be done in conjunction with the accounting services. For audit services fees, please see the following table:\n\n\u4f1a\u8ba1\u670d\u52a1\u5fc5\u987b\u4e0e\u5ba1\u8ba1\u670d\u52a1\u4e00\u8d77\u3002\u6709\u5173\u4f1a\u8ba1\u670d\u52a1\u8d39\u7528\uff0c\u8bf7\u67e5\u9605\u4ee5\u4e0b\u8868\u683c\uff1a\n\n**[10]** For taxation services fees, please see the following table:\n\n\u6709\u5173\u7a0e\u52a1\u670d\u52a1\u8d39\u7528\uff0c\u8bf7\u67e5\u9605\u4ee5\u4e0b\u8868\u683c\uff1a\n\nReference tables `tbl[2]`\u2013`tbl[7]` in anchor sample \u2014 materialize separately; do not embed row amounts here."}, {"id": "blocks/harneys/regions/hk/rates-schedule-header", "type": "Section Block", "title": "Rates schedule header (HK)", "description": "Bilingual title block from HK anchor sample.", "tags": ["harneys", "region:HK", "jurisdiction:HK", "template:harneys-hk"], "group": "blocks", "sz": 24, "body": "# COMPANY FORMATION AND ADMINSTRATION RATES\n\n# \u516c\u53f8\u6210\u7acb\u53ca\u7ba1\u7406\u8d39\u7528\n\n{{client.company_name}}"}, {"id": "blocks/harneys/regions/hk/rates-schedule-table", "type": "Section Block", "title": "Rates schedule table (HK)", "description": "Master fee matrix tbl[1] \u2014 37 rows; image/table art in anchor sample.", "tags": ["harneys", "region:HK", "jurisdiction:HK", "template:harneys-hk", "visual"], "group": "blocks", "sz": 25, "body": "Master administration rates schedule is **table art** in anchor sample (`tbl[1]`, 37 rows). Fee rows materialize from catalog/MDM at compose time \u2014 do not transcribe amounts into this block.\n\nSupporting tables `tbl[2]`\u2013`tbl[19]` are reference schedules in sample.\n\nSource spine: [Layer 1 spine](/references/extractions/harneys-hk-incorporation/spine.md)."}, {"id": "blocks/harneys/shared/about-ascentium", "type": "Section Block", "title": "About Ascentium (Harneys)", "description": "Shared About Ascentium prose \u2014 identical in BVI and Cayman anchor samples.", "tags": ["harneys", "template:harneys-uk", "shared"], "group": "blocks", "sz": 30, "body": "## About Ascentium\n\nAscentium is a leading global business services platform dedicated to helping businesses and individuals scale greater heights. Headquartered in Singapore, Ascentium drives extraordinary growth through expert people, purpose-led technology, and an unwavering commitment to service excellence.\n\nWith over 2,900 professionals across 58 cities in 27 markets globally, we deliver integrated solutions in corporate services, finance and accounting, fund administration, human resources, and fiduciary and trust services. Serving more than 65,000 client entities across diverse industries, Ascentium combines specialised expertise with innovative, technology-enabled services to help clients navigate complexity and unlock new opportunities for sustainable growth.\n\n### Heritage strengthened by scale\n\nAscentium Fiduciary, Funds, and Private Client provides cross-border business solutions to corporate and institutional clients as well as high-net-worth individuals. Drawing on over 50 years of experience in key global jurisdictions such as the British Virgin Islands, Cayman Islands, Cyprus, Hong Kong, and Singapore, our teams combine deep local expertise with global reach, offering time zone and language-appropriate services to clients around the world.\n\nStill the team you trust. Now supported by a strong global platform."}, {"id": "blocks/harneys/shared/closing-general", "type": "Section Block", "title": "Closing \u2014 what we need & general (Harneys UK)", "description": "Shared closing sections from BVI anchor sample.", "tags": ["harneys", "template:harneys-uk", "shared"], "group": "blocks", "sz": 27, "body": "## What we will need from you\n\nTo proceed, we will require certain information and documentation to satisfy our take-on procedures, including those required under applicable anti-money laundering regulations.\n\nWe will provide further details and request the necessary information separately should you decide to move forward.\n\n## General\n\nThe basis on which we will act is set out in our standard terms and conditions which can be found here.\n\nWe will assume that any person providing instructions to us in relation to this matter following this correspondence is authorised to do so and has accepted both this fee quote and our terms of engagement.\n\nPlease do not hesitate to contact us if you have any questions or require further information."}, {"id": "blocks/harneys/shared/introduction-letter", "type": "Section Block", "title": "Introduction letter opening (Harneys UK)", "description": "Shared cover letter opening \u2014 BVI and Cayman samples.", "tags": ["harneys", "template:harneys-uk", "shared"], "group": "blocks", "sz": 25, "body": "{{proposal_date}}\n\nDear {{client.contact_name}},\n\nThank you for your interest in our services, we appreciate the opportunity to work with you. The following sections outline the scope of our work and fees tailored to your requirements.\n\nShould you have any questions, please do not hesitate to contact us.\n\nBest regards\n\n{{our_contact.name}}"}, {"id": "blocks/harneys/shared/service-capabilities", "type": "Section Block", "title": "Service capabilities (Harneys UK)", "description": "Shared service description prose from BVI anchor sample.", "tags": ["harneys", "template:harneys-uk", "shared"], "group": "blocks", "sz": 35, "body": "### Company formation\n\nWe provide comprehensive company formation services that put you on pace for a fast and successful incorporation. Our services include determination of company name availability, complete oversight of documentation and the dispatch process. Our skilled team has the capacity to quickly execute demands to meet even the tightest of deadlines.\n\nWe are leaders in company formation services throughout the world's most business-friendly jurisdictions, offering cost-effective solutions through a variety of corporate vehicles. Our secretarial and administrative support is available to extend beyond the incorporation stage to assist you throughout the life of the business.\n\n### Registered agent / registered office\n\nWe provide both registered agent/ registered office services in the BVI. Our registered office and registered agent services not only provide companies and limited partnerships with a physical address, but also ensure proper maintenance of the entity's records, registers, and other required documents.\n\nOur professional team members at all our global offices understand the nuanced differences required of each jurisdiction and entity type.\n\n### Compliance solutions\n\nWe offer a range of solutions for offshore compliance where it comes to anti-money laundering and terrorist financing compliance, financial services regulation, sanctions, tax, tax information exchange, and other areas relating to financial services.\n\n### AEOI compliance services\n\nOur experts across the world assist clients in creating solutions that ensure compliance with legal regimes such as US FATCA and UK FATCA. We partner with clients to navigate applicable FATCA regulations and correctly classify both accounts and investors. Our team works with companies and funds in the BVI to ensure proper compliance with Automatic Exchange of Information (AEOI). We appoint individuals to the appropriate AEOI roles relevant to your jurisdiction and register as needed with the IRS and for online reporting of the ITA or TIA.\n\nWe're experienced in implementing AEOI policies and procedures, including required disclosures where needed and reporting on an annual basis. Our team is adept at removing the burden of compliance for our clients. We also minimise risk by ensuring all the requirements are met in full and on time."}, {"id": "blocks/incorp/regions/au/about-advisory", "type": "Section Block", "title": "About InCorp Advisory (AU)", "description": "Firm and service-line overview from AU anchor sample.", "tags": ["incorp", "region:AU", "template:au-advisory"], "group": "blocks", "sz": 43, "body": "For over 30 years, InCorp Advisory Australia has established itself as a leading boutique advisory practice to emerging and growth stage businesses in Australia and beyond. We employ outstanding and diverse professional staff, with offices headquartered in Sydney, Melbourne & Perth.\n\nOur team has a celebrated list of clientele, including small to medium-sized businesses, ASX-listed companies, subsidiaries of multinational corporations, not for profits, and high net worth individuals.\n\nOur reputable team of 140+ full-time individuals come from a range of backgrounds across accounting, finance, science, engineering and technology. This breadth of skills and background enables us to provide a responsive and high-quality business advisory and compliance service that is always tailored to specific accounting needs.\n\n### Taxation and advisory services\n\nOur proficient accounting and tax advisory services for individuals, companies, trusts and SMSFs include strategic tax planning and optimisation, statutory accounting and financial reporting in line with IFRS standards, transaction support, and more. Our aim is to become your partner\u2014not just another add-on service. We provide bespoke solutions suited to your exact goals, and we take a proactive, hands-on approach working with you to achieve your commercial goals.\n\n### Finance function services\n\nMaximise your financial potential with our comprehensive finance services. From banking and reconciliations to payroll management, compliance, and specialised projects, our expert team ensures seamless accounts receivable/accounts payable processes, detailed management reporting, and smooth systems integration. We provide a comprehensive range of services for businesses looking for a scalable and integrated solution across finance requirements, CFO, and special project services. This bespoke solution gives businesses access to experienced professionals and resources without the burden of hiring insourced finance teams.\n\n### Government incentive services\n\nThe Australian government offers various grants to support SMEs. These include R&D Tax Incentives, Export Market Development Grant & Early Stage Innovation Company status. We ensure a seamless process to help you obtain the R&D Tax Incentive. Out grant experts have secured more than $450 million in grants for our clients to date.\n\n### Audit and assurance services\n\nAs businesses develop and grow, your organisation's responsibilities for governance and risk management increase accordingly. Our professional team will deliver highly accurate financial statement audits and meet all Australian compliance regulations. Incorp Advisory understands the increased responsibilities businesses now have to manage their reporting needs to meet higher regulatory and qualitative requirements. Usually with relatively limited internal resources. So, we invest a considerable amount of our time into understanding your business during the audit process.\n\n### Corporate governance services\n\nOur corporate governance services include a thorough audit of your current governance processes, seamless corporatisation of governance practices through creation and enactment, and expert evaluation of management structures, identifying roles and responsibilities while documenting authority and duties. We also help develop business charters, internal policies, and procedures for a strong foundation and optimal performance.\n\n### Secretarial and compliance services\n\nStay compliant effortlessly with our comprehensive secretarial and compliance services. Our team handles corporate secretarial tasks, business permit renewals, business registration amendments, and ensures strict regulatory compliance.\n\nMore information about our firm and services is available at https://australia.incorp.asia/services/"}, {"id": "blocks/incorp/regions/au/credentials-visual", "type": "Section Block", "title": "Credentials visual pages (AU)", "description": "Image-only credentials spine from AU anchor sample.", "tags": ["incorp", "region:AU", "template:au-advisory", "credentials", "visual"], "group": "blocks", "sz": 26, "body": "Anchor sample H1 sections with **no extractable body text** after group affiliation:\n\n| Section |\n|---------|\n| Snapshot |\n| Locations |\n| Our Full Range of Corporate Services ACROSS ASIA PACIFIC |\n| Key Accreditations And Partners |\n\nTable art at tbl[1]\u2013tbl[3] during affiliation section. Do not synthesize marketing copy.\n\nSource spine: [Layer 1 spine](/references/extractions/incorp-au-incorporation/spine.md)."}, {"id": "blocks/incorp/regions/au/executive-summary", "type": "Section Block", "title": "Executive Summary (AU)", "description": "Fee proposal letter from AU anchor sample (client narrative placeholderized).", "tags": ["incorp", "region:AU", "template:au-advisory"], "group": "blocks", "sz": 28, "body": "{{proposal_date}}\n\n{{client.contact_name}}\n\n{{client.company_name}}\n\nDear {{client.contact_name}},\n\n**RE: Fee Proposal**\n\nWe are pleased to present our proposal to {{client.company_name}} in support of {{engagement_objective}}.\n\n{{engagement_background}}\n\n{{engagement_scope_narrative}}\n\n{{ongoing_support_narrative}}\n\nThe following pages outline the scope of services tailored to {{client.company_name}}'s requirements, together with the proposed fees, timelines, and documentation requirements. We trust this proposal addresses your current objectives and provides a clear pathway for {{engagement_pathway_summary}}. We look forward to the opportunity to work with you and build a strong, long-term relationship with {{client.company_name}}.\n\nYours Sincerely and on behalf of In.Corp,\n\n{{our_contact.name}}\n\n{{our_contact.title}}"}, {"id": "blocks/incorp/regions/au/fee-summary-intro", "type": "Section Block", "title": "Fee Summary Intro (AU)", "description": "Fee SUMMARY disclaimers before Payment Options A/B.", "tags": ["incorp", "region:AU", "template:au-advisory", "fees"], "group": "blocks", "sz": 25, "body": "## Fee SUMMARY\n\nPlease note that all fees mentioned are in Australian Dollars, exclusive of the prevailing 10% Goods and Services Tax (GST).\n\nAll fees quoted below exclude our 2.5% disbursement charge and 10% GST"}, {"id": "blocks/incorp/regions/au/group-affiliation", "type": "Section Block", "title": "InCorp Group & International Affiliation (AU)", "description": "Group affiliation prose from AU anchor sample.", "tags": ["incorp", "region:AU", "template:au-advisory"], "group": "blocks", "sz": 26, "body": "## INCORP GROUP & INTERNATIONAL AFFILIATION\n\nInCorp Group is a leading provider of a wide range of professional corporate solutions and services across Asia Pacific. Our reach across the region allows us to provide a seamless client delivery experience across these jurisdictions:\n\nOur award-winning capabilities and resources provide organisations and individuals a full suite of comprehensive services to help them turn their \"Vision To Reality\"."}, {"id": "blocks/incorp/regions/au/solution-pricing-intro", "type": "Section Block", "title": "Solution and Pricing Intro (AU)", "description": "Fees section opening from AU anchor sample.", "tags": ["incorp", "region:AU", "template:au-advisory", "fees"], "group": "blocks", "sz": 27, "body": "## Fees\n\nThis section outlines InCorp Advisory's proposed services and estimated fees for your company. Our fee structure includes initial setup fees, as well as ongoing charges that may be billed monthly, quarterly, or annually. Additionally, fees may be incurred based on the time spent on specific tasks or on a per-instance basis.\n\nFor any additional services not encompassed by this proposal that may incur additional charges, we will receive your approval before any work commences. Please note that all fees mentioned are in Australian Dollars, exclusive of the prevailing 10% Goods and Services Tax (GST).\n\nAll fees quoted are in AUD, and exclude our 2.5% disbursement charge and 10% GST."}, {"id": "blocks/incorp/regions/au/terms-appendix", "type": "Section Block", "title": "Terms and Conditions Appendix (AU)", "description": "T&C referenced in TOC as Appendix A \u2014 not extractable as body text in anchor sample.", "tags": ["incorp", "region:AU", "template:au-advisory", "terms"], "group": "blocks", "sz": 25, "body": "Anchor sample Table of Contents lists **Terms and Conditions (Appendix A)** but `text.txt` contains no appendix prose. Terms are likely a separate attachment or image-only in the legacy template.\n\nRegister appendix asset or link catalog terms block when available. Do not invent T&C text."}, {"id": "blocks/incorp/regions/hk/about-hk", "type": "Section Block", "title": "About Ascentium HK", "description": "Company and company-secretarial team introduction from HK anchor sample.", "tags": ["incorp", "region:HK", "template:hk-incorp", "locale:zh-CN"], "group": "blocks", "sz": 27, "body": "## \u768b\u7fca\u4f01\u4e1a\u670d\u52a1(\u9999\u6e2f)\u6709\u9650\u516c\u53f8 (\u300c\u768b\u7fca\u9999\u6e2f\u300d)\n\n\u768b\u7fca\u9999\u6e2f\uff08Ascentium Hong Kong\uff09\u662f\u60a8\u503c\u5f97\u4fe1\u8d56\u7684\u4f01\u4e1a\u670d\u52a1\u63d0\u4f9b\u5546, \u4e13\u6ce8\u4e8e\u52a9\u529b\u521b\u4e1a\u8005\u3001\u4e2d\u5c0f\u4f01\u4e1a\u53ca\u8de8\u56fd\u516c\u53f8\u7a33\u5065\u5730\u62d3\u5c55\u9999\u6e2f\u5e02\u573a\u3002\u768b\u7fca\u9999\u6e2f\u63d0\u4f9b\u4e00\u7ad9\u5f0f\u4e13\u4e1a\u670d\u52a1\uff0c\u4e1a\u52a1\u8303\u56f4\u6db5\u76d6\u516c\u53f8\u6ce8\u518c\u3001\u516c\u53f8\u79d8\u4e66\u3001\u4f1a\u8ba1\u3001\u7a0e\u52a1\u3001\u4eba\u529b\u8d44\u6e90\u4e0e\u85aa\u8d44\u5916\u5305\u3001\u98ce\u9669\u7ba1\u7406\u53ca\u5408\u89c4\u987e\u95ee\u7b49\u9886\u57df\u3002\n\n\u768b\u7fca\u9999\u6e2f\u7684\u4f18\u52bf\u6765\u81ea\u53ef\u9760\u7684\u5f80\u7ee9\u8bb0\u5f55\u3001\u6df1\u539a\u7684\u884c\u4e1a\u4e13\u4e1a\u77e5\u8bc6\u3001\u656c\u4e1a\u4e14\u7ecf\u9a8c\u4e30\u5bcc\u7684\u4e13\u4e1a\u4eba\u5458\u3001\u6280\u672f\u5bfc\u5411\u7684\u6d41\u7a0b\u3001\u6807\u51c6\u5316\u7684\u65b9\u6cd5\u3001\u5bf9\u6cd5\u5f8b\u6cd5\u89c4\u53d8\u5316\u7684\u6301\u7eed\u5173\u6ce8\u4ee5\u53ca\u5e7f\u6cdb\u7684\u884c\u4e1a\u8109\u7edc\u3002\u5efa\u57fa\u9999\u6e2f\u5341\u591a\u5e74, \u6211\u4eec\u7684\u80cc\u540e\u62e5\u6709\u603b\u90e8\u4f4d\u4e8e\u65b0\u52a0\u5761\u7684 Ascentium \u768b\u7fca\u96c6\u56e2\u7684\u652f\u6301\u3002Ascentium \u768b\u7fca\u96c6\u56e2\u5c61\u83b7\u6b8a\u8363\u7684\u80fd\u529b\u548c\u4e30\u5bcc\u7684\u8d44\u6e90\u4e3a\u4f01\u4e1a\u548c\u4e2a\u4eba\u63d0\u4f9b\u5168\u5957\u7efc\u5408\u670d\u52a1, \u534f\u52a9\u4ed6\u4eec\u300c\u613f\u666f\u6210\u771f\u300d\u3002\n\nAscentium \u768b\u7fca\u96c6\u56e2\u7531\u9886\u5148\u7684\u673a\u6784\u6295\u8d44\u8005\u652f\u6301, \u5176\u4e2d\u5305\u62ec\u5168\u7403\u6700\u5927\u7684\u79c1\u4eba\u53e6\u7c7b\u6295\u8d44\u7ba1\u7406\u516c\u53f8\u4e4b\u4e00\u9ad8\u74f4\u8d44\u672c\u96c6\u56e2 Hillhouse Investment\u3002\u516c\u53f8\u4ee3\u8868\u7f8e\u6d32\u3001\u4e9a\u6d32\u3001\u6b27\u6d32\u548c\u4e2d\u4e1c\u7684\u9886\u5148\u673a\u6784\u5ba2\u6237\u7ba1\u7406\u8d44\u672c\u3002\n\n### \u516c\u53f8\u79d8\u4e66\u670d\u52a1\u56e2\u961f\n\n\u768b\u7fca\u9999\u6e2f\u7684\u516c\u53f8\u79d8\u4e66\u670d\u52a1\u56e2\u961f\u7531\u591a\u540d\u4e13\u4e1a\u4eba\u58eb\u7ec4\u6210\uff0c\u5305\u62ec\u7ecf\u9a8c\u4e30\u5bcc\u7684\u7279\u8bb8\u79d8\u4e66\u53ca\u7279\u8bb8\u516c\u53f8\u6cbb\u7406\u4e13\u4e1a\u4eba\u58eb\u3002\u56e2\u961f\u6210\u5458\u5747\u7b26\u5408\u9999\u6e2f\u8054\u5408\u4ea4\u6613\u6240\u6709\u9650\u516c\u53f8\u300a\u8bc1\u5238\u4e0a\u5e02\u89c4\u5219\u300b\u5bf9\u516c\u53f8\u79d8\u4e66\u7684\u8d44\u683c\u8981\u6c42\uff0c\u5e76\u5177\u5907\u624e\u5b9e\u7684\u4e13\u4e1a\u77e5\u8bc6\u53ca\u4e30\u5bcc\u7684\u5b9e\u8df5\u7ecf\u9a8c\u3002\n\n\u768b\u7fca\u9999\u6e2f\u516c\u53f8\u79d8\u4e66\u90e8\u95e8\u7684\u8d44\u6df1\u6210\u5458\u5728\u79d8\u4e66\u670d\u52a1\u884c\u4e1a\u62e5\u6709\u8d85\u8fc7 30 \u5e74\u7684\u7ecf\u9a8c\uff0c \u66fe\u670d\u52a1\u591a\u5bb6\u77e5\u540d\u4e0a\u5e02\u516c\u53f8\u96c6\u56e2\uff0c\u5177\u5907\u5904\u7406\u590d\u6742\u4f01\u4e1a\u67b6\u6784\u53ca\u5408\u89c4\u4e8b\u52a1\u7684\u4e30\u5bcc\u7ecf\u9a8c\u3002\n\n\u591a\u5e74\u6765\uff0c\u768b\u7fca\u96c6\u56e2\u6210\u5458\u7d2f\u8ba1\u4e3a\u8d85\u8fc7 50 \u5bb6\u4e0a\u5e02\u516c\u53f8\u53ca\u5176\u9644\u5c5e\u516c\u53f8\u63d0\u4f9b\u4f01\u4e1a\u670d\u52a1\uff0c\u5176\u4e2d\u5305\u62ec\u4e8e\u9999\u6e2f\u8054\u5408\u4ea4\u6613\u6240\u53ca\u65b0\u52a0\u5761\u8bc1\u5238\u4ea4\u6613\u6240\u4e0a\u5e02\u7684\u516c\u53f8\u3002"}, {"id": "blocks/incorp/regions/hk/compliance-and-timeline", "type": "Section Block", "title": "Compliance safeguards and timeline (HK)", "description": "Core service compliance measures and timing considerations from HK anchor.", "tags": ["incorp", "region:HK", "template:hk-incorp", "locale:zh-CN"], "group": "blocks", "sz": 26, "body": "## \u6838\u5fc3\u670d\u52a1\u5408\u89c4\u4fdd\u969c\n\n\u4e3a\u4fdd\u969c\u670d\u52a1\u7684\u5408\u89c4\u6027\uff0c\u6211\u4eec\u5c06\u5b9e\u65bd\u4ee5\u4e0b\u63aa\u65bd\uff1a\n\n**\u4e13\u4e1a\u9879\u76ee\u56e2\u961f\uff1a** \u9879\u76ee\u56e2\u961f\u7531\u5177\u5907\u9999\u6e2f\u516c\u53f8\u6cbb\u7406\u516c\u4f1a\uff08HKCGI\uff09\u8d44\u683c\u7684\u5408\u89c4\u4eba\u5458\u51fa\u4efb\u5177\u540d\u516c\u53f8\u79d8\u4e66\uff0c\u8d1f\u8d23\u786e\u4fdd\u670d\u52a1\u5168\u7a0b\u7b26\u5408\u6cd5\u89c4\u8981\u6c42\uff0c\u5e76\u63d0\u4f9b\u9ad8\u6548\u3001\u4e13\u4e1a\u670d\u52a1\u4ee5\u53ca\u65f6\u54cd\u5e94\u5ba2\u6237\u5404\u9879\u67e5\u8be2\u3002\n\n**\u5185\u90e8\u4eba\u5458\u57f9\u8bad\uff1a** \u516c\u53f8\u5b9a\u671f\u4e3e\u529e\u5185\u90e8\u57f9\u8bad\u53ca\u5b89\u6392\u53c2\u4e0e\u7531\u9999\u6e2f\u516c\u53f8\u6cbb\u7406\u516c\u4f1a\uff08HKCGI\uff09\u63d0\u4f9b\u7684\u4e13\u4e1a\u8bfe\u7a0b\uff0c\u6301\u7eed\u638c\u63e1\u6700\u65b0\u6cd5\u89c4\u52a8\u6001\u4e0e\u5b9e\u52a1\u77e5\u8bc6\uff0c\u786e\u4fdd\u670d\u52a1\u8d28\u91cf\u7684\u9ad8\u6548\u6027\u4e0e\u5408\u89c4\u6027\u3002\n\n**\u516c\u53f8\u6cbb\u7406\u673a\u5236\uff1a** \u56e2\u961f\u8bbe\u6709\u6e05\u6670\u7684\u804c\u80fd\u5206\u5de5\u548c\u590d\u6838\u6d41\u7a0b\uff0c\u5305\u62ec\u5173\u952e\u5c97\u4f4d\u66ff\u8865\u3001\u300c\u56db\u773c\u539f\u5219\u300d\u6267\u884c\u53ca\u6cd5\u5f8b\u987e\u95ee\u534f\u52a9\uff0c\u786e\u4fdd\u64cd\u4f5c\u5408\u89c4\u3001\u98ce\u9669\u53ef\u63a7\u3002\n\n## \u65f6\u95f4\u6027\u8003\u8651\n\n\u670d\u52a1\u65f6\u95f4\u5b89\u6392\u5c06\u6839\u636e\u9879\u76ee\u7684\u590d\u6742\u6027\u53ca\u5ba2\u6237\u7684\u5177\u4f53\u9700\u6c42\u8fdb\u884c\u5408\u7406\u89c4\u5212\uff0c\u786e\u4fdd\u6574\u4f53\u6d41\u7a0b\u9ad8\u6548\u6709\u5e8f\uff1a\n\n**\u9879\u76ee\u542f\u52a8\u4f1a\u8bae\uff1a** \u5728\u9879\u76ee\u6b63\u5f0f\u542f\u52a8\u524d\u53ec\u5f00\u542f\u52a8\u4f1a\u8bae\uff0c \u660e\u786e\u9879\u76ee\u76ee\u6807\u3001\u5173\u952e\u65f6\u95f4\u8282\u70b9\u53ca\u5404\u65b9\u8d23\u4efb\u5206\u5de5\uff0c\u786e\u4fdd\u5404\u53c2\u4e0e\u65b9\u8fbe\u6210\u5171\u8bc6\u3002\n\n**\u9636\u6bb5\u6027\u91cc\u7a0b\u7891\uff1a** \u6839\u636e\u9879\u76ee\u8fdb\u5ea6\u8bbe\u5b9a\u6e05\u6670\u7684\u9636\u6bb5\u6027\u91cc\u7a0b\u7891\uff0c\u5b9a\u671f\u8fdb\u884c\u8fdb\u5ea6\u8bc4\u4f30\u4e0e\u6c47\u62a5\uff0c\u53ca\u65f6\u8bc6\u522b\u6f5c\u5728\u98ce\u9669\uff0c\u786e\u4fdd\u9879\u76ee\u6309\u8ba1\u5212\u63a8\u8fdb\u3002\n\n**\u7075\u6d3b\u5e94\u53d8\u673a\u5236\uff1a** \u5728\u9879\u76ee\u6267\u884c\u8fc7\u7a0b\u4e2d\uff0c\u5982\u9047\u5ba2\u6237\u9700\u6c42\u8c03\u6574\u6216\u7a81\u53d1\u4e8b\u9879\uff0c \u56e2\u961f\u5c06\u53ca\u65f6\u8bc4\u4f30\u5e76\u7075\u6d3b\u8c03\u6574\u65f6\u95f4\u5b89\u6392\uff0c\u786e\u4fdd\u670d\u52a1\u7684\u8fde\u7eed\u6027\u3001\u53ca\u65f6\u6027\u4e0e\u9ad8\u6548\u4ea4\u4ed8\u3002"}, {"id": "blocks/incorp/regions/hk/credentials-visual", "type": "Section Block", "title": "Credentials visual pages (HK)", "description": "Cover and image-only pages before proposal letter in HK anchor sample.", "tags": ["incorp", "region:HK", "template:hk-incorp", "credentials", "visual"], "group": "blocks", "sz": 26, "body": "Anchor sample sections with **no extractable body text** before the proposal letter (layout is cover / image art):\n\n| Order | Section (from sample) |\n|-------|------------------------|\n| 1 | Cover \u2014 Ascentium Corporate Services (HK) / `{{project_name}}` |\n| 2 | \u4e0a\u5e02\u516c\u53f8\u79d8\u4e66\u53ca\u5408\u89c4\u670d\u52a1\u8d39\u7528\u63d0\u6848 (title art) |\n\nDo not synthesize marketing copy. Insert via template `export` shell or future `references/ux/` assets.\n\nSource spine: [Layer 1 spine](/references/extractions/incorp-hk-cs-zh-cn/spine.md)."}, {"id": "blocks/incorp/regions/hk/fee-proposal-intro", "type": "Section Block", "title": "Fee proposal intro (HK)", "description": "Services fee proposal preamble, footnotes, and payment arrangement from HK anchor.", "tags": ["incorp", "region:HK", "template:hk-incorp", "locale:zh-CN", "fees"], "group": "blocks", "sz": 27, "body": "## \u670d\u52a1\u8d39\u7528\u63d0\u6848\n\n{{project_name}} \u2014 \u4e0a\u5e02\u516c\u53f8\u79d8\u4e66\u53ca\u5408\u89c4\u670d\u52a1\n\n(\u8be6\u89c1\u9644\u4ef6\u4e00)\n\n\u672c\u8282\u6982\u8ff0\u768b\u7fca\u9999\u6e2f\u9488\u5bf9\u4e0a\u5e02\u516c\u53f8\u79d8\u4e66\u53ca\u5408\u89c4\u670d\u52a1\u63d0\u4f9b\u7684\u670d\u52a1\u8d39\u7528\u4f30\u7b97\u3002\u8d39\u7528\u7ed3\u6784\u5305\u62ec\u521d\u59cb\u8bbe\u7f6e\u8d39\u7528\uff0c\u4ee5\u53ca\u6309\u6708\u3001\u6309\u5b63\u5ea6\u6216\u6309\u5e74\u4ea7\u751f\u7684\u6301\u7eed\u8d39\u7528\uff08\u5982\u9002\u7528\uff09\u3002\u6b64\u5916\uff0c\u6839\u636e\u7279\u5b9a\u670d\u52a1\u6240\u82b1\u8d39\u7684\u65f6\u95f4\u6216\u6309\u5b9e\u4f8b\u53ef\u80fd\u4f1a\u4ea7\u751f\u8d39\u7528\u3002\u5bf9\u4e8e\u672c\u63d0\u6848\u672a\u5305\u542b\u7684\u4efb\u4f55\u53ef\u80fd\u4ea7\u751f\u7684\u9644\u52a0\u670d\u52a1\uff0c\u5c06\u5728\u4efb\u4f55\u5de5\u4f5c\u5f00\u5c55\u524d\u5f81\u6c42\u8d35\u53f8\u7684\u540c\u610f\u3002\n\nFee schedule tables (anchor tbl[4]) materialize via `solution_and_fees` \u2014 amounts not in block body.\n\n### \u5907\u6ce8\n\n1. \u6240\u6709\u8d39\u7528\u62a5\u4ef7\u4e0d\u5305\u62ec\u653f\u5e9c\u5f81\u8d39\u3001\u7a0e\u8d39\u6216\u5411\u5176\u4ed6\u7b2c\u4e09\u65b9\u5bfb\u627e\u4e13\u4e1a\u610f\u89c1\u800c\u4ea7\u751f\u7684\u8d39\u7528\u53ca\u57ab\u652f\u8d39\u7528\uff08\u5982\u6709\uff09\u3002\n2. \u82e5\u8d35\u516c\u53f8\u4e8e\u7b7e\u7ea6\u540e\u4e00\u5e74\u5185\u4e8e\u9999\u6e2f\u6210\u529f\u4e0a\u5e02\uff0c\u5219\u6b64\u9879\u6536\u8d39\u8c41\u514d\u3002\n3. \u6240\u6709\u62a5\u4ef7\u53ca\u670d\u52a1\u5728\u521b\u5efa\u63d0\u6848\u65e5\u671f\u5185\u4e09\u4e2a\u6708\u6709\u6548\u3002\n\n### \u4ed8\u8d39\u5b89\u6392\n\n1. \u5173\u4e8e\u4e0a\u5e02\u524d\u670d\u52a1 A1\uff08\u6839\u636e\u9999\u6e2f\u300a\u516c\u53f8\u6761\u4f8b\u300b\u529e\u7406\u6ce8\u518c\u975e\u9999\u6e2f\u516c\u53f8\u7533\u8bf7\u5de5\u4f5c\uff09: \u6211\u53f8\u5c06\u4e8e\u6ce8\u518c\u5de5\u4f5c\u5b8c\u6210\u540e\u6536\u53d6\u670d\u52a1\u8d39\u7528\u3001\u767b\u8bb0\u8d39\u7528\u3001\u53ca\u5176\u4ed6\u4ee3\u57ab\u8d39\u7528\u53ca\u6742\u8d39\uff08\u5982\u6709\uff09\u3002\n2. \u5173\u4e8e\u4e0a\u5e02\u540e\u670d\u52a1 B1 \u53ca B2 (\u5982\u9002\u7528): \u6211\u53f8\u5c06\u81ea\u8d35\u516c\u53f8\u6210\u529f\u4e0a\u5e02\u65e5\u8d77\u5f00\u59cb\u6536\u53d6\u5e74\u8d39\u5e76\u53d1\u51fa\u8d26\u5355\u3002\u6709\u5173\u5e74\u8d39\u5c06\u4f1a\u6bcf\u5e74\u5206\u4e24\u6b21\u5e73\u5747\u6536\u53d6\u5e74\u8d39\u7684 50%\uff0c\u6211\u53f8\u4f1a\u5206\u522b\u4e8e\u6bcf\u5e74\u7684 1 \u6708\u53ca 7 \u6708\u53d1\u51fa\u8d26\u5355\u3002\n\nSupporting fee table (anchor tbl[5]) materializes at compose time."}, {"id": "blocks/incorp/regions/hk/listing-core-team", "type": "Section Block", "title": "Listing services core team (HK)", "description": "Named listing-team lead section \u2014 IPO / listed-co case in anchor sample.", "tags": ["incorp", "region:HK", "template:hk-incorp", "locale:zh-CN", "listed-co"], "group": "blocks", "sz": 25, "body": "## \u4e0a\u5e02\u670d\u52a1\u6838\u5fc3\u6210\u5458\n\n{{team_lead.name}}\u662f\u768b\u7fca\u9999\u6e2f\u516c\u53f8\u79d8\u4e66\u670d\u52a1\u8463\u4e8b\u603b\u7ecf\u7406\u3002\n\n{{team_lead.bio}}\n\n{{team_lead.name}}\u4e3a\u7279\u8bb8\u79d8\u4e66\u4ee5\u53ca\u9999\u6e2f\u516c\u53f8\u6cbb\u7406\u516c\u4f1a\u53ca\u82f1\u56fd\u7279\u8bb8\u516c\u53f8\u6cbb\u7406\u516c\u4f1a\u7684\u8d44\u6df1\u4f1a\u5458\u3002\u5979\u4ea6\u6301\u6709\u7531\u9999\u6e2f\u516c\u53f8\u6cbb\u7406\u516c\u4f1a\u9881\u53d1\u7684\u6267\u4e1a\u8005\u8ba4\u53ef\u8bc1\u660e\u3002\n\n\u5728{{team_lead.name}}\u7684\u804c\u4e1a\u751f\u6daf\u4e2d\uff0c\u5979\u66fe\u62c5\u4efb\u9999\u6e2f\u591a\u5bb6\u4e0a\u5e02\u516c\u53f8\u7684\u516c\u53f8\u79d8\u4e66/\u8054\u5e2d\u516c\u53f8\u79d8\u4e66/\u6388\u6743\u4ee3\u8868\u3002\u4ee5\u4e0b\u662f{{team_lead.name}}\u66fe\u51fa\u4efb\u516c\u53f8\u79d8\u4e66/\u6388\u6743\u4ee3\u8868\u53ca\u9879\u76ee\u56e2\u961f\u9886\u5bfc\u4e4b\u90e8\u5206\u4e0a\u5e02\u516c\u53f8\u5217\u8868\uff1a\n\nRepresentative listed-company table (anchor tbl[3]) materializes at compose time \u2014 not stored in block body."}, {"id": "blocks/incorp/regions/hk/project-team-structure", "type": "Section Block", "title": "Project team structure (HK)", "description": "Project team roles and responsibilities \u2014 listed-co / IPO case in anchor sample.", "tags": ["incorp", "region:HK", "template:hk-incorp", "locale:zh-CN", "listed-co"], "group": "blocks", "sz": 27, "body": "## \u56e2\u961f\u914d\u7f6e\n\n\u672c\u516c\u53f8\u5c06\u6307\u6d3e\u4e13\u4e1a\u9879\u76ee\u5c0f\u7ec4\u8d1f\u8d23\u8d35\u516c\u53f8\u7684\u76f8\u5173\u4e8b\u52a1\u3002\u56e2\u961f\u6210\u5458\u5177\u5907\u5145\u5206\u7684\u4e13\u4e1a\u77e5\u8bc6\u53ca\u5b9e\u52a1\u7ecf\u9a8c\uff0c\u786e\u4fdd\u6240\u63d0\u4f9b\u7684\u670d\u52a1\u4e13\u4e1a\u3001\u9ad8\u6548\u5e76\u5177\u6210\u672c\u6548\u76ca\u3002\n\n\u672c\u516c\u53f8\u4e13\u4e1a\u9879\u76ee\u5c0f\u7ec4\u56e2\u961f\u4eba\u5458\u5b89\u6392\u53ca\u8fd0\u4f5c\u65b9\u5f0f\uff1a\n\n### \u9879\u76ee\u9886\u5bfc\n\n- \u804c\u8d23\uff1a\u5168\u9762\u7edf\u7b79\u9879\u76ee\u6267\u884c\uff0c\u8d1f\u8d23\u5173\u952e\u51b3\u7b56\u53ca\u8d44\u6e90\u8c03\u914d\uff0c\u786e\u4fdd\u670d\u52a1\u7b26\u5408\u9999\u6e2f\u4e0a\u5e02\u516c\u53f8\u76f8\u5173\u6cd5\u89c4\u8981\u6c42\u53ca\u9879\u76ee\u76ee\u6807\u987a\u5229\u8fbe\u6210\u3002\n- \u5de5\u4f5c\u5185\u5bb9\uff1a\n  - \u4e3b\u5bfc\u9879\u76ee\u6574\u4f53\u7b56\u7565\u4e0e\u65b9\u5411\uff1b\n  - \u534f\u8c03\u516c\u53f8\u7ba1\u7406\u5c42\u4e0e\u9879\u76ee\u56e2\u961f\u6c9f\u901a\uff1b\n  - \u76d1\u7763\u5173\u952e\u8282\u70b9\uff0c\u7ba1\u7406\u91cd\u5927\u98ce\u9669\u4e8b\u9879\uff1b\n  - \u5ba1\u9605\u6700\u7ec8\u4ea4\u4ed8\u6210\u679c\uff0c\u786e\u4fdd\u8d28\u91cf\u4e0e\u5408\u89c4\u6027\u3002\n\n### \u9879\u76ee\u7ecf\u7406\n\n- \u804c\u8d23\uff1a\u5177\u4f53\u8d1f\u8d23\u9879\u76ee\u7684\u6574\u4f53\u8ba1\u5212\u3001\u6267\u884c\u4e0e\u5ba1\u9605\u5de5\u4f5c\u5185\u5bb9\uff0c\u786e\u4fdd\u5404\u9636\u6bb5\u4efb\u52a1\u6309\u65f6\u3001\u6309\u8d28\u3001\u6309\u9884\u7b97\u5b8c\u6210\u3002\n- \u5de5\u4f5c\u5185\u5bb9\uff1a\n  - \u5236\u5b9a\u9879\u76ee\u5b9e\u65bd\u8ba1\u5212\u4e0e\u65f6\u95f4\u8868\uff1b\n  - \u5206\u914d\u5e76\u534f\u8c03\u56e2\u961f\u4efb\u52a1\uff1b\n  - \u8ddf\u8fdb\u9879\u76ee\u8fdb\u5ea6\uff0c\u8bc6\u522b\u4e0e\u89e3\u51b3\u6267\u884c\u4e2d\u95ee\u9898\uff1b\n  - \u4e0e\u516c\u53f8\u56e2\u961f\u4fdd\u6301\u65e5\u5e38\u6c9f\u901a\uff0c\u53ca\u65f6\u54cd\u5e94\u9700\u6c42\u6216\u53d8\u66f4\uff1b\n  - \u5ba1\u9605\u8463\u4e8b\u4f1a\u3001\u80a1\u4e1c\u5927\u4f1a\u76f8\u5173\u6750\u6599\u53ca\u5408\u89c4\u6587\u4ef6\u3002\n\n### \u9879\u76ee\u6210\u5458\n\n- \u804c\u8d23\uff1a\u6839\u636e\u9879\u76ee\u7ecf\u7406\u6307\u793a\uff0c\u5b8c\u6210\u5206\u914d\u4efb\u52a1\uff0c\u786e\u4fdd\u5404\u9879\u516c\u53f8\u79d8\u4e66\u670d\u52a1\u7b26\u5408\u300a\u4e0a\u5e02\u89c4\u5219\u300b\u53ca\u5404\u76d1\u7ba1\u673a\u6784\u7684\u8981\u6c42\u3002\n- \u5de5\u4f5c\u5185\u5bb9\uff1a\n  - \u8349\u62df\u4f1a\u8bae\u6587\u4ef6\u3001\u7f16\u5236\u4fe1\u606f\u62ab\u9732\u6587\u4ef6\u7b49\u5177\u4f53\u5de5\u4f5c\uff1b\n  - \u534f\u4f5c\u5904\u7406\u4e0a\u5e02\u516c\u53f8\u5408\u89c4\u3001\u516c\u544a\u3001\u5e74\u62a5\u7b49\u76f8\u5173\u4e8b\u52a1\uff1b\n  - \u5c31\u6267\u884c\u4e2d\u51fa\u73b0\u7684\u95ee\u9898\u5b89\u6392\u534f\u8c03\u4e0e\u6539\u8fdb\u3002\n\nTeam roster table (anchor tbl[1]) materializes at compose time \u2014 not stored in block body."}, {"id": "blocks/incorp/regions/hk/proposal-letter", "type": "Section Block", "title": "Proposal letter (HK)", "description": "Fee proposal cover letter from HK anchor sample (zh-CN).", "tags": ["incorp", "region:HK", "template:hk-incorp", "locale:zh-CN"], "group": "blocks", "sz": 27, "body": "{{proposal_date}}\n\n\u81f4\uff1a{{project_name}} \u2014 {{client.contact_name}}\uff08{{client.entity_description}}\uff09\n\n\u5c0a\u656c\u7684\u9886\u5bfc\uff1a\n\n\u611f\u8c22\u60a8\u9080\u8bf7\u768b\u7fca\u4f01\u4e1a\u670d\u52a1(\u9999\u6e2f)\u6709\u9650\u516c\u53f8\uff08Ascentium \u768b\u7fca\u96c6\u56e2\u65d7\u4e0b\u516c\u53f8\uff09\u4e3a\u8d35\u516c\u53f8\u63d0\u4ea4\u4e0a\u5e02\u516c\u53f8\u79d8\u4e66\u4e0e\u5408\u89c4\u670d\u52a1\u7684\u5efa\u8bae\u4e66\u3002\u80fd\u591f\u4e0e\u60a8\u53ca\u60a8\u7684\u56e2\u961f\u5408\u4f5c\uff0c\u63d0\u4f9b\u6211\u4eec\u9ad8\u8d28\u91cf\u7684\u670d\u52a1\uff0c\u5c06\u662f\u6211\u4eec\u7684\u8363\u5e78\u3002\n\n\u768b\u7fca\u9999\u6e2f\u8bbe\u6709\u4e00\u652f\u5b9e\u529b\u96c4\u539a\u7684\u4e13\u4e1a\u56e2\u961f\uff0c\u4e13\u6ce8\u4e3a\u5ba2\u6237\u63d0\u4f9b\u5168\u9762\u7684\u4f01\u4e1a\u670d\u52a1\u3002\u5176\u4e2d\uff0c\u516c\u53f8\u79d8\u4e66\u670d\u52a1\u56e2\u961f\u6c47\u805a\u591a\u540d\u7ecf\u9a8c\u4e30\u5bcc\u7684\u7279\u8bb8\u79d8\u4e66\u53ca\u7279\u8bb8\u516c\u53f8\u6cbb\u7406\u4e13\u4e1a\u4eba\u58eb\u3002\u56e2\u961f\u6210\u5458\u5747\u7b26\u5408\u300a\u9999\u6e2f\u8054\u5408\u4ea4\u6613\u6240\u6709\u9650\u516c\u53f8\u8bc1\u5238\u4e0a\u5e02\u89c4\u5219\u300b\u5bf9\u516c\u53f8\u79d8\u4e66\u7684\u8d44\u683c\u8981\u6c42\uff0c\u5e76\u5177\u5907\u4e30\u5bcc\u7684\u4e13\u4e1a\u77e5\u8bc6\u53ca\u5b9e\u52a1\u7ecf\u9a8c\u3002\n\n\u6211\u4eec\u670d\u52a1\u7684\u57fa\u77f3\u5728\u4e8e\u6211\u4eec\u5bf9\u8d28\u91cf\u3001\u53ca\u65f6\u6027\u548c\u9053\u5fb7\u6807\u51c6\u7684\u627f\u8bfa\u3002\u6211\u4eec\u901a\u8fc7\u4e3a\u60a8\u7684\u9879\u76ee\u7504\u9009\u5177\u5907\u6240\u9700\u4e13\u4e1a\u77e5\u8bc6\u548c\u7ecf\u9a8c\u7684\u56e2\u961f\u6210\u5458\uff0c\u5e76\u786e\u4fdd\u8d1f\u8d23\u7684\u8463\u4e8b\u548c\u7ecf\u7406\u6df1\u5ea6\u53c2\u4e0e\uff0c\u4ece\u800c\u4fdd\u8bc1\u63d0\u4f9b\u5353\u8d8a\u7684\u670d\u52a1\u3002\u8fd9\u79cd\u53c2\u4e0e\u7a0b\u5ea6\u4f7f\u6211\u4eec\u4ece\u7ade\u4e89\u5bf9\u624b\u4e2d\u8131\u9896\u800c\u51fa\u3002\n\n\u6211\u4eec\u7684\u89e3\u51b3\u65b9\u6848\u4ea4\u4ed8\u7b56\u7565\u5c06\u5728\u5408\u4f5c\u5f00\u59cb\u524d\u8fdb\u884c\u5468\u5bc6\u89c4\u5212\u3002\u7136\u800c\uff0c\u6211\u4eec\u4e5f\u8ba4\u8bc6\u5230\u9002\u5e94\u6027\u548c\u654f\u6377\u6027\u7684\u91cd\u8981\u6027\uff1b\u6211\u4eec\u5c06\u4fdd\u6301\u7075\u6d3b\u6027\uff0c\u4ee5\u5e94\u5bf9\u65f6\u95f4\u8868\u548c\u5de5\u4f5c\u8ba1\u5212\u7684\u53d8\u66f4\uff0c\u4ece\u800c\u786e\u4fdd\u4e00\u4e2a\u9ad8\u6548\u3001\u6d41\u7545\u7684\u5de5\u4f5c\u6d41\u7a0b\u3002\n\n\u672c\u6587\u4ef6\u662f\u6211\u4eec\u7684\u5efa\u8bae\u4e66\uff0c\u4e3a\u6ee1\u8db3\u8d35\u516c\u53f8\u72ec\u7279\u7684\u59d4\u5916\u670d\u52a1\u9700\u6c42\u800c\u91cf\u8eab\u5b9a\u5236\u3002\u6211\u4eec\u5bf9\u80fd\u6709\u673a\u4f1a\u4e0e\u60a8\u5408\u4f5c\u611f\u5230\u975e\u5e38\u5174\u594b\uff0c\u5982\u679c\u83b7\u9009\uff0c\u6211\u4eec\u5c06\u5728\u5404\u4e2a\u65b9\u9762\u4f18\u5148\u8003\u8651\u60a8\u7684\u9700\u6c42\u3002\u6211\u4eec\u671f\u5f85\u5f88\u5feb\u80fd\u4e0e\u8d35\u516c\u53f8\u53ca\u60a8\u7684\u56e2\u961f\u5c55\u5f00\u5408\u4f5c\uff01\n\n\u6b64\u81f4\uff0c\n\n{{our_contact.name}}\n\n\u768b\u7fca\u9999\u6e2f\u4f01\u4e1a\u670d\u52a1\uff08\u9999\u6e2f\uff09\u6709\u9650\u516c\u53f8"}, {"id": "blocks/incorp/regions/hk/scope-of-services", "type": "Section Block", "title": "Scope of services appendix (HK)", "description": "Appendix A \u2014 pre- and post-listing CS scope from HK anchor sample.", "tags": ["incorp", "region:HK", "template:hk-incorp", "locale:zh-CN", "scope"], "group": "blocks", "sz": 34, "body": "## \u9644\u4ef6\u4e00\n\n### \u4e0a\u5e02\u516c\u53f8\u79d8\u4e66\u53ca\u5408\u89c4\u670d\u52a1\u4e4b\u670d\u52a1\u8303\u56f4\n\n#### A \u4e0a\u5e02\u524d\u670d\u52a1\n\n**A1** \u6839\u636e\u9999\u6e2f\u300a\u516c\u53f8\u6761\u4f8b\u300b\u529e\u7406\u6ce8\u518c\u975e\u9999\u6e2f\u516c\u53f8\u7533\u8bf7\u5de5\u4f5c\n\n- \u534f\u52a9\u516c\u53f8\u6ce8\u518c\u6210\u4e3a\u975e\u9999\u6e2f\u516c\u53f8\n- \u8349\u62df\u7533\u8bf7\u6587\u4ef6\u548c\u8868\u683c, \u53ca\u5411\u9999\u6e2f\u516c\u53f8\u6ce8\u518c\u5904\u548c\u5546\u4e1a\u767b\u8bb0\u7f72\u9012\u4ea4\u76f8\u5173\u6587\u4ef6\n\n**A2** \u4e0a\u5e02\u524d\u51fa\u4efb\u516c\u53f8\u79d8\u4e66\u53ca\u6388\u6743\u4ee3\u8868\u3001\u63d0\u4f9b\u9999\u6e2f\u4e3b\u8981\u8425\u4e1a\u5730\u70b9\uff0c\u4ee5\u53ca\u4e0a\u5e02\u524d\u51c6\u5907\u5de5\u4f5c\n\n- \u63d0\u4f9b\u5408\u8d44\u683c\u4eba\u58eb\u62c5\u4efb:\n  - \u5b9e\u540d\u516c\u53f8\u79d8\u4e66 / \u8054\u5e2d\u516c\u53f8\u79d8\u4e66\uff08\u6839\u636e\u300a\u4e0a\u5e02\u89c4\u5219\u300b\u89c4\u5b9a)\n  - \u6388\u6743\u4ee3\u8868\uff0c\u53ca\u4ee3\u8868\u53d1\u884c\u4eba\u5728\u9999\u6e2f\u63a5\u53d7\u5411\u5176\u9001\u8fbe\u7684\u6cd5\u5f8b\u7a0b\u5e8f\u6587\u4ef6\u53ca\u901a\u77e5\u4e66 (\u6839\u636e\u9999\u6e2f\u300a\u516c\u53f8\u6761\u4f8b\u300b\u89c4\u5b9a)\n- \u63d0\u4f9b\u768b\u7fca\u9999\u6e2f\u529e\u516c\u5730\u5740\u4f5c\u4e3a\u516c\u53f8\u5728\u9999\u6e2f\u7684\u4e3b\u8981\u8425\u4e1a\u5730\u70b9(\u5982\u9002\u7528)\n- \u5ba1\u9605\u516c\u53f8\u957f\u8463\u4e8b\u4f1a\u51b3\u8bae\u76f8\u5173\u90e8\u5206\n- \u63d0\u4f9b\u6709\u5173\u5b9e\u540d\u516c\u53f8\u79d8\u4e66/\u8054\u5e2d\u516c\u53f8\u79d8\u4e66\u7b80\u5386\u7684\u8d44\u6599\u63d0\u4f9b\u6587\u6863\u4ee5\u4f9b\u9a8c\u8bc1\u53ca\u51fa\u5e2d\u76f8\u5173\u8bbf\u8c08\n- \u914d\u5408\u9999\u6e2f\u6cd5\u5f8b\u987e\u95ee\u5e76\u7ecf\u516c\u53f8\u786e\u8ba4\u548c\u8463\u4e8b\u6388\u6743\uff0c\u4ee5\u8054\u5e2d\u516c\u53f8\u79d8\u4e66\u7684\u8eab\u4efd\u7b7e\u7f72\u62db\u80a1\u7ae0\u7a0b\u53ca\u76f8\u5173\u6ce8\u518c\u6587\u4ef6\n\n#### B \u4e0a\u5e02\u540e\u670d\u52a1\n\n**B1** \u4e0a\u5e02\u540e\u51fa\u4efb\u516c\u53f8\u79d8\u4e66\u53ca\u6388\u6743\u4ee3\u8868\u4ee5\u53ca\u5e38\u89c4\u79d8\u4e66\u670d\u52a1\n\n(i) \u4e0a\u5e02\u540e\u51fa\u4efb\u516c\u53f8\u79d8\u4e66\u53ca\u6388\u6743\u4ee3\u8868:\n\n\u63d0\u4f9b\u4e00\u540d\u5408\u8d44\u683c\u53ca\u7b26\u5408\u9999\u6e2f\u8054\u4ea4\u6240\u300a\u4e0a\u5e02\u89c4\u5219\u300b\u8981\u6c42\u7b2c 3.28 \u6761\u53ca\u6240\u8ff0\u7684\u8d44\u683c\u7684\u4e13\u4e1a\u4eba\u58eb\u62c5\u4efb\u4ee5\u4e0b\u804c\u4f4d:\n\n- \u5b9e\u540d\u516c\u53f8\u79d8\u4e66 / \u8054\u5e2d\u516c\u53f8\u79d8\u4e66\uff08\u6839\u636e\u300a\u4e0a\u5e02\u89c4\u5219\u300b\u89c4\u5b9a)\n- \u6388\u6743\u4ee3\u8868 / \u66ff\u4efb\u6388\u6743\u4ee3\u8868\uff08\u6839\u636e\u300a\u4e0a\u5e02\u89c4\u5219\u300b\u89c4\u5b9a)\n- \u6388\u6743\u4ee3\u8868\uff0c\u53ca\u4ee3\u8868\u53d1\u884c\u4eba\u5728\u9999\u6e2f\u63a5\u53d7\u5411\u5176\u9001\u8fbe\u7684\u6cd5\u5f8b\u7a0b\u5e8f\u6587\u4ef6\u53ca\u901a\u77e5\u4e66 (\u6839\u636e\u9999\u6e2f\u300a\u516c\u53f8\u6761\u4f8b\u300b\u53ca\u300a\u4e0a\u5e02\u89c4\u5219\u300b\u89c4\u5b9a)\n\n(ii) \u516c\u5e03\u5e74\u5ea6\u4e1a\u7ee9\u3001\u520a\u53d1\u5e74\u62a5\u3001\u4f01\u4e1a\u7ba1\u6cbb\u62a5\u544a\u3001\u4e3e\u884c\u80a1\u4e1c\u5468\u5e74\u5927\u4f1a (\u00ab\u80a1\u4e1c\u5468\u5e74\u5927\u4f1a\u00bb) \u3001\u516c\u5e03\u4e2d\u671f\u4e1a\u7ee9\u53ca\u520a\u53d1\u4e2d\u671f\u62a5\u544a:\n\n- \u8349\u62df\u6709\u5173\u901a\u904e\u5e74\u5ea6\u4e1a\u7ee9/\u4e2d\u671f\u4e1a\u7ee9\u4e4b\u7981\u6b62\u8bc1\u5238\u4ea4\u6613\u671f \uff08\u7981\u552e\u671f\uff09 \u51fd\u4ef6\u4e88\u8463\u4e8b\u53ca\u6709\u5173\u96c7\u5458\u5e76\u53d1\u9001\u7ed9\u8463\u4e8b\u548c\u7ba1\u7406\u5c42;\n- \u5c31\u4e0a\u8ff0\u7981\u552e\u671f\u5411\u9999\u6e2f\u8054\u4ea4\u6240\u4f5c\u51fa\u901a\u77e5;\n- \u5ba1\u9605\u76c8\u559c/\u76c8\u8b66\u516c\u544a;\n- \u51c6\u5907\u6709\u5173\u901a\u8fc7\u5e74\u5ea6\u4e1a\u7ee9/\u4e2d\u671f\u4e1a\u7ee9\u4e4b\u8463\u4e8b\u4f1a\u4f1a\u8bae\u65e5\u671f\u516c\u544a;\n- \u900f\u8fc7\u9999\u6e2f\u8054\u4ea4\u6240\u62ab\u9732\u6613\u53d1\u51fa\u4e0a\u8ff0\u8463\u4e8b\u4f1a\u4f1a\u8bae\u65e5\u671f\u516c\u544a;\n- \u8349\u62df\u8463\u4e8b\u786e\u8ba4\u51fd(\u5305\u62ec\u72ec\u7acb\u975e\u6267\u884c\u8463\u4e8b\u72ec\u7acb\u6027\u4e4b\u5e74\u5ea6\u786e\u8ba4, \u300a\u4e0a\u5e02\u89c4\u5219\u300b\u9644\u5f55C3\u5185\u6807\u51c6\u5b88\u5219\u8981\u6c42\u53ca\u5e74\u62a5/\u4e2d\u671f\u62a5\u544a\u5185\u5176\u4ed6\u62ab\u9732\u4e4b\u786e\u8ba4)\u4ee5\u7f16\u5236\u4f01\u4e1a\u7ba1\u6cbb\u62a5\u544a\u53ca\u4e3a\u5e74\u62a5/\u4e2d\u671f\u62a5\u544a\u5b58\u6863;\n- \u63d0\u4f9b\u6e05\u5355\u4ee5\u786e\u8ba4\u516c\u53f8\u662f\u5426\u6709\u5e94\u7528\u4f01\u4e1a\u7ba1\u6cbb\u5b88\u5219\u5185\u4e4b\u7ba1\u6cbb\u539f\u5219\u53ca\u6709\u5426\u9075\u5b88\u5b88\u5219\u6761\u6587\u53ca\u504f\u79bb\u4e4b\u8be6\u60c5(\u5982\u6709);\n- \u6839\u636e\u516c\u53f8\u63d0\u4f9b\u4e4b\u8d44\u6599\u7f16\u5236/\u5ba1\u9605\u4f01\u4e1a\u7ba1\u6cbb\u62a5\u544a;\n- \u7f16\u5236\u516c\u5e03\u5e74\u5ea6\u4e1a\u7ee9/\u4e2d\u671f\u4e1a\u7ee9\u53ca\u53ec\u5f00\u80a1\u4e1c\u5468\u5e74\u5927\u4f1a\u4e4b\u5de5\u4f5c\u65f6\u95f4\u8868;\n- \u4e3a\u5e74\u62a5\u53ca\u4e2d\u671f\u62a5\u544a\u63d0\u4f9b\u6211\u4eec\u4ee5\u516c\u53f8\u79d8\u4e66\u8eab\u4efd\u4fdd\u5b58\u7684\u6cd5\u5b9a\u8bb0\u5f55\u53ca\u516c\u53f8\u8d44\u8baf\uff08\u8463\u4e8b\u3001\u79d8\u4e66\u3001\u8463\u4e8b\u80a1\u6743\u53ca\u5927\u80a1\u4e1c\u80a1\u6743\uff09;\n- \u4ece\u516c\u53f8\u79d8\u4e66\u89d2\u5ea6\u534f\u52a9\u5ba1\u9605\u5e74\u5ea6\u4e1a\u7ee9\u516c\u544a\uff0c\u5e74\u62a5\uff0c \u4e2d\u671f\u4e1a\u7ee9\u516c\u544a\u53ca\u4e2d\u671f\u62a5\u544a\uff0c\u5e76\u786e\u4fdd\u5176\u7b26\u5408\u9999\u6e2f\u300a\u4e0a\u5e02\u89c4\u5219\u300b\u8981\u6c42;\n- \u534f\u52a9\u7f16\u5236\u901a\u51fd\u4ee5\u6388\u51fa\u4e00\u822c\u6388\u6743\u4ee5\u8d2d\u56de\u80a1\u4efd\u53ca\u53d1\u884c\u65b0\u80a1\u4efd\u53ca\u5efa\u8bae\u91cd\u9009\u9000\u4efb\u8463\u4e8b;\n- \u900f\u8fc7\u9999\u6e2f\u8054\u4ea4\u6240\u62ab\u9732\u6613\u53d1\u51fa\u4ee5\u4e0a\u901a\u51fd;\n- \u4e0e\u80a1\u4efd\u8fc7\u6237\u5904\u6c9f\u901a\u4ee5\u53d6\u5f97\u5e74\u62a5/\u4e2d\u671f\u62a5\u544a\u6240\u9700\u8981\u7684\u80a1\u4e1c\u6570\u636e;\n- \u7f16\u5236\u5fc5\u987b\u5411\u9999\u6e2f\u8054\u4ea4\u6240\u4f5c\u51fa\u5173\u4e8e\u80a1\u4e1c\u5468\u5e74\u5927\u4f1a\u7684\u901a\u77e5;\n- \u51c6\u5907\u80a1\u4e1c\u5468\u5e74\u5927\u4f1a\u901a\u544a\u53ca\u4ee3\u8868\u59d4\u4efb\u8868\u683c;\n- \u900f\u8fc7\u9999\u6e2f\u8054\u4ea4\u6240\u62ab\u9732\u6613\u53d1\u51fa\u80a1\u4e1c\u5468\u5e74\u5927\u4f1a\u901a\u544a\u53ca\u4ee3\u8868\u59d4\u4efb\u8868\u683c;\n- \u51c6\u5907\u4e3b\u5e2d\u8bb2\u7a3f;\n- \u51fa\u5e2d\u80a1\u4e1c\u5468\u5e74\u5927\u4f1a\u53ca\u8349\u62df/\u5ba1\u9605\u8be5\u4f1a\u8bae\u7684\u4f1a\u8bae\u8bb0\u5f55;\n- \u51c6\u5907\u80a1\u4e1c\u5468\u5e74\u5927\u4f1a\u6295\u7968\u7ed3\u679c\u516c\u544a;\n- \u900f\u8fc7\u9999\u6e2f\u8054\u4ea4\u6240\u62ab\u9732\u6613\u53d1\u51fa\u80a1\u4e1c\u5468\u5e74\u5927\u4f1a\u6295\u7968\u7ed3\u679c\u516c\u544a;\n\n(iii) \u8349\u62df/\u5ba1\u9605\u901a\u8fc7\u5e74\u5ea6\u53ca\u4e2d\u671f\u4e1a\u7ee9\u4e4b\u8463\u4e8b\u4f1a\u53ca\u8463\u4e8b\u59d4\u5458\u4f1a\u7684\u76f8\u5173\u6587\u4ef6: \u5c31\u4ee5\u4e0b\u8463\u4e8b\u4f1a\u53ca\u8463\u4e8b\u59d4\u5458\u4f1a\u4f1a\u8bae\u8349\u62df/\u5ba1\u9605\u4f1a\u8bae\u7684\u76f8\u5173\u6587\u4ef6\uff0c\u5305\u62ec\u4f1a\u8bae\u901a\u544a; \u4f1a\u8bae\u8bae\u7a0b; \u51fa\u5e2d\u540d\u5355; \u53ca\u4f1a\u8bae\u8bb0\u5f55(\u542b\u4e00\u822c\u5e38\u89c4\u8bae\u7a0b\u4e4b\u6846\u67b6\u6a21\u7248):\n\n- \u8463\u4e8b\u4f1a (\u6bcf\u5e74 4 \u6b21);\n- \u5ba1\u6838\u59d4\u5458\u4f1a (\u6bcf\u5e74 2 \u6b21);\n- \u63d0\u540d\u59d4\u5458\u4f1a (\u6bcf\u5e74 1 \u6b21);\n- \u85aa\u916c\u59d4\u5458\u4f1a(\u6bcf\u5e74 1 \u6b21);\n- \u4e3b\u5e2d\u4e0e\u72ec\u7acb\u975e\u6267\u884c\u8463\u4e8b\u4f1a\u8bae(\u6bcf\u5e74 1 \u6b21);\n\n(iv) \u7f16\u5236\u6839\u636e\u4ee5\u4e0b\u4e8b\u5b9c\u6240\u5fc5\u987b\u5411\u9999\u6e2f\u8054\u4ea4\u6240\u4f5c\u51fa\u7684\u901a\u77e5\uff08\u900f\u8fc7\u9999\u6e2f\u8054\u4ea4\u6240\u62ab\u9732\u6613\u53d1\u5e03\uff09:\n\n- \u516c\u53f8\u8463\u4e8b\u3001\u516c\u53f8\u79d8\u4e66\u6216\u6388\u6743\u4ee3\u8868\u4e4b\u53d8\u66f4\u6216\u5176\u8054\u7edc\u8d44\u6599\u53d8\u52a8;\n- \u80a1\u606f\u5206\u6d3e\u7684\u6682\u505c\u80a1\u4efd\u8fc7\u6237\u65e5\u671f;\n- \u80a1\u606f\u6d3e\u53d1\u65e5\u671f;\n- \u534f\u52a9\u586b\u5199\u6d3e\u53d1\u80a1\u606f\u8d44\u6599\u8868\u683c(\u5982\u9002\u7528);\n- \u534f\u52a9\u586b\u5199\u4f1a\u8bae\u901a\u77e5\u7535\u5b50\u8868\u683c;\n\n(v) \u9999\u6e2f\u516c\u53f8\u6ce8\u518c\u5904\u7533\u62a5:\n\n- \u51c6\u5907\u53ca\u5411\u9999\u6e2f\u516c\u53f8\u6ce8\u518c\u5904\u63d0\u4ea4\u4f5c\u4e3a\u975e\u9999\u6e2f\u516c\u53f8\u4e4b\u5468\u5e74\u7533\u62a5\u8868\u53ca\u8d44\u6599\u53d8\u66f4\u7684\u6cd5\u5b9a\u8868\u683c\uff0c\u5305\u62ec\u516c\u53f8\u4e3b\u4f53\uff0c \u5176\u8463\u4e8b\uff0c\u516c\u53f8\u79d8\u4e66\u53ca\u6388\u6743\u4ee3\u8868;\n\n(vi) \u5907\u5b58\u80a1\u4efd\u6743\u76ca\u53ca\u6de1\u4ed3\u767b\u8bb0\u518c:\n\n- \u6839\u636e\u300a\u8bc1\u5238\u53ca\u671f\u8d27\u6761\u4f8b\u300b\u7b2c XV \u90e8\u8bbe\u7acb\u7684\u767b\u8bb0\u518c\u53ca\u7d22\u5f15\uff08\u7531\u4e0a\u5e02\u516c\u53f8\u7684\u80a1\u4efd\u8fc7\u6237\u5904\u5907\u5b58\u7684\u80a1\u4e1c\u540d\u518c\u9664\u5916\uff09;\n\n(vii) \u6708\u62a5\u8868:\n\n- \u51c6\u5907/\u5ba1\u9605\u53ca\u534f\u52a9\u63d0\u4ea4\u6708\u62a5\u8868 \uff08\u6bcf\u5e74\u4e0d\u591a\u4e8e12\u4efd\u62a5\u8868\uff09\uff1b\n\n(viii) \u51c6\u5907/\u5ba1\u9605\u53ca\u534f\u52a9\u63d0\u4ea4\u6743\u76ca\u62ab\u9732\u62a5\u8868 \uff08\u6bcf\u5e74\u4e0d\u591a\u4e8e 5 \u4efd\u62a5\u8868\uff09;\n\n(ix) \u63d0\u4f9b\u6709\u5173\u516c\u53f8\u6cbb\u7406\u3001\u300a\u4e0a\u5e02\u89c4\u5219\u300b\u6216\u5176\u4ed6\u6cd5\u89c4\u8981\u6c42\u7684\u66f4\u65b0\u4fe1\u606f\u4ee5\u4f5c\u57f9\u8bad\u4e4b\u7528; \u53ca\n\n(x) \u4e3a\u4e0a\u4f20\u81f3\u9999\u6e2f\u8054\u4ea4\u6240\u62ab\u9732\u6613\u7684\u516c\u544a\u53ca\u901a\u544a\u3001\u51fd\u4ef6\u3001\u8d22\u52a1\u62a5\u8868\u7b49\u63d0\u4f9b\u6807\u9898\u7c7b\u522b\u3002\n\n**B2** \u63d0\u4f9b\u9999\u6e2f\u4e3b\u8981\u8425\u4e1a\u5730\u70b9 (\u5982\u9700\u8981)\n\n- \u63d0\u4f9b\u768b\u7fca\u9999\u6e2f\u529e\u516c\u5730\u5740\u4f5c\u4e3a\u516c\u53f8\u5728\u9999\u6e2f\u7684\u4e3b\u8981\u8425\u4e1a\u5730\u70b9; \u53ca\n- \u6bcf\u5e74\u5411\u9999\u6e2f\u6709\u5173\u76d1\u7ba1\u673a\u6784\u5b89\u6392\u5546\u4e1a\u767b\u8bb0\u8bc1\u7684\u7eed\u671f\u4e8b\u5b9c\u3002"}, {"id": "blocks/incorp/regions/hk/terms-general", "type": "Section Block", "title": "Terms and conditions (HK)", "description": "Formal service agreement terms and governing law from HK anchor sample.", "tags": ["incorp", "region:HK", "template:hk-incorp", "locale:zh-CN", "terms"], "group": "blocks", "sz": 25, "body": "## \u6761\u6b3e\u53ca\u7ec6\u5219\n\n### \u6b63\u5f0f\u670d\u52a1\u534f\u8bae\n\n- \u670d\u52a1\u5c06\u5728\u768b\u7fca\u9999\u6e2f(Ascentium Hong Kong)\u4e0e\u8d35\u516c\u53f8\u4e4b\u95f4\u7b7e\u7f72\u6b63\u5f0f\u670d\u52a1\u534f\u8bae\u540e\u6267\u884c\uff0c\u5e76\u5728\u63a5\u53d7\u6b64\u63d0\u6848\u51fd\u540e\u901a\u8fc7\u4e66\u9762\u7535\u5b50\u90ae\u4ef6\u786e\u8ba4\u3002\n- \u5bf9\u4e8e\u4e0e\u4e0a\u8ff0\u670d\u52a1\u8303\u56f4\u4e4b\u5916\u7684\u4e8b\u9879\u76f8\u5173\u7684\u670d\u52a1\uff0c\u4ee5\u53ca\u65f6\u95f4\u6210\u672c\u8d85\u8fc7\u4e0a\u8ff0\u62a5\u4ef7\u7684\u670d\u52a1\uff0c\u5c06\u6536\u53d6\u989d\u5916\u8d39\u7528\u3002\n- \u6211\u4eec\u7684\u8d39\u7528\u57fa\u4e8e\u73b0\u884c\u6cd5\u89c4\u548c\u5e02\u573a\u60ef\u4f8b\u3002\u5982\u6709\u4efb\u4f55\u53d8\u5316\u5f71\u54cd\u6211\u4eec\u7684\u670d\u52a1\u8303\u56f4\u6216\u6240\u6d89\u53ca\u7684\u5de5\u4f5c\uff0c\u6211\u4eec\u5c06\u4e50\u610f\u4e0e\u60a8\u8ba8\u8bba\uff0c\u4ee5\u8fbe\u6210\u53cc\u65b9\u540c\u610f\u7684\u89e3\u51b3\u65b9\u6848\u3002\n\n### \u7ba1\u8f96\u6cd5\u5f8b\n\n- \u672c\u51fd\u4ef6\u53d7\u9999\u6e2f\u7279\u522b\u884c\u653f\u533a\u6cd5\u5f8b\u7ba1\u8f96\u5e76\u6309\u5176\u89e3\u91ca\uff0c\u672c\u534f\u8bae\u5404\u65b9\u5bf9\u7531\u672c\u51fd\u4ef6\u5f15\u8d77\u7684\u6216\u6839\u636e\u672c\u51fd\u4ef6\u5f15\u8d77\u7684\u4efb\u4f55\u4e89\u8bae\uff0c\u5747\u670d\u4ece\u9999\u6e2f\u7279\u522b\u884c\u653f\u533a\u6cd5\u9662\u7684\u4e13\u5c5e\u7ba1\u8f96\u6743\u3002\n- \u5e0c\u671b\u60a8\u6ee1\u610f\u6211\u4eec\u7684\u63d0\u6848\u3002\u5982\u9700\u8fdb\u4e00\u6b65\u8bf4\u660e\uff0c\u8bf7\u968f\u65f6\u8054\u7edc\u6211\u4eec\u3002"}, {"id": "blocks/incorp/regions/ph/about-incorp", "type": "Section Block", "title": "About InCorp (PH)", "description": "Intro credentials prose from PH anchor sample.", "tags": ["incorp", "region:PH", "template:ph-incorp"], "group": "blocks", "sz": 25, "body": "InCorp is a leading provider of a wide range of professional corporate solutions and services across Asia Pacific. We are the only Singapore-based corporate solutions company to have a presence in 8 countries:\n\nOur award-winning capabilities and resources provide organisations and individuals a full suite of comprehensive services to help them turn their \"Vision To Reality\"."}, {"id": "blocks/incorp/regions/ph/bookkeeping-tax-terms", "type": "Section Block", "title": "Bookkeeping and Tax Compliance Terms (PH)", "description": "General bookkeeping and tax compliance terms A\u2013F from PH anchor sample.", "tags": ["incorp", "region:PH", "template:ph-incorp", "terms"], "group": "blocks", "sz": 38, "body": "## GENERAL BOOKKEEPING AND TAX COMPLIANCE\n\n### A. Minimum Term\n\nThe Services provided herein shall be on a continuing engagement between the Client and In.Corp. However, the Client agrees that this engagement shall be effective for at least twelve (12) months from the time of commencement.\n\n### B. Fee Arrangement\n\nIn.Corp shall require payment within 7 days after receipt of invoice or billing statement. Fees should be received net of bank charges, all applicable taxes and charges. Deficiency as a result of bank charges shall be for the account of the client.\n\nThe Client shall pay a three percent (3%) surcharge by way of penalty every month when fees are not paid on time, computed from the time the amount is due until full payment.\n\n### C. Re-Assessment of Fees\n\nIn.Corp reserves the right to re-assess the fees at the end of each quarter of the calendar year. However, In.Corp shall not implement any increase in the fees unless agreed upon in writing by the Client.\n\n### D. Client's Responsibilities\n\n1. In.Corp's work will be based solely on the information provided, the circumstances made known to In.Corp and the assumptions set out in our correspondence. In.Corp relies on the Client to bring to In.Corp's attention as soon as possible any changes in the information as originally presented.\n2. The timely performance of the Services and meeting the deadlines set by the Client or government agencies depends on timely receipt of accurate data and/or funds from the Client at the times requested.\n3. During the engagement, In.Corp will adhere to the points of contact provided herein.\n4. The Client shall prepare checks for payments to the BIR and other government agencies.\n\nHowever, In.Corp may arrange for the Client to avail of \"use of bank\" services for a separate fee.\n\n### E. Ownership of Work Product\n\nThe Client understands that all work products prepared by In.Corp shall become the property of the Client only upon full payment by the Client of amounts billed by In.Corp for services rendered (\"Outstanding Bills\"). In.Corp shall also have the right to retain in its possession all work products prepared and documents provided by Client under this Service Agreement in the performance of the Services until full payment of all Outstanding Bills.\n\n### F. Termination of Services\n\nThis Agreement may be terminated by either party, by issuing a written notice of termination, through regular correspondence address or email address of the other party marked for the appropriate partner or contact, 30 days before the effectivity date.\n\nIn the event that the Client decides to terminate the engagement after the signing of this proposal, InCorp PH shall have the right to bill the work done and time spent from the commencement of engagement up to termination of service. Actual expenses incurred will be charged to the client."}, {"id": "blocks/incorp/regions/ph/corporate-treasurer-service", "type": "Section Block", "title": "Corporate Treasurer Service (PH)", "description": "Corporate Treasurer officer scope from PH anchor sample.", "tags": ["incorp", "region:PH", "template:ph-incorp"], "group": "blocks", "sz": 30, "body": "## Corporate Treasurer Service\n\n### 1. Corporate Treasurer \u2013 for SEC incorporation\n\n- Acting as Acting Treasurer for the sole purpose of SEC registration, including the opening of the mandatory Treasurer-in-Trust Fund (TITF) bank account. The Treasurer must be a resident of the Philippines. The paid-up capital must be infused into the TITF account prior to the release of the Certificate of Incorporation by the SEC;\n- Preparation of Acceptance Letter for appointment as Treasurer.\n- Preparation of Resignation Letter as Treasurer.\n\nNote: The SEC requires that the capital be infused before the end of the company's fiscal year, but if we are engaged as Corporate Treasurer our management requires us to open a TITF account where the capital must be infused prior to SEC incorporation to ensure compliance with this requirement and avoid penalties.\n\n### 2. Corporate Treasurer \u2013 Post SEC incorporation\n\nSigning of documents required to be signed by the Corporate Treasurer including the following:\n\n- Signing of monthly, quarterly, and annual tax reports for the Bureau of Internal Revenue;\n- Signing of Statement of Management Responsibility for Financial Statements and Income Tax; and\n- Signing of monthly contributions and its related report to Social Security System, Philippine Health Insurance Corporation, and Home Development Mutual Fund"}, {"id": "blocks/incorp/regions/ph/credentials-visual", "type": "Section Block", "title": "Credentials visual pages (PH)", "description": "Image-only credentials spine from PH anchor sample.", "tags": ["incorp", "region:PH", "template:ph-incorp", "credentials", "visual"], "group": "blocks", "sz": 25, "body": "| Section |\n|---------|\n| Snapshot |\n| Locations |\n| Our Full Range of Corporate Services ACROSS ASIA PACIFIC |\n| Key Accreditations And Partners |\n\nImage/table art only in anchor sample. Do not synthesize marketing copy.\n\nSource spine: [Layer 1 spine](/references/extractions/incorp-ph-cs-payroll-bookkeeping-ep/spine.md)."}, {"id": "blocks/incorp/regions/ph/cs-exclusions", "type": "Section Block", "title": "Corporate Secretarial Exclusions (PH)", "description": "CS exclusions from PH anchor sample.", "tags": ["incorp", "region:PH", "template:ph-incorp"], "group": "blocks", "sz": 27, "body": "### EXCLUSIONS OF SERVICE\n\n- Appointment as Corporate Treasurer;\n- Signing of monthly, quarterly, and annual tax reports for the Bureau of Internal Revenue;\n- Signing of Statement of Management Responsibility for Financial Statements and Income Tax;\n- Signing of monthly contributions and other related reports to Social Security System, Philippine Health Insurance Corporation, and Home Development Mutual Fund; and\n- Work requiring extensive study and/or documentation or legal opinions.\n- Attendance in hearings with judicial and quasi-judicial bodies of the government for internal matters of the Corporation.\n- Signing of any document or paper that relates to the operations of the company"}, {"id": "blocks/incorp/regions/ph/cs-scope", "type": "Section Block", "title": "Corporate Secretarial Scope (PH)", "description": "CS scope of service bullets from PH anchor sample.", "tags": ["incorp", "region:PH", "template:ph-incorp"], "group": "blocks", "sz": 30, "body": "## CORPORATE SECRETARIAL AND RESIDENT Agent SERVICES\n\nMaintaining a Corporate Secretary (CS) is mandatory under Philippine Corporate Law for the execution and certification of documents and proceedings of the Board of Directors. The absence of a CS can result in the corporation being placed under SEC Monitoring and fines.\n\n### SCOPE OF SERVICE\n\n- Preparation of minutes of meetings of the stockholders and board of directors;\n- Issuance of corporate secretary's certificates, board resolutions, other certifications;\n- Documentation and reporting of constitutional changes such as changes in the company name, principal address, financial year, increase in capital stock, etc.;\n- Documentation of simple share transfers, reversions of trust, and issuance of shares;\n- Preparation and filing of annual General Information of Sheet or any amendment thereof with the Philippine Securities and Exchange Commission;\n- Preparation of documents to release the audited financial statements (if applicable);\n- Maintenance of stock and transfer book;\n- Printing of stock certificates subject to a separate fee;\n- Regular communication and updates; and\n- Communication on compliance requirements under Philippine Law."}, {"id": "blocks/incorp/regions/ph/cs-service-terms", "type": "Section Block", "title": "CS Service Terms (PH)", "description": "CS-specific TERMS from PH anchor sample.", "tags": ["incorp", "region:PH", "template:ph-incorp", "terms"], "group": "blocks", "sz": 32, "body": "### TERMS\n\n- This service should be available for a minimum one (1) year and shall commence on the first day of the month provided in the Certificate of Incorporation or on the first day of the month from the signing of the proposal. IN.CORP PH will bill CS services quarterly in advance and the client shall pay for the same quarterly. In case of pre-termination initiated by the Client, there shall be a pre-termination fee equivalent to twenty-five percent (25%) of the service fee for the unexpired term of the agreement.\n- The service shall only begin upon receipt of full payment of initial CS service fee, related initial deposit for expenses for the first year, and after InCorp PH's due diligence has been completed.\n- The highest-ranking officer of the company shall sign an undated acceptance to the resignation letter of the Corporate Secretary;\n- Client must post a refundable Cash Deposit of PHP200,000.00 upon engagement for Corporate Secretarial Services. This deposit may be refunded once the Client submits a Director/Officer Liability Insurance Policy. The cash deposit shall be returned six (6) months after the termination of the service or upon submission of the duly filed General Information Sheet (GIS) reflecting the new corporate secretary, whichever comes first;\n- All documents requested by the Client shall be provided to the Client in PDF form;\n- Either party may terminate this agreement at any time for any reason, upon thirty (30) days written notice to the other party. However, invoices will continue to be sent to Client until we receive the SEC filed General Information Sheet reflecting the new Corporate Secretary.\n- This proposal shall be valid within six (6) months from the issuance thereof."}, {"id": "blocks/incorp/regions/ph/executive-summary", "type": "Section Block", "title": "Executive Summary (PH)", "description": "Minimal fee proposal letter closing from PH anchor sample.", "tags": ["incorp", "region:PH", "template:ph-incorp"], "group": "blocks", "sz": 24, "body": "{{proposal_date}}\n\n{{client.contact_name}}\n\nDear {{client.contact_name}},\n\n**RE: FEE PROPOSAL**\n\nOn behalf of In.Corp,\n\n{{our_contact.name}}\n\n{{our_contact.title}}"}, {"id": "blocks/incorp/regions/ph/immigration-scope", "type": "Section Block", "title": "Immigration Scope and Exclusions (PH)", "description": "Immigration scope and exclusions from PH anchor sample (PRV module).", "tags": ["incorp", "region:PH", "template:ph-incorp", "immigration"], "group": "blocks", "sz": 28, "body": "## IMMIGRATION\n\n### SCOPE OF SERVICE\n\n- Preparation and drafting of documentary requirements needed for the above applications (except for documents that need the authentication/apostille of the Philippine Embassy/Consulate);\n- Monitoring and updating of valid stay of the applicant during the application;\n- All related leg work like delivery of documents and passport to and from the client or the subject/s;\n- Consultation and reporting on the status of the application; and\n- Meeting and follow-up with pertinent government officials/officers.\n\n### EXCLUSIONS OF SERVICE\n\n- Drafting of Invitation Letter for Entry Visa application\n- Procurement of Entry Visa for Visa Required Nationals;\n- Apostille or authentication of documents obtained abroad;\n- Annual Report, Cancellation of previous AEP and I-Card, Amendment or Correction of Arrival Stamp, Visa Restamping, and other services not expressly stated in this Agreement."}, {"id": "blocks/incorp/regions/ph/indemnity", "type": "Section Block", "title": "Indemnity (PH)", "description": "Indemnity clause from PH anchor sample.", "tags": ["incorp", "region:PH", "template:ph-incorp", "terms"], "group": "blocks", "sz": 29, "body": "## INDEMNITY\n\nUnder Philippine Corporate Law, corporate officers (President, Treasurer, Secretary, etc.) may be held administratively, civilly, and/or criminally responsible for any unlawful act or omission committed by the corporation through its various agents, regardless if the position/s is/are occupied merely as an accommodation or with a fee. Accordingly, the Client undertakes to indemnify InCorp PH and/or the specific person appointed by the Client to hold the position from all liabilities, costs or expenses arising from any and against all actions, proceedings, claims, or demands of any nature which may be made against InCorp PH or on account of being elected as an officer of the Client, or by reason of any act, deed or any matter done or omitted to be done in his/her capacity as officer under the Client's instructions. The Client (or its lawful representatives) further commits to inform in writing InCorp PH and the person/s concerned of any event or change of circumstance that may affect the appointment, such as, without limitation, change of principal, retirement of business, et. al."}, {"id": "blocks/incorp/regions/ph/nominee-director-service", "type": "Section Block", "title": "Nominee Director Service (PH)", "description": "Nominee Director officer scope from PH anchor sample.", "tags": ["incorp", "region:PH", "template:ph-incorp"], "group": "blocks", "sz": 27, "body": "## Nominee Director Service\n\n- The PHP 200,000 securities deposit applies for both Corporate Secretarial and Nominee Director services. This is a lump sum deposit per client.\n- Refundable six (6) months from the cessation of Nominee Director Service or submission of the Director Liability Insurance Policy.\n- Appointment of one nominee Director for one (1) share;\n- Preparation of Declaration of Trust and Deed of Assignment (DOTDA);\n- Preparation of Termination of Trust;\n- Preparation of Resignation Letters; and\n- Execution of documents such as Minutes and Resolutions for the Board of Directors as Nominees (subject to review)."}, {"id": "blocks/incorp/regions/ph/payroll-services", "type": "Section Block", "title": "Payroll Services (PH)", "description": "Payroll scope, terms, and schedule intro from PH anchor sample.", "tags": ["incorp", "region:PH", "template:ph-incorp", "payroll"], "group": "blocks", "sz": 56, "body": "## PAYROLL SERVICES\n\n### SCOPE OF SERVICES\n\n#### A. Payroll Computation and Payroll Register Generation\n\n1. Configuring pay code taxability per employee;\n2. Maintenance of tax table (Withholding tax table uploaded by BIR); and\n3. Determination of contributions to SSS, Philhealth, and Home Development and Mutual Fund (HDMF).\n4. Pay slips Distribution\n5. Salary disbursement\n\nPayroll Register shall contain individual salaries due to each employee with the corresponding payroll taxes withheld and deductions for SSS, Philhealth, and HDMF for each period.\n\nNote: The Client's HR unit or equivalent shall provide regular timesheet details of the employees, stating the number of man-hours worked, overtime hours, tardiness, and absences.\n\nThe rates shall apply to a maximum of two (2) payroll runs per month. In case the Client requires the Consultant to perform additional payroll runs for a particular month for any reason other than errors committed by the Consultant and will generate separate payroll registers other than the two regular payroll runs, such will be considered as Special Payroll Runs.\n\n#### B. Special Payroll Runs\n\nConsultant can provide Special Payroll Run Services if requested by the Client, such as Final Pay Computation, Separate Bonus/ 13th Month Pay Runs, etc., or any other run that will generate separate Payroll Register and/or Payroll-related Reports other than those mentioned above. The consultant will bill the Client a separate fee equivalent to the number of employees to be included in the generated payroll register/report.\n\nThe consultant will bill the Client a separate fee equivalent to our fee schedule based on the number of employees.\n\n#### C. Preparation of remittances to government agencies, as follows:\n\n1. **Social Security System:** Monthly remittance using R5/PRN form\n2. **Philhealth Insurance:** Monthly report via EPRS\n3. **Home Development Mutual Fund (PAG-IBIG Fund):** Monthly remittance report/ E-Gov\n4. **Bureau of Internal Revenue:**\n   - i. Tax Return for Compensation (BIR Form # 1601C and BIR Form #1604C)\n   - ii. Alphabetical listing (Alphalist Schedule 1 and 2) at year-end for resigned and non-resigned employees. This includes total salaries received per employee, total tax due, withheld and remitted to the Bureau of Internal Revenue.\n   - iii. Preparation of BIR Form # 2316 for individual employees as proof of income tax payment.\n\n#### D. Preparation of 13th-month pay and other bonuses as part of regularly generated Payroll Register\n\n### TERMS & CONDITIONS\n\n1. The billing for payroll services shall commence after the registration with the labor welfare agencies namely, the Social Security System, Department of Labor and Employment, or upon hiring of employees, whichever comes first.\n2. The Client will be billed monthly every first (1st) Monday of the month after the applicable payroll month.\n3. The Client is required to pay within seven (7) days after receipt of the invoice or billing statement. The Client shall pay a three percent (3%) surcharge by way of penalty for every month when fees are not paid on time; computed from the time the amount is due until full payment.\n4. Client's responsibility for the payroll services \u2014 Determination of the number of man-hours worked, overtime hours, tardiness, and absences and preparation of the timesheet based on employees' time logs is the Client's responsibility.\
