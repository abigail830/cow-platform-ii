n5. The Client shall provide the documents relating to its employees which are necessary for In.Corp PH to perform the Services, including, but not limited to, the following:\n   - a. Employee details and a copy of the Contract of Employment for each employee.\n   - b. Employee identification numbers.\n   - c. Form 2316 of the previous employer, if any.\n\n*In case of termination/separation of employment of an employee, the Client shall inform InCorp PH at least 30 days before the effectivity of the termination/separation for the computation of the employee's last pay. The Client shall inform the Consultant of any changes in the status of its employees as soon as practicable.\n\n6. The Client shall observe the payroll schedule table (materialized at compose time from anchor tbl[10]).\n7. In.Corp's work will be based solely on the information provided, the circumstances made known to In.Corp and the assumptions set out in our correspondence. In.Corp relies on the Client to bring to In.Corp's attention as soon as possible any changes in the information as originally presented.\n8. The timely performance of the Services and meeting the deadlines set by the Client or government agencies depends on the timely receipt of accurate data and/or funds from the Client at the times requested.\n9. InCorp reserves the right to re-assess the fees at the end of each quarter of the calendar year. However, InCorp shall not implement any increase in the fees unless agreed upon in writing by the Client.\n10. During the engagement, In.Corp will adhere to the points of contact provided herein.\n11. Client understands that all work products prepared by In.Corp shall become the property of the Client only upon full payment by the Client of amounts billed by In.Corp for services rendered (\"Outstanding Bills\"). In.Corp shall also have the right to retain in its possession all work product prepared and documents provided by Client under this Service Agreement in the performance of the Services until full payment of all Outstanding Bills.\n12. This Agreement may be terminated by either party, by issuing a written notice of termination, through regular correspondence address or email address of the other party marked for the appropriate partner or contact, 30 days before the effectivity date. In the event of termination, fees for the remaining term and expenses incurred to the date of termination are payable by the Client, and the Client is liable to pay twenty-five percent (25%) of the remaining balance.\n13. The Services provided herein shall be on a continuing engagement between the Client and the Consultant. However, the Client agrees that this engagement shall be effective for at least six (6) months from the time of commencement.\n14. In case of pre-termination of this engagement initiated by the Client, there shall be a charged pre-termination fee equivalent to Php 5,000 for every month of the unexpired term of engagement.\n15. This proposal shall be valid within six (6) months from the issuance thereof."}, {"id": "blocks/incorp/regions/ph/recruitment/cdd-documents", "type": "Section Block", "title": "CDD document list header (PH recruitment)", "description": "CDD submission checklist preamble; row content in anchor tbl[7].", "tags": ["incorp", "region:PH", "template:ph-recruitment", "recruitment", "cdd"], "group": "blocks", "sz": 24, "body": "## LIST OF DOCUMENTS FOR SUBMISSION TO ITS FOR CDD PURPOSES\n\nNote: Failure to comply with the submission of documents will regard this Agreement as void or invalid."}, {"id": "blocks/incorp/regions/ph/recruitment/client-conforme", "type": "Section Block", "title": "Client conforme (PH recruitment)", "description": "Client acknowledgement and signature block before client details table.", "tags": ["incorp", "region:PH", "template:ph-recruitment", "recruitment"], "group": "blocks", "sz": 25, "body": "**CLIENT'S CONFORME:**\n\nI hereby acknowledge that I have carefully read and understood the above terms and conditions, and, with my signature below, agree on and consent to such terms and conditions.\n\n___________________________\n\nSignature Above Printed Name\n\nDate Signed:\n\n### CLIENT DETAILS"}, {"id": "blocks/incorp/regions/ph/recruitment/fee-proposal-letter", "type": "Section Block", "title": "Fee proposal letter (PH recruitment)", "description": "Cover letter with client details block from PH recruitment anchor sample.", "tags": ["incorp", "region:PH", "template:ph-recruitment", "recruitment"], "group": "blocks", "sz": 25, "body": "{{proposal_date}}\n\nClient Name: {{client.contact_name}}\n\nClient Company Name: {{client.company_name}}\n\nClient Company Address: {{client.address}}\n\nDear Mr./Mrs. {{client.contact_name}}\n\n**RE: FEE PROPOSAL**\n\nOn behalf of In.Corp,\n\nSincerely,\n\n{{our_contact.name}}"}, {"id": "blocks/incorp/regions/ph/recruitment/guarantee-period", "type": "Section Block", "title": "Guarantee period (PH recruitment)", "description": "Three-month replacement guarantee from PH recruitment anchor sample.", "tags": ["incorp", "region:PH", "template:ph-recruitment", "recruitment"], "group": "blocks", "sz": 28, "body": "### B. GUARANTEE PERIOD\n\nIf the candidate resigns or is terminated by the Client for reasons other than retrenchment, redundancy, unlawful or constructive dismissal before completing three (3) months of service for full-time roles, ITS shall provide a single replacement candidate, whether for the same role or a different role for as long as this Agreement is valid. Difference of cost from the original invoice to the replaced candidate shall be billed accordingly. In cases of termination, the Client is expected to have exercised due process according to the provisions of the Philippine Labor Law. ITS's commitment to this context is the replacement of the successful candidate and not a refund of any portion of the professional search fee. If, for some reason, the client decides to waive the option of requiring a replacement, ITS shall be relieved of said commitment."}, {"id": "blocks/incorp/regions/ph/recruitment/payment-terms", "type": "Section Block", "title": "Payment terms (PH recruitment)", "description": "ITS account statement payment terms from PH recruitment anchor sample.", "tags": ["incorp", "region:PH", "template:ph-recruitment", "recruitment"], "group": "blocks", "sz": 25, "body": "### C. PAYMENT\n\nITS Account Statements are payable seven (7) days from the start date of the successful placement and is subject to 3% interest per month for late payment. The Account Statements shall be generated upon the signing of job offer. Referral can be by mail or by electronic means."}, {"id": "blocks/incorp/regions/ph/recruitment/recruitment-fees-intro", "type": "Section Block", "title": "Recruitment and executive search intro (PH)", "description": "Scope preamble and turnaround note before recruitment fee tables.", "tags": ["incorp", "region:PH", "template:ph-recruitment", "recruitment", "fees"], "group": "blocks", "sz": 28, "body": "## RECRUITMENT AND EXECUTIVE SEARCH\n\n### FEES, MISCELLANEOUS EXPENSES AND SERVICE SCOPE\n\nThis section outlines the estimated fees for InCorp's services of your Philippine-based company. Fees may be incurred based on the time spent on specific tasks or on a per-instance basis. For any additional services not encompassed by this proposal that may incur additional charges, we will receive your approval before any work commences. Please note that all fees mentioned are in Philippine Pesos, exclusive of the prevailing Value-Added Tax (VAT) if applicable.\n\nBased on our understanding of your needs, the following shall be the scope of our services:\n\n### A. RECRUITMENT AND EXECUTIVE SEARCH\n\nNote: Average turnaround time for completion of work is 30-45 days. Number of days may vary depending on complexity of role and availability of talent in the market."}, {"id": "blocks/incorp/regions/ph/recruitment/recruitment-terms", "type": "Section Block", "title": "General terms and conditions (PH recruitment)", "description": "Recruitment-specific GTC sections A\u2013K from PH recruitment anchor sample.", "tags": ["incorp", "region:PH", "template:ph-recruitment", "recruitment", "terms"], "group": "blocks", "sz": 57, "body": "## GENERAL TERMS AND CONDITIONS\n\n### A. INFORMATION AND CONFIDENTIALITY\n\n1. The Client is bound to furnish ITS with any potentially important information that might reasonably relate to the employment of candidates referred. All information shall be treated as confidential.\n2. The Client is obliged to comply with the Philippine Labor and Employment laws with respect to the treatment of the candidate referred by ITS and shall treat the information provided on account of said candidate as confidential.\n3. ITS and the Client are obliged to keep confidential all information, which has been indicated as such in writing, that was obtained from each other in the framework of their agreement, or from another source.\n\n### B. INDEPENDENCE\n\n1. The client shall independently ascertain the suitability of the candidate before entering into an employment contract. ITS will take all reasonable precautions prior to and during the selection, but this does not absolve the Client of its investigational obligation.\n\n### C. TERM AND VALIDITY\n\n1. This Agreement shall be valid for one (1) year from effective date and will auto-renew to the next year unless a written notice from either party is received by the other at least thirty (30) days before intended date of termination or there are changes in the respective signatories..\n2. In case the Client hires a candidate referred by ITS within twelve (12) months from the date of endorsement, this shall be considered as ITS's placement and will be subject to professional fee.\n3. ITS reserves the right to refuse to furnish a replacement candidate if the payment terms under this Agreement are not met.\n\n### D. NON-SOLICITATION\n\n1. ITS shall refrain from approaching the client's employee(s) with the intention of soliciting such employee(s) for another employer, unless such employee takes the initiative by demonstrably making it known that he/she wishes to accept a position elsewhere.\n2. The Client shall, for the duration of this Agreement and for a period of one (1) year from its termination, refrain from approaching ITS's employee(s) with the intention of soliciting such employee(s). The Parties agree that the solicitation of ITS employee(s) shall be cause for liquidated damages in the amount of three (3) times the cost of the recruitment for said employee(s).\n\n### E. RESTRAINT OF TRADE\n\n1. If the Client declines to accept the candidate(s) presented by ITS or the candidate(s) refuses the Client's offer within twelve (12) months from date of endorsement, and an employment contract is nevertheless concluded between candidate and Client, thus shall be considered as ITS's placement and the Client shall be liable to pay the professional fee, which will not affect the right of ITS to claim additional compensation where additional damage can be proven.\n2. The Client is prohibited from passing or introducing candidates on to third parties. If the Client violates this prohibition, he shall be obliged to pay liquidated damages in the amount of double the professional fee. This is applicable from the time of the initial contact between the Client and the third party, even before the actual assignment commences.\n\n### F. FEES\n\n1. In case the Client hires the candidate as an independent contractor. Consultant or on project-based employment, other than a direct hire, the Client agrees to pay 25% of the estimated earnings for the entire project, which is exclusive of other benefits, monetary or otherwise.\n2. In case the Client hires the candidate on a full-time employment on or after the lapse of the consultancy or project term, the Client agrees to pay 18%/20% for respective roles and levels stated in Section of the remaining months of the 12-month period that will serve as basis for imposing the fee of ITS.\n3. In case the Client decides to cancel the hiring of ITS's candidate for reasons other than negative reference checks, health conditions, criminal records, and/or falsification of supporting documents (transcript of records, COE, etc.), after the candidate has formally signed a job offer, the Client agrees to pay ITS a professional fee equivalent to two (2) months' salary based on the selected candidate's offer to cover operational costs, as well as one (1) month salary to be paid to the candidate.\n\n### G. DUPLICATION\n\n1. In order to avoid duplication of candidates between ITS and the Client, the Client agrees to inform ITS after one (1) business day from receipt of endorsements if the candidate(s) are already in the Client's database and is currently undergoing the Client's recruitment process. The Client and ITS agree to recognize that the candidate(s) are tagged as ITS's should they fall under the following conditions:\n   - a. Candidate submitted application to Client but has not received acknowledgment and/or invitation for interview;\n   - b. Candidate was invited by Client but has declined or has withdrawn his/her application altogether;\n   - c. Candidate was processed but has decided to withdraw his/her application;\n   - d. Candidate submitted application and was processed by Client but has never received any communication thereafter; and/or\n   - e. Candidate's application was processed but has not received any communication for the last six (6) months.\n\n### H. DATA PRIVACY\n\n1. By signing this proposal, the Client, as a Data Subject, expressly gives their consent to ITS to collect, process, endorse, share, store, retain, update, and retrieve information, personal or otherwise, provided solely for the purpose of performing the services described in this proposal. The Client also consents to the sharing of their data with ITS' affiliates unless expressly stated otherwise. The Client confirms that they were made aware that the data collected are necessary for the effective performance of the services described in this proposal and that said data will be securely stored by ITS for as long it deems necessary, and it will be destroyed upon express request and consent of the Client. The processing of the collected information may be made through an internal database, online, cloud storage, or through a sub-contractor. Finally, the Client confirms that they were made aware of their rights under the Data Privacy Act and other pertinent laws.\n\n### I. GOVERNING LAW\n\nThis agreement is to be interpreted in accordance with the laws of the Republic of the Philippines.\n\n### J. VENUE AND JURISDICTION\n\nAny dispute or controversy arising under or in connection with this agreement shall be settled solely and exclusively in the proper court of Taguig City, to the exclusion of all other courts.\n\n### K. LIABILITY\n\nITS is in no way liable for damages and losses caused by candidates who were hired through its services."}, {"id": "blocks/incorp/regions/ph/recruitment/services-fees-intro", "type": "Section Block", "title": "Services and fees intro (PH recruitment)", "description": "Shared SERVICES AND FEES preamble also present in recruitment anchor sample.", "tags": ["incorp", "region:PH", "template:ph-recruitment", "recruitment", "fees"], "group": "blocks", "sz": 26, "body": "## SERVICES AND FEES\n\nThis section provides a comprehensive overview of InCorp's Professional Fees, along with other incidental expenses and the estimated government fees, which are calculated either based on specific tasks or on a per-case basis. Please note that any work will commence only upon receipt of your written approval to proceed.\n\nAll fees mentioned are in Philippine Pesos, exclusive charges of remitting, intermediary, and receiving banks.\n\nOut-of-pocket and Transportation costs are at a fixed charge for the entire visa process within NCR and Cebu."}, {"id": "blocks/incorp/regions/ph/service-slas", "type": "Section Block", "title": "Service SLAs (PH)", "description": "PH SERVICE SLAs module \u2014 incorporation work-product matrix, deposit for expenses, and refund policy prose. Refund percentage table materialized at compose time.", "tags": ["incorp", "region:PH", "template:ph-incorp", "SLA"], "group": "blocks", "sz": 44, "body": "## SERVICE SLAs\n\n### Business Registration\n\n| Work | End Work Product | Excluded Work (which may be necessary) | Estimated Time to Complete |\n|------|------------------|----------------------------------------|----------------------------|\n| Securities and Exchange Commission (SEC) Registration | Certificate of Incorporation; Articles of Incorporation and By-Laws; Stock & Transfer Book | GIS Filing (except if engaged as Corporate Secretary); Philippine Tax Identification Number (TIN) Application of Shareholders; Opening of bank account (unless engaged as Corporate Secretary) | 30 Working Days from submission of complete documentary requirements |\n| Local Business Permits Application | Mayor's Permit / Business to Operate; Barangay Clearance; Locational Clearance; Community Tax Certificate; Proof of Payment for Fire Safety Inspection; Comprehensive General Liability (CGL) Insurance Policy; Temporary Sanitary Permit | Permanent Sanitary Permit; Occupancy Permit of Office Unit; Occupancy Permit of Building; Attending seminar for compliance with Bureau of Fire or PESO; Environmental Compliance Certificate (ECC), if required | 20\u201330 Working Days from submission of complete documentary requirements |\n| Bureau of Internal Revenue (BIR) Registration | BIR Certificate of Registration (COR); Ask for Receipt Notice (ARN); Payment of Documentary Stamp Tax on issued shares and lease contract; Loose Leaf BOA; Authority to Print Receipts (ATP); Principal Receipts and/or Invoices | Electronic Filing and Payment System (eFPS) Registration; Electronic Receipts/Invoices Application; Computerized Accounting System | 10\u201320 Working Days from submission of complete documentary requirements |\n| Department of Labor and Employment (DOLE) Registration | DOLE Rule 1020 DOLE Certificate of Registration | | 1 Working Day from submission of complete documentary requirements |\n| Social Security System (SSS) Registration | For the first employee(s) only: Employer Registration (Form R-1); Employment Report (R-1A); L-501 | Registration of succeeding employees; Payment of contributions; Monthly and quarterly reports | 5 Working Days from submission of complete documentary requirements |\n| Philippine Health Insurance Corporation (PHILHEALTH) Registration | For the first employee(s) only: Employer Data Record (Form ER1); Report of Employee Members (Form ER2) | Registration of employees; Payment of contributions; Monthly and quarterly reports | 2\u20133 Working Days from submission of complete documentary requirements |\n| Home Development Mutual Fund (HDMF) Registration | For the first employee only: Membership Registration Remittance Form; Member's Data Form | Registration of employees; Payment of contributions; Monthly and quarterly reports | 5 Working Days from submission of complete documentary requirements |\n| **TOTAL ESTIMATED TIME TO COMPLETE** | | | **75\u201395 Working Days** |\n\n### DEPOSIT FOR EXPENSES\n\nInCorp PH shall provide an expense report for Government Fees (GF) actually charged. Government expenses must be adequately funded to begin work. The Client or InCorp PH shall settle any deficiency or excess, respectively.\n\n### REFUND POLICY\n\nUpon confirmation of the Client of the engagement and the payment of all fees, USD 200 shall be deducted from the total amount of payment made by the Client for professional fees. The remainder shall be refunded based on the table below:\n\n| Work covered | Refund |\n|--------------|--------|\n| Name Reservation | 90% of the remaining Professional Fee |\n| After Drafting of Corporate Documents | 40% of the remaining Professional Fee |\n| After Issuance of License to Transact Business in the Philippines | 20% of the remaining Professional Fee |\n| After commencement of work with LGU and/or the remaining government agencies | 10% of the remaining Professional Fee |\n\nNotice of cancellation must be made via e-mail to the point of contact. A cancellation acknowledgment will be sent within three (3) working days, and fees will be refunded within sixty (60) working days."}, {"id": "blocks/incorp/regions/ph/solution-pricing-intro", "type": "Section Block", "title": "Services and Fees Intro (PH)", "description": "Fees section opening from PH anchor sample.", "tags": ["incorp", "region:PH", "template:ph-incorp", "fees"], "group": "blocks", "sz": 26, "body": "## SERVICES AND FEES\n\nThis section provides a comprehensive overview of InCorp's Professional Fees, along with other incidental expenses and the estimated government fees, which are calculated either based on specific tasks or on a per-case basis. Please note that any work will commence only upon receipt of your written approval to proceed.\n\nAll fees mentioned are in Philippine Pesos, exclusive charges of remitting, intermediary, and receiving banks.\n\nOut-of-pocket and Transportation costs are at a fixed charge for the entire visa process within NCR and Cebu."}, {"id": "blocks/incorp/regions/ph/unified-terms", "type": "Section Block", "title": "Unified Terms and Conditions (PH)", "description": "Unified T&C cluster from PH anchor sample.", "tags": ["incorp", "region:PH", "template:ph-incorp", "terms"], "group": "blocks", "sz": 42, "body": "## UNIFIED TERMS AND CONDITIONS\n\n### PRE-TERMINATION\n\nBoth InCorp PH and the Client shall have the right to terminate the engagement for any reason upon due notice. In the event that the Client decides to terminate the engagement after the signing of this proposal, InCorp PH shall have the right to bill the work done and time spent from the commencement of engagement up to termination of service subject to its Refund Policy. which forms an in integral part of this engagement. Actual expenses incurred by InCorp PH will be charged to the Client.\n\n### FREEZEWORK\n\nIn the event that the Client fails to make timely payments as stipulated in this Agreement, the Service Provider reserves the right to freeze all work related to the Client until outstanding payments are received in full. The freezing of work shall commence upon written notice to the Client detailing the outstanding amounts owed and the actions required for the resumption of work.\n\nShould the Client fail to rectify outstanding payments within 30 working days of receiving notice of the work freeze, the Service Provider reserves the right to terminate this Agreement with immediate effect, without prejudice to any other rights or remedies available under law or equity.\n\n### DATA PRIVACY\n\nBy signing this proposal, the Client, as a Data Subject, expressly gives their consent to InCorp PH to collect, process, endorse, share, store, retain, update, and retrieve information, personal or otherwise, provided solely for the purpose of performing the services described in this proposal. The Client also consents to the sharing of their data with InCorp PH's affiliates unless expressly stated otherwise. The Client confirms that they were made aware that the data collected are necessary for the effective performance of the services described in this proposal and that said data will be securely stored by InCorp PH for as long it deems necessary, and it will be destroyed upon express request and consent of the Client. The processing of the collected information may be made through an internal database, online, cloud storage, or through a sub-contractor. Finally, the Client confirms that they were made aware of their rights under the Data Privacy Act and other pertinent laws.\n\n### GOVERNING LAW\n\nThis agreement is to be interpreted in accordance with the laws of the Republic of the Philippines.\n\n### VENUE AND JURISDICTION\n\nAny dispute or controversy arising under or in connection with this agreement shall be settled solely and exclusively in the proper court of Taguig City, to the exclusion of all other courts.\n\n### LIABILITY\n\nThe total aggregate liability of InCorp PH, for loss or damage (including indirect and consequential loss or damage) caused by, or resulting from, or in relation to, the services, including, whether arising from breach of contract, negligence, or any other tort, in equity or otherwise, and whether InCorp PH was advised of the possibility of such loss or damage, shall be limited to the fees paid to InCorp PH for the portion of the service/s or work product/s giving rise to such liability.\n\nIn case of default in payments, all costs and expenses shall be required to be paid to InCorp PH, including reasonable attorney fees, preceding and subsequent to judgment which may arise or accrue from enforcing this agreement whether such remedy is pursued by filing a suit or otherwise.\n\nShould you find the terms of this proposal acceptable, please indicate your agreement by signing the space provided below. If, however, you have any questions on this proposal, we will be pleased to discuss the matter with you. You may contact us at (+632) 8424-1350 or via e-mail to the Director at {{our_contact.email}}.\n\nWe look forward to a mutually beneficial relationship with you."}, {"id": "blocks/incorp/regions/sg/about-incorp", "type": "Section Block", "title": "About InCorp intro (SG)", "description": "Opening credentials prose from anchor sample. Snapshot / Locations / Accreditations pages are image-only \u2014 see credentials-visual block.", "tags": ["incorp", "region:SG", "template:sg-incorp", "credentials"], "group": "blocks", "sz": 25, "body": "In.Corp Global, an Ascentium Company, is a leading provider of professional corporate solutions and services across Asia Pacific with a strong regional presence in 9 markets:\n\nOur award-winning capabilities and resources provide organisations and individuals a full suite of comprehensive services to help them turn their \"Vision To Reality\"."}, {"id": "blocks/incorp/regions/sg/credentials-visual", "type": "Section Block", "title": "Credentials visual pages (SG)", "description": "Image-only credentials spine from anchor sample. No extractable prose \u2014 export must insert UX assets or rely on Output Shell credentials art.", "tags": ["incorp", "region:SG", "template:sg-incorp", "credentials", "visual"], "group": "blocks", "sz": 26, "body": "Anchor sample H1 sections with **no extractable body text** (layout is image / table art):\n\n| Order | Section (from sample) |\n|-------|------------------------|\n| 1 | Snapshot |\n| 2 | Locations |\n| 3 | Our Full Range of Corporate Services ACROSS ASIA PACIFIC |\n| 4 | Key Accreditations And Partners |\n\nDo not synthesize marketing copy for these pages. When assets are registered, set `resource` on this concept or insert via the template `export` shell credentials zone.\n\nSource spine: [Layer 1 spine](/references/extractions/incorp-sg-cs-tax-payroll-accounting-ff/spine.md)."}, {"id": "blocks/incorp/regions/sg/executive-summary", "type": "Section Block", "title": "Executive Summary (SG)", "description": "Fee proposal letter from anchor sample (PII placeholderized).", "tags": ["incorp", "region:SG", "template:sg-incorp"], "group": "blocks", "sz": 28, "body": "{{proposal_date}}\n\n{{client.contact_name}}\n\n{{client.company_name}}\n\nDear {{client.contact_name}},\n\n**RE: Fee Proposal**\n\nWe are pleased to be presenting our proposal to you.\n\nOur team of experienced professionals work very closely with clients on various corporate, accounting, compliance and governance matter and identify the unique requirements of individual organizations. As a strong believer of long-term partnerships, we are committed to providing tailored solutions that not only meet our clients' objectives, but also giving them a peace of mind to focus on their core businesses.\n\nThe following pages outline our services tailor made to you and we trust that our proposal meets your expectations. We are excited to work with you and look forward to a long and mutually beneficial working relationship with you and the Company.\n\nYours Sincerely and on behalf of In.Corp,\n\n{{our_contact.name}}\n\n{{our_contact.title}}"}, {"id": "blocks/incorp/regions/sg/rikvin-disclaimer", "type": "Section Block", "title": "Rikvin Immigration Disclaimer (SG)", "description": "Subsidiary disclaimer after immigration fee blocks \u2014 verbatim from anchor sample.", "tags": ["incorp", "region:SG", "rikvin", "template:sg-incorp", "immigration"], "group": "blocks", "sz": 25, "body": "Immigration-related services referenced in this proposal will be provided exclusively by RIKVIN PTE. LTD., a fully owned subsidiary of InCorp Group, acting as an independent service provider. RIKVIN PTE. LTD. is registered under UEN: 200708442E and holds an Employment Agency Licence No.: 11C3030, issued by the Ministry of Manpower, Singapore."}, {"id": "blocks/incorp/regions/sg/scope-of-service", "type": "Section Block", "title": "Scope of Service (SG)", "description": "Scope paragraph from anchor sample (service list placeholderized).", "tags": ["incorp", "region:SG", "template:sg-incorp"], "group": "blocks", "sz": 24, "body": "InCorp offers a complete, end-to-end solution to establish and maintain your corporate presence in Singapore. Our proposed solution includes providing {{selected_packages_summary}}."}, {"id": "blocks/incorp/regions/sg/solution-pricing-intro", "type": "Section Block", "title": "Solution and Pricing Intro (SG)", "description": "Fees section opening from anchor sample.", "tags": ["incorp", "region:SG", "template:sg-incorp", "fees"], "group": "blocks", "sz": 26, "body": "This section outlines the estimated fees for In.Corp's services. Our fee structure includes initial setup fees, as well as ongoing charges that may be billed monthly, quarterly, or annually. Additionally, fees may be incurred based on the time spent on specific tasks or on a per-instance basis. For any additional services not encompassed by this proposal that may incur, additional charges, we will receive your approval before any work commences. Please note that all fees mentioned are in Singapore Dollars unless otherwise stated, exclusive of the prevailing Goods and Services Tax (GST)."}, {"id": "blocks/incorp/regions/sg/terms-incorp", "type": "Section Block", "title": "Terms and Conditions (SG Incorp)", "description": "T&C cluster from anchor sample (PII-free).", "tags": ["incorp", "region:SG", "template:sg-incorp", "terms"], "group": "blocks", "sz": 32, "body": "## Formal Service Agreements\n\n- Formal service agreements are to be executed between In.Corp and the Company post the acceptance of this proposal letter by way of a written email.\n- Additional fees will be charged for services rendered in connection with matters outside the scope of services outlined above and for services rendered where time costs exceed the fees quoted above.\n- Our fees are based on current regulations and market practices. Should there be changes which impact our scope of services or effort involved, we will be pleased to discuss them with you to arrive at a mutually agreeable solution.\n\n## Termination\n\n- Either Party may terminate the above-mentioned services with two (2) month's prior written notice thereof. In the event that this engagement is terminated, we shall still be entitled to our fee and out-of-pocket expenses accrued up to the date of the end of service.\n\n## MISC Terms\n\n- All out of pocket expenses reasonably incurred by us on your behalf will be borne by your Company, where prior consent will be obtained from you. The fees and expenses do not include Goods and Services Tax (\"GST\").The GST (if applicable) will be included in our invoices as a separate item.\n\n## Governing Law\n\n- This Letter shall be governed by and construed in accordance with the laws of Singapore and the parties hereto submit to the exclusive jurisdiction of the Courts of Singapore over any disputes, which may arise out of or in accordance with it.\n\nWe hope to hear from you favourably on our proposal. Please do not hesitate to let us know if you need further clarifications."}, {"id": "blocks/incorp/regions/vn/brand-intro-visual", "type": "Section Block", "title": "Brand intro (VN PPT)", "description": "Slides 2\u20135 \u2014 credentials / footprint / offerings; mostly visual in anchor sample.", "tags": ["incorp", "region:VN", "template:vn-incorp", "visual"], "group": "blocks", "sz": 26, "body": "Anchor PPT slides (visual / stats \u2014 not full prose blocks):\n\n| Slide | Section |\n|-------|---------|\n| 2 | Founding Management |\n| 3 | Why Partner with Ascentium? |\n| 4 | Our Global Footprint |\n| 5 | Our Service Offerings |\n\nSparse text in extraction; layout is chart/image heavy. Use template `export` shell intro zones or register `references/ux/` assets.\n\nSource spine: [Layer 1 spine](/references/extractions/incorp-vn-cs-tax-payroll-tax-hr/spine.md)."}, {"id": "blocks/incorp/regions/vn/fee-schedule-intro", "type": "Section Block", "title": "Vietnam Fee Schedule Intro", "description": "Fee schedule disclaimer from VN anchor PPT slide 6.", "tags": ["incorp", "region:VN", "template:vn-incorp", "fees"], "group": "blocks", "sz": 25, "body": "## Vietnam Fee Schedule\n\nFees exclude taxes, disbursements and out-pocket-expenses.\n\nFee rows are materialized per service line (Corporate Services, Accounting & Tax Compliance, HR and Payroll) \u2014 see anchor slides 6\u20139. Do not embed client-specific amounts in this block."}, {"id": "blocks/incorp/regions/vn/sealed-tail-visual", "type": "Section Block", "title": "Sealed tail (VN PPT)", "description": "Closing slides 10\u201311 \u2014 brand seal; handled by Output Shell where possible.", "tags": ["incorp", "region:VN", "template:vn-incorp", "visual"], "group": "blocks", "sz": 25, "body": "| Slide | Content |\n|-------|---------|\n| 10 | We Are Ascentium (brand close) |\n| 11 | Contact Us \u2014 merge fields for commercial contact |\n\nContact slide contains sample signatory details in anchor \u2014 use `{{our_contact.*}}` at compose time. Sealed tail handled by template `export` shell where possible."}, {"id": "blocks/incorp/shared/estimated-first-invoice-value", "type": "Section Block", "title": "Estimated first invoice value", "description": "Optional fee rollup table before terms \u2014 heading and column shape only. Amounts materialize via first-invoice attested computation from solution_and_fees.", "tags": ["incorp", "shared", "fees", "first-invoice", "optional"], "group": "blocks", "sz": 27, "body": "## ESTIMATED FIRST INVOICE VALUE\n\nRollup table materialized by [First invoice from fee tables](/computations/first-invoice-from-fee-tables.md). **Do not** paste fee amounts or totals in this block \u2014 rows come from `solution_and_fees` at compose time.\n\n| Services | Price ({{currency}}) | {{tax_label}} ({{tax_rate_display}}) | Total ({{currency}}) |\n|----------|----------------------|----------------------------------------|----------------------|\n| *(one row per selected fee line)* | | | |\n| **Total** | *(sum)* | *(sum)* | *(sum)* |\n\nPlace this section **after** fee modules and client-details block, **before** terms and conditions (SG anchor order)."}, {"id": "brand/ascentium-pptx-shell", "type": "Output Shell", "title": "Ascentium PPT brand shell", "description": "Default PowerPoint deliverable chrome \u2014 4 intro slides, content after slide 4, sealed We Are Ascentium + Contact tail.", "tags": ["brand", "shell", "pptx", "ascentium"], "group": "brand", "sz": 31, "body": "# Ascentium PPT brand shell\n\nLayer 1 extraction: [slide map](/references/extractions/brand-shell-20260726/pptx/slides.md).\n\n## Purpose\n\nFallback **output chrome** for pitch decks, audit decks, and service overviews. Intro slides 1\u20134 are fixed brand content; proposal slides insert after slide 4; slides 5\u20136 are sealed.\n\n## Slide map\n\n| # | Role | Action |\n|---|------|--------|\n| 1 | Title | Merge `proposal_title`, `proposal_date` |\n| 2 | Why Partner / KPIs | Keep unless user drops |\n| 3 | Global footprint | Keep unless user drops |\n| 4 | Service offerings | Keep or trim on request |\n| 5 | We Are Ascentium | **Sealed** \u2014 no proposal body |\n| 6 | Contact Us | Merge contact fields; must stay last |\n\n## Merge keys\n\n| Key | Slide |\n|-----|-------|\n| `proposal_title` | 1 |\n| `proposal_date` | 1 |\n| `contact_name` | 6 |\n| `contact_title` | 6 |\n| `contact_email` | 6 |\n| `contact_number` | 6 |\n\n## Content insertion\n\n```text\nmerge references/templates/ascentium-pptx-brand-shell.pptx \u003cout.pptx> --data {...} --force\nadd \u003cout.pptx> / --type slide --prop layout=\"Clean Slide - White\" --prop title=\u003cchapter> --after /slide[4]\n```\n\nChain `--after /slide[N]` as indices shift. Never `--after /slide[5]` or `/slide[6]` on the pristine 6-slide shell.\n\n## Content slide defaults\n\n| Element | Props |\n|---------|-------|\n| Body shape | `x=1.5cm y=3.5cm width=22cm height=12cm size=18pt font=Poppins` |\n| Table | `x=1.5cm y=3.8cm` + `colWidths` in cm (~22cm total) |\n\nOne title per content slide: use `--prop title=` only \u2014 do not duplicate with a second title shape."}, {"id": "brand/ascentium-word-shell", "type": "Output Shell", "title": "Ascentium Word brand shell", "description": "Default Word deliverable chrome \u2014 cover merge, credentials art page, body insert before sealed back cover, CONTACT US close.", "tags": ["brand", "shell", "word", "ascentium"], "group": "brand", "sz": 31, "body": "# Ascentium Word brand shell\n\nLayer 1 extraction: [zone map](/references/extractions/brand-shell-20260726/word/zones.md).\n\n## Purpose\n\nFallback **output chrome** for Word proposals, letters, fee schedules, and SOWs. The shell carries brand art and merge placeholders only \u2014 proposal body is inserted at runtime.\n\n## Zones\n\n| Zone | Anchor | Rule |\n|------|--------|------|\n| Cover | `proposal_title`, `proposal_date` | Merge on copy |\n| Credentials art | After first page break (`340ADF8B`) | Decorative \u2014 no body content |\n| Body | `--before /body/p[@paraId=202EA4F9]` | All proposal sections stack here |\n| Back cover | `202EA4F9` \u2192 `3CBF0169` | Sealed tail \u2014 never insert after |\n\n## Merge keys\n\n| Key | Notes |\n|-----|-------|\n| `proposal_title` | Cover |\n| `proposal_date` | Cover |\n| `our_contact_name` | Back cover (file uses `our_contact_*`, not `contact_*`) |\n| `our_contact_title` | Back cover |\n| `our_contact_number` | Back cover |\n\n## Body insert command\n\n```text\nadd \u003cdeliverable.docx> /body --type paragraph \\\n  --prop text=\u003cheading> --prop bold=true --prop size=16pt --prop font=Poppins \\\n  --before /body/p[@paraId=202EA4F9]\n```\n\nFirst body chapter: no `pageBreakBefore`. Later major chapters: `pageBreakBefore=true`.\n\n## Typography & tables\n\n- Body: Poppins 11pt, `lineSpacing=1.0x`, `spaceAfter=6pt`\n- Major headings: 16pt bold\n- Table `colWidths` (twips): 3-col `2200,3200,3400`; printable width \u2248 8800 twips\n\n## Deprecated anchors\n\nDo not use `52E883DC` or `4676E560` \u2014 see anchors JSON."}, {"id": "computations/fee-table-total-column", "type": "Attested Computation", "title": "Fee table Total column (multi-frequency)", "description": "Per-row annualized rollup for optional Total column on multi-frequency fee tables: once-off + monthly\u00d712 + quarterly\u00d74 + annual. Validated against incorp-ph-cs-payroll-bookkeeping-ep tbl[4\u20137].", "tags": ["finance", "fees", "total-column", "multi-frequency", "incorp", "shared"], "group": "computations", "sz": 45, "body": "# Definition\n\nMaterializes the optional **Total** column on [multi-frequency](/layouts/multi-frequency.md) fee tables. Any region/template that enables `show_total_column` uses this computation \u2014 not region-specific logic in the layout file.\n\n**Annualized** rollup (year-equivalent), not first-invoice amount. For first-invoice rollup see [first-invoice-from-fee-tables](/computations/first-invoice-from-fee-tables.md).\n\n# Inputs\n\n| Field | `fees` key (layout) | Anchor column header |\n|-------|---------------------|----------------------|\n| Once-off | `once_off` | One-off |\n| Monthly | `monthly` | Monthly |\n| Quarterly | `quarterly` | Quarterly |\n| Annual | `annual` | Annually |\n\nDefault `frequency_keys`: `[\"once_off\", \"monthly\", \"quarterly\", \"annual\"]`.\n\n# Algorithm\n\nFor each `fee_row`:\n\n1. **Parse** each frequency cell to a decimal amount, or skip that component:\n   - Empty, `-`, `Custom`, or text with no leading number \u2192 component = 0 (non-contributing).\n   - **Once-off with `/`** (e.g. `92,530/308,500`) \u2192 use **first segment only** before `/`.\n   - Otherwise \u2192 **first numeric token** in the string (e.g. `85,000 and Government fee 20,000.00` \u2192 `85000`; government fee suffix excluded).\n2. **Row total**:\n   ```\n   total = once_off + (monthly \u00d7 12) + (quarterly \u00d7 4) + annual\n   ```\n3. If all four components are non-parseable \u2192 `total = null` (leave cell empty; anchor: Custom bookkeeping row, descriptive-only annualization row).\n4. Round to currency minor units (2 dp for PHP/AUD; template may override).\n\n# Anchor validation (PH tbl[4\u20136])\n\n| Pattern | Example | Total |\n|---------|---------|-------|\n| One-off only | Business registration one-off | = one-off |\n| Monthly \u00d7 12 | CS PHP 15,000/mo | 180,000 |\n| Annual only | Virtual office PHP 5,500/yr | 5,500 |\n| One-off slash | OPE `92,530/308,500` | 92,530 |\n| Mixed none | Bookkeeping `Custom` monthly | *(empty)* |\n\ntbl[7] (one-off + Total only): `total = parse_once_off(one_off)` \u2014 same once-off parser, other frequencies zero.\n\n# Output\n\nWrite computed value to `fees.total` (display + amount). Do not store in Section Block bodies.\n\n# Layout compatibility\n\n| Layout | Total column |\n|--------|--------------|\n| [multi-frequency](/layouts/multi-frequency.md) | **Yes** \u2014 anchor validated |\n| [oneoff-recurring](/layouts/oneoff-recurring.md) | No Total column (use first-invoice computation instead) |\n| `custom` | Opt-in via template `fee_layout.show_total_column` |\n\n# Computation\n\n```python\nimport re\nfrom decimal import Decimal, ROUND_HALF_UP\n\nNON_AMOUNT = re.compile(r\"(?i)^(?:custom|-+|n/a)$\")\n\ndef parse_amount(cell) -> Decimal | None:\n    if cell is None:\n        return None\n    if isinstance(cell, dict):\n        if cell.get(\"amount\") is not None:\n            return Decimal(str(cell[\"amount\"]))\n        cell = cell.get(\"display\", \"\")\n    s = str(cell).strip()\n    if not s or NON_AMOUNT.search(s):\n        return None\n    m = re.search(r\"([\\d,]+(?:\\.\\d+)?)\", s)\n    return Decimal(m.group(1).replace(\",\", \"\")) if m else None\n\ndef parse_once_off(cell) -> Decimal | None:\n    if cell is None:\n        return None\n    if isinstance(cell, dict):\n        cell = cell.get(\"display\") or cell.get(\"amount\")\n    s = str(cell).strip()\n    if \"/\" in s:\n        s = s.split(\"/\")[0]\n    return parse_amount(s)\n\ndef fee_row_total(\n    fee_row,\n    frequency_keys=(\"once_off\", \"monthly\", \"quarterly\", \"annual\"),\n    multipliers=None,\n):\n    multipliers = multipliers or {\n        \"once_off\": 1,\n        \"monthly\": 12,\n        \"quarterly\": 4,\n        \"annual\": 1,\n    }\n    fees = fee_row.get(\"fees\") or {}\n    parts = []\n    for key in frequency_keys:\n        raw = fees.get(key)\n        if key == \"once_off\":\n            amt = parse_once_off(raw)\n        else:\n            amt = parse_amount(raw if not isinstance(raw, dict) else raw.get(\"display\") or raw.get(\"amount\"))\n        if amt is not None:\n            parts.append(amt * Decimal(str(multipliers[key])))\n    if not parts:\n        return None\n    return sum(parts, Decimal(0)).quantize(Decimal(\"0.01\"), ROUND_HALF_UP)\n```\n\n# Consumers\n\n* [ph-incorp](/templates/ph-incorp.md) \u2014 `solution_and_fees.fee_layout.show_total_column`\n* [au-advisory](/templates/au-advisory.md) \u2014 optional when Total column enabled on multi-frequency tables"}, {"id": "computations/first-invoice-from-fee-tables", "type": "Attested Computation", "title": "First invoice from fee tables (one-off / recurring)", "description": "Roll up solution_and_fees rows into an estimated first-invoice table: per-line price from one-off or first recurring period, tax per line, grand total. Validated against incorp-sg-cs-tax-payroll-accounting-ff tbl[6].", "tags": ["finance", "fees", "first-invoice", "incorp", "gst", "optional"], "group": "computations", "sz": 49, "body": "# Definition\n\nMaterializes the optional **Estimated first invoice value** section ([shared block](/blocks/incorp/shared/estimated-first-invoice-value.md)) from `solution_and_fees` fee rows.\n\n**Not** annualised recurring totals. **Not** ad-hoc rows (when `exclude_adhoc_pattern` matches).\n\n# Inputs\n\n| Parameter | Source (typical) | Notes |\n|-----------|------------------|-------|\n| `fee_rows` | `solution_and_fees` materialized rows | One row per selected SKU line |\n| `tax_rate` | Template `derivation.tax.rate` | e.g. `0.09` SG GST |\n| `tax_label` | Template `derivation.tax.label` | e.g. `GST` |\n| `currency` | Template `fee_layout.currency` | e.g. `SGD` |\n| `exclude_adhoc_pattern` | Template `derivation.exclude.pattern` | Default below |\n\nEach `fee_row` exposes (from [oneoff-recurring](/layouts/oneoff-recurring.md) shape):\n\n- `title` / `service_name` \u2014 line label in output\n- `fees.one_off.amount` or `fees.one_off.display`\n- `fees.recurring.amount` or `fees.recurring.display` (+ optional `period`)\n\n# Algorithm\n\nFor each `fee_row` in `fee_rows`:\n\n1. **Skip** if `exclude_adhoc_pattern` matches any of `service_name`, `description`, `scope_of_work`, `scope_of_work_display`, `preview_primary` (case-insensitive).\n2. **Line price** (`price`):\n   - If `fees.one_off` has a parseable numeric amount \u2192 use it.\n   - Else if `fees.recurring` has a parseable numeric amount \u2192 use **first billing period only** (the number before frequency words such as Monthly, Quarterly, Annual). **Do not** multiply by 12 for monthly rows.\n   - Else \u2192 skip row (both columns empty or `-`).\n3. **Per-line tax**: `gst = round(price * tax_rate, 2)` (round half-up per currency minor unit).\n4. **Per-line total**: `total = price + gst`.\n5. Emit output row: `{ service: title, price, gst, total }`.\n\n**Footer rollup** (separate total row):\n\n- `subtotal_price = sum(price)`\n- `subtotal_gst = sum(gst)`\n- `grand_total = sum(total)`\n\nAnchor check (SG sample, 26 lines): `subtotal_price = 19,380`, `subtotal_gst = 1,744.20`, `grand_total = 21,124.20` at `tax_rate = 0.09`.\n\n# Output table shape\n\n| Column | Header (SG anchor) | Content |\n|--------|-------------------|---------|\n| `service` | Services | Fee row title |\n| `price` | Price (SGD) | Line price before tax |\n| `gst` | GST (SGD) (9%) | Per-line tax |\n| `total` | Total (SGD) | Price + GST |\n| *(footer)* | Total | Column sums |\n\nRegion templates may override column headers via `derivation.tax.label` / `currency`; computation values stay numeric.\n\n# Layout compatibility\n\n| Layout | Supported |\n|--------|-----------|\n| [oneoff-recurring](/layouts/oneoff-recurring.md) | **Yes** \u2014 anchor validated |\n| [multi-frequency](/layouts/multi-frequency.md) | Partial \u2014 map first selected frequency column to `first_period_amount` (no anchor yet) |\n| `custom` | Agent maps columns explicitly before calling |\n\n# Computation\n\n```python\nimport re\nfrom decimal import Decimal, ROUND_HALF_UP\n\nDEFAULT_EXCLUDE = r\"(?i)(?\u003c![a-z-])ad[\\s-]?hoc(?![a-z])\"\n\ndef parse_amount(cell) -> Decimal | None:\n    if cell is None:\n        return None\n    if isinstance(cell, dict):\n        if cell.get(\"amount\") is not None:\n            return Decimal(str(cell[\"amount\"]))\n        cell = cell.get(\"display\", \"\")\n    s = str(cell).strip()\n    if not s or s == \"-\":\n        return None\n    m = re.search(r\"([\\d,]+(?:\\.\\d+)?)\", s)\n    return Decimal(m.group(1).replace(\",\", \"\")) if m else None\n\ndef line_price(row) -> Decimal | None:\n    fees = row.get(\"fees\") or {}\n    one_off = parse_amount(fees.get(\"one_off\"))\n    if one_off is not None:\n        return one_off\n    return parse_amount(fees.get(\"recurring\"))\n\ndef first_invoice_lines(\n    fee_rows,\n    tax_rate: float,\n    exclude_adhoc_pattern: str = DEFAULT_EXCLUDE,\n):\n    pat = re.compile(exclude_adhoc_pattern)\n    fields = (\"service_name\", \"description\", \"scope_of_work\", \"scope_of_work_display\", \"preview_primary\")\n    lines = []\n    for row in fee_rows:\n        if any(pat.search(str(row.get(f) or \"\")) for f in fields):\n            continue\n        price = line_price(row)\n        if price is None:\n            continue\n        gst = (price * Decimal(str(tax_rate))).quantize(Decimal(\"0.01\"), ROUND_HALF_UP)\n        total = price + gst\n        lines.append({\n            \"service\": row.get(\"title\") or row.get(\"service_name\"),\n            \"price\": price,\n            \"gst\": gst,\n            \"total\": total,\n        })\n    subtotal_price = sum((l[\"price\"] for l in lines), Decimal(0))\n    subtotal_gst = sum((l[\"gst\"] for l in lines), Decimal(0))\n    grand_total = sum((l[\"total\"] for l in lines), Decimal(0))\n    return {\n        \"lines\": lines,\n        \"subtotal_price\": subtotal_price,\n        \"subtotal_gst\": subtotal_gst,\n        \"grand_total\": grand_total,\n    }\n```\n\n# Consumers\n\n* [sg-incorp](/templates/sg-incorp.md) \u2014 `first_invoice` derived section (anchor validated)\n* [ph-incorp](/templates/ph-incorp.md), [au-advisory](/templates/au-advisory.md), [hk-incorp](/templates/hk-incorp.md) \u2014 optional; set `derivation.tax` per region"}, {"id": "examples/harneys-hk-incorporation", "type": "Reference Proposal", "title": "Harneys HK \u2014 Company Formation & Administration Rates", "description": "Bilingual EN/ZH administration rates schedule for Hong Kong company formation. Matrix-style fee tables \u2014 not a standard proposal letter.", "tags": ["harneys", "region:HK", "jurisdiction:HK", "Word", "bilingual", "rates-schedule"], "group": "examples", "sz": 27, "body": "# Reference: Harneys HK Incorporation Rates\n\nLayer 1 extraction: [extraction spine](/references/extractions/harneys-hk-incorporation/spine.md).\n\n\n## Format\n\n| Field | Value |\n|-------|-------|\n| Region | HK |\n| BU | Harneys / Ascentium Fiduciary |\n| Deliverable | Word (bilingual rates schedule) |\n| Language | EN + zh-CN |\n\n## Structure\n\n| Zone | Content |\n|------|---------|\n| Cover | Formation & administration rates title + `{{client.company_name}}` |\n| Master schedule | tbl[1] \u2014 37 rows |\n| Footnotes | Foot Notes \u811a\u6ce8 / Notes \u6ce8 |\n| Supporting | tbl[2]\u2013tbl[19] |\n\n## Fee pattern\n\nMulti-column **rates matrix** \u2014 not `oneoff-recurring` or standard 3-column quotation layout.\n\n## Notes\n\nStudy for HK offshore admin pricing structure. No client-specific amounts in this concept."}, {"id": "examples/harneys-uk-bvi-all-options", "type": "Reference Proposal", "title": "Harneys BVI \u2014 All Options Letter", "description": "BVI options proposal covering incorporation, Approved Manager, compliance, director services, and optional annual items. Harneys/Ascentium fiduciary format.", "tags": ["harneys", "region:UK", "jurisdiction:BVI", "Word", "incorporation", "approved-manager", "compliance"], "group": "examples", "sz": 29, "body": "# Reference: Harneys BVI All Options\n\nLayer 1 extraction: [extraction spine](/references/extractions/harneys-uk-bvi-all-options/spine.md).\n\n\n## Format\n\n| Field | Value |\n|-------|-------|\n| Region | BVI |\n| BU | Harneys / Ascentium Fiduciary |\n| Deliverable | Word (options letter) |\n\n## Section spine\n\n1. Cover letter \u2014 requested services list\n2. About Ascentium / Fiduciary heritage\n3. **Incorporation** \u2014 setup + annual maintenance (tbl[1]\u2013tbl[2])\n4. Ad-hoc / excluded services narrative\n5. KYC requirements (tbl[3])\n6. **Approved Manager** \u2014 regime benefits + fee table (tbl[4])\n7. Service capability prose (formation, RA/RO, compliance, AEOI)\n8. **Optional Items** (tbl[5])\n9. **Annual fees** blocks (tbl[6]\u2013tbl[8])\n10. AEOI full scope\n11. What we will need from you\n\n## Fee pattern\n\nUSD blocks: incorporation one-off + annual maintenance + optional line items. Custom Harneys layout (not catalog SKU layouts).\n\n## Section Block candidates\n\n- Approved Manager benefits list\n- AEOI / FATCA compliance descriptions\n- \"What we will need\" KYC checklist"}, {"id": "examples/harneys-uk-cayman-all-options", "type": "Reference Proposal", "title": "Harneys Cayman \u2014 All Options Letter", "description": "Cayman options proposal \u2014 incorporation, foundation, CIMA-regulated SPC fund transfer, annual fees, and optional items. Fund & fiduciary format.", "tags": ["harneys", "region:UK", "jurisdiction:Cayman", "Word", "incorporation", "foundation", "fund-admin"], "group": "examples", "sz": 29, "body": "# Reference: Harneys Cayman All Options\n\nLayer 1 extraction: [extraction spine](/references/extractions/harneys-uk-cayman-all-options/spine.md).\n\n\n## Format\n\n| Field | Value |\n|-------|-------|\n| Region | Cayman |\n| BU | Harneys / Ascentium Fiduciary |\n| Deliverable | Word (multi-product options letter) |\n\n## Section spine\n\n1. Cover letter \u2014 Cayman services requested\n2. About Ascentium\n3. **Incorporation** \u2014 setup + annual fees\n4. **Foundation** \u2014 Cayman foundation structure + fees\n5. **CIMA SPC fund transfer** \u2014 scope, annual fees, out-of-scope work\n6. Optional / annual fee tables\n7. What we will need from you\n\n## Fee pattern\n\nUSD multi-product blocks. Fund administration annual fee matrix (year \u00d7 description \u00d7 amount). Custom Harneys/Cayman \u2014 not `oneoff-recurring` layout.\n\n## Distinction from BVI sample\n\nAdds **foundation** and **regulated fund transfer** modules absent in the BVI anchor sample.\n\n## Section Block candidates\n\n- Foundation explainer (civil law jurisdiction positioning)\n- CIMA SPC scope narrative"}, {"id": "examples/incorp-au-audit", "type": "Reference Proposal", "title": "InCorp AU \u2014 Audit & Assurance", "description": "15-slide AU audit & assurance proposal deck. Executive summary, fee proposal with 3-year estimates, team bios, methodology, timeline, independence.", "tags": ["incorp", "region:AU", "jurisdiction:AU", "PPT", "audit", "assurance"], "group": "examples", "sz": 29, "body": "# Reference: InCorp AU Audit & Assurance\n\nLayer 1 extraction: [extraction spine](/references/extractions/incorp-au-audit/spine.md).\n\n\n## Format\n\n| Field | Value |\n|-------|-------|\n| Region | AU |\n| BU | In.Corp Audit & Assurance |\n| Deliverable | PPT (15 slides) |\n\n## Slide spine\n\n| # | Section |\n|---|---------|\n| 1 | Cover |\n| 2 | Testimonials |\n| 3 | Transmittal letter |\n| 4 | Executive Summary |\n| 5 | About Our Firm |\n| 6 | Value Added + **Fee Proposal** (3-year table) |\n| 7 | Statutory vs value-add comparison |\n| 8 | Client Service Team |\n| 9\u201312 | Approach / experience / audit methodology |\n| 13 | Timeline |\n| 14 | Quality Assurance & Independence |\n\n## Fee pattern\n\n| Nature of service | Amount (AUD) |\n\nIncludes goodwill no-charge transition items + multi-year audit/review fees.\n\n## Compare\n\n| | AU audit (this) | SG internal audit |\n|---|-----------------|-------------------|\n| Slides | 15 | 60 |\n| Focus | Statutory audit & assurance | Internal audit 3-year plan |\n\n## Section Block candidates\n\n- Value-add comparison table (statutory vs In.Corp)\n- Independence / APES 110 boilerplate"}, {"id": "examples/incorp-au-incorporation", "type": "Reference Proposal", "title": "InCorp AU \u2014 Incorporation", "description": "Australia Word incorporation proposal with service fee tables, fee summary, and dual payment options (progressive billing vs tax monthly retainer).", "tags": ["incorp", "region:AU", "jurisdiction:AU", "Word", "incorporation"], "group": "examples", "sz": 28, "body": "# Reference: InCorp AU Incorporation\n\nLayer 1 extraction: [extraction spine](/references/extractions/incorp-au-incorporation/spine.md).\n\n\n## Format\n\n| Field | Value |\n|-------|-------|\n| Region | AU |\n| BU | In.Corp Advisory (AU) |\n| Deliverable | Word (InCorp Advisory template) |\n| Currency | AUD (excl. 10% GST, 2.5% disbursement) |\n\n## Section spine\n\n1. Cover + TOC\n2. About InCorp Advisory \u2192 Accreditations\n3. Fee Proposal letter\n4. Fees \u2014 service modules (tbl[4]\u2013tbl[6])\n5. **Fee SUMMARY**\n6. **Payment Option A** \u2014 Progressive billing (tbl[7])\n7. **Payment Option B** \u2014 Tax monthly retainer (tbl[8])\n\n## AU-specific modules\n\n| Module | Notes |\n|--------|-------|\n| Payment Option A/B | **Distinctive AU pattern** \u2014 dual billing models after fee tables |\n| GST + disbursement | Repeated disclaimers (10% GST, 2.5% disbursement) |\n\n## Layout\n\nMaps to layout `multi-frequency`.\n\n## Section Block candidates\n\n- Payment Option A / B boilerplate\n- AU GST and disbursement disclaimer"}, {"id": "examples/incorp-hk-cs-zh-cn", "type": "Reference Proposal", "title": "InCorp HK \u2014 Corporate Secretarial (zh-CN)", "description": "InCorp Hong Kong Word proposal anchor \u2014 company secretarial and compliance. This sample is zh-CN and happens to use a listed-company / IPO project context.", "tags": ["incorp", "region:HK", "jurisdiction:HK", "Word", "zh-CN", "company-secretary"], "group": "examples", "sz": 28, "body": "# Reference: InCorp HK Corporate Secretarial (zh-CN)\n\nLayer 1 extraction: [extraction spine](/references/extractions/incorp-hk-cs-zh-cn/spine.md).\n\n\n## Format\n\n| Field | Value |\n|-------|-------|\n| Region | HK |\n| BU | InCorp \u2014 Ascentium Corporate Services (HK) |\n| Deliverable | Word |\n| Language | **zh-CN** (Simplified Chinese) in this anchor sample |\n\n## Section spine\n\n1. Cover \u2014 \u79d8\u4e66\u53ca\u5408\u89c4\u670d\u52a1\u8d39\u7528\u63d0\u6848\n2. Proposal letter\n3. \u768b\u7fca\u9999\u6e2f\u4ecb\u7ecd / credentials\n4. **\u9879\u76ee\u5c0f\u7ec4\u67b6\u6784** \u2014 \u9879\u76ee\u9886\u5bfc / \u9879\u76ee\u7ecf\u7406 / \u9879\u76ee\u6210\u5458 / \u670d\u52a1\u6838\u5fc3\u6210\u5458\n5. Fee tables (tbl[1]\u2013tbl[5])\n6. Terms & scope\n\n## Fee pattern\n\nCustom HK fee-table columns \u2014 `default_layout: custom` on `hk-incorp` (catalog layout TBD).\n\n## Anchor case note\n\nThis file is the **generic InCorp HK** reference. The ingested sample happens to be a **listed-company / IPO** engagement (\u9879\u76ee\u5c0f\u7ec4\u3001\u4e0a\u5e02\u670d\u52a1\u6838\u5fc3\u6210\u5458) \u2014 treat as case context, not a separate product line.\n\n## Language note\n\nPrimary content in zh-CN. Use `{{client.company_name}}` / project name placeholders \u2014 do not copy sample client text."}, {"id": "examples/incorp-ph-cs-payroll-bookkeeping-ep", "type": "Reference Proposal", "title": "InCorp PH \u2014 CS / Payroll / Bookkeeping / EP", "description": "Philippines Word proposal \u2014 incorporation post-compliance, payroll, bookkeeping/ tax, immigrant visa, SERVICE SLAs, and extended legal terms. Anchor for ph-incorp.", "tags": ["incorp", "region:PH", "jurisdiction:PH", "Word", "company-secretary", "payroll", "bookkeeping", "immigration", "SLA"], "group": "examples", "sz": 36, "body": "# Reference: InCorp PH CS / Payroll / Bookkeeping / EP\n\nLayer 1 extraction: [extraction spine](/references/extractions/incorp-ph-cs-payroll-bookkeeping-ep/spine.md).\n\n**Primary anchor** for [`ph-incorp`](/templates/ph-incorp.md).\n\n## Format\n\n| Field | Value |\n|-------|-------|\n| Region | PH |\n| BU | In.Corp PH |\n| Deliverable | Word |\n| Currency | PHP |\n| Layout | `multi-frequency` with **Total** column |\n\n## Section spine\n\n1. Cover + TOC + credentials\n2. RE: FEE PROPOSAL letter\n3. **SERVICES AND FEES** \u2014 4 fee-table modules (tbl[4\u20137])\n4. **SERVICE SLAs** \u2014 tbl[8]; deposit; refund policy tbl[9]\n5. **CORPORATE SECRETARIAL** \u2014 scope / exclusions / terms / indemnity\n6. **Corporate Treasurer** / **Nominee Director** officer modules\n7. **Bookkeeping & tax** terms; **Payroll** scope/terms (schedule tbl[10])\n8. **Immigration** scope / exclusions\n9. **UNIFIED TERMS AND CONDITIONS**\n\n## Fee modules\n\n| Module | Table | Layout notes |\n|--------|-------|--------------|\n| Incorporation and post-compliance | tbl[4] | Monthly \u00b7 Annually \u00b7 One-off \u00b7 Total |\n| Payroll services | tbl[5] | Same |\n| General bookkeeping and tax compliance | tbl[6] | Same |\n| Immigrant visa (PRV) | tbl[7] | One-off \u00b7 Total |\n\n### Total column\n\nDerived per row via [fee-table-total-column](/computations/fee-table-total-column.md) \u2014 `once_off + monthly\u00d712 + quarterly\u00d74 + annual`; non-numeric / Custom rows leave Total empty.\n\n## PH-specific modules\n\n| Module | Section Block |\n|--------|---------------|\n| SERVICE SLAs + refund | [service-slas](/blocks/incorp/regions/ph/service-slas.md) |\n| CS scope + exclusions | [cs-scope](/blocks/incorp/regions/ph/cs-scope.md), [cs-exclusions](/blocks/incorp/regions/ph/cs-exclusions.md) |\n| Officer services | [corporate-treasurer-service](/blocks/incorp/regions/ph/corporate-treasurer-service.md), [nominee-director-service](/blocks/incorp/regions/ph/nominee-director-service.md) |\n| Bookkeeping / payroll terms | [bookkeeping-tax-terms](/blocks/incorp/regions/ph/bookkeeping-tax-terms.md), [payroll-services](/blocks/incorp/regions/ph/payroll-services.md) |\n| Immigration | [immigration-scope](/blocks/incorp/regions/ph/immigration-scope.md) |\n\n## Distinction from other PH references\n\n| Sample | Role |\n|--------|------|\n| [Recruitment (PH)](/examples/incorp-ph-recruitment.md) | ITS recruitment \u2014 `ph-recruitment` |\n| This file | **Anchor** \u2014 multi-service CS + payroll + bookkeeping + EP |"}, {"id": "examples/incorp-ph-recruitment", "type": "Reference Proposal", "title": "InCorp PH \u2014 Recruitment & Executive Search", "description": "Philippines recruitment proposal with fee tables, 3-month guarantee period, client conforme, CDD document list, and extensive recruitment T&Cs.", "tags": ["incorp", "region:PH", "jurisdiction:PH", "Word", "recruitment", "executive-search"], "group": "examples", "sz": 29, "body": "# Reference: InCorp PH Recruitment\n\nLayer 1 extraction: [extraction spine](/references/extractions/incorp-ph-recruitment/spine.md).\n\n\n## Format\n\n| Field | Value |\n|-------|-------|\n| Region | PH |\n| BU | In.Corp PH / ITS |\n| Deliverable | Word |\n| Currency | PHP |\n\n## Section spine\n\n1. Cover + TOC + credentials\n2. RE: FEE PROPOSAL\n3. **RECRUITMENT AND EXECUTIVE SEARCH**\n4. Fee tables (tbl[4]\u2013tbl[5])\n5. **GUARANTEE PERIOD** \u2014 3-month replacement\n6. **PAYMENT** \u2014 7-day terms\n7. CLIENT'S CONFORME + CLIENT DETAILS (tbl[6])\n8. CDD document list (tbl[7])\n9. GENERAL TERMS AND CONDITIONS (A\u2013G)\n\n## Recruitment-specific modules\n\n| Module | Notes |\n|--------|-------|\n| Guarantee period | Single replacement within 3 months |\n| Client conforme | Signature block + client details table |\n| CDD documents | Submission checklist |\n| T&Cs A\u2013G | Information, independence, non-solicitation, fees % |\n\n## Fee pattern\n\nRecruitment fee percentage tables \u2014 layout `custom`, not catalog quotation layouts.\n\n## Distinct from `ph-incorp`\n\nNo SERVICE SLAs or CS scope modules \u2014 recruitment legal framework and ITS-specific guarantee / conforme / CDD instead."}, {"id": "examples/incorp-sg-cs-tax-payroll-accounting-ff", "type": "Reference Proposal", "title": "InCorp SG \u2014 CS / Tax / Payroll / Accounting (first invoice)", "description": "Singapore Word proposal \u2014 Annual Compliance (accounting/tax/payroll) plus Full Finance Function Support. Anchor for sg-incorp; includes optional Estimated first invoice value table.", "tags": ["incorp", "region:SG", "jurisdiction:SG", "Word", "accounting", "payroll", "tax", "first-invoice"], "group": "examples", "sz": 35, "body": "# Reference: CS / Tax / Payroll / Accounting + First Invoice (SG)\n\nLayer 1 extraction: [extraction spine](/references/extractions/incorp-sg-cs-tax-payroll-accounting-ff/spine.md).\n\n**Primary anchor** for [`sg-incorp`](/templates/sg-incorp.md).\n\n## Format\n\n| Field | Value |\n|-------|-------|\n| Region | SG |\n| BU | In.Corp |\n| Deliverable | Word (legacy In.Corp template) |\n| Output shell | Not Ascentium brand shell \u2014 study structure only |\n\n## Section spine\n\n1. Cover + TOC\n2. Credentials block \u2014 About In.Corp \u2192 Key Accreditations\n3. Fee Proposal letter\n4. Scope of Services\n5. Fees (2 fee-table modules)\n6. Client details / presented-to block\n7. **Estimated first invoice value** (optional) \u2014 tbl[6]\n8. Terms & Conditions (4 subsections)\n\n## Fee modules\n\n| Module | Table | Rows | Layout |\n|--------|-------|------|--------|\n| Annual Compliance \u2014 Accounting/Tax/Payroll | tbl[4] | 19 | `oneoff-recurring` |\n| Full Finance Function Support Package | tbl[5] | 9 | `oneoff-recurring` |\n\n### Fee column pattern\n\n`Services` | `One-off Fee (SGD)` | `Recurring Fee (SGD)`\n\n### Structural footnotes (no amounts)\n\n- Transaction-volume-based bookkeeping estimate (*)\n- Audit / consolidation surcharge clause (**)\n- Conditional XBRL filing block (#)\n\n## Optional: Estimated first invoice\n\n| Field | Value |\n|-------|-------|\n| Heading | `ESTIMATED FIRST INVOICE VALUE` |\n| Table | tbl[6] (28 rows) |\n| Template section | `first_invoice` (`derived_section`, `default_enabled: false`) |\n| Derivation | One-off + first recurring period + GST 9%; excludes ad-hoc |\n| Computation | [first-invoice-from-fee-tables](/computations/first-invoice-from-fee-tables.md) |\n| Block | [estimated-first-invoice-value](/blocks/incorp/shared/estimated-first-invoice-value.md) |\n\n## Distinction from other SG references\n\n| Sample | Role |\n|--------|------|\n| [Rikvin Employment Pass](/examples/incorp-sg-rikvin-employment-pass.md) | Immigration-only subset; Rikvin disclaimer source |\n| This file | **Anchor** \u2014 Tax + Full Finance + optional first invoice |\n\n## Section Block promotion notes\n\nShared SG Word front-matter and T&C cluster promoted from this extraction. EP / incorporation fee rows \u2014 compose from catalog or [Rikvin EP sample](/examples/incorp-sg-rikvin-employment-pass.md) when needed."}, {"id": "examples/incorp-sg-internal-audit", "type": "Reference Proposal", "title": "InCorp SG \u2014 Internal Audit Services", "description": "60-slide internal audit proposal deck (Risk Assurance). Covers 3-year phased plan, methodology, deliverables, and multi-year professional fees. Structural index only.", "tags": ["incorp", "region:SG", "jurisdiction:SG", "PPT", "internal-audit", "risk-assurance"], "group": "examples", "sz": 33, "body": "# Reference: Internal Audit Services (SG)\n\nLayer 1 extraction: [extraction spine](/references/extractions/incorp-sg-internal-audit/spine.md).\n\n\n## Format\n\n| Field | Value |\n|-------|-------|\n| Region | SG |\n| BU | In.Corp Business Advisory \u2014 Risk Assurance |\n| Deliverable | PPT (60 slides) |\n| Output shell | Custom audit deck \u2014 **not** Ascentium brand shell |\n\n## Deck spine\n\n| # | Section | Slides |\n|---|---------|--------|\n| 1 | Cover + transmittal letter | 1\u20132 |\n| 2 | Overview (TOC) | 3 |\n| 3 | About InCorp / credentials / clientele | 4\u201323 |\n| 4 | Internal Audit Services | 24\u201353 |\n| 5 | Professional Fees | 54\u201355 |\n| 6 | Strengths & differentiators | 56\u201357 |\n| 7 | Value-added services | 58\u201359 |\n| 8 | Thank You | 60 |\n\n## Internal Audit content rhythm\n\n1. Background / portal search\n2. **3-year phased audit plan** \u2014 year \u00d7 scope matrix (compliance, procurement, HR/payroll, grants, ERM, IT, follow-up reviews)\n3. Methodology \u2014 IPPF / IIA Global Internal Audit Standards\n4. **5-phase lifecycle** \u2014 STRATEGISE \u2192 PLAN \u2192 EXECUTE \u2192 FINALISE \u2192 KNOWLEDGE TRANSFER\n5. Per-process scope slides (30\u201353)\n6. Deliverables timeline\n\n## Fee pattern\n\nMulti-year matrix (not `oneoff-recurring` SKU layout):\n\n| Year | Description | Professional Fees (S$) |\n\nPayment schedule: 30% / 50% / balance on milestones. Year-on-year renewal. Excludes GST and out-of-pocket.\n\n## Distinction from other SG references\n\n| Aspect | Word CS/EP samples | This deck |\n|--------|-------------------|-----------|\n| `template_id` | `sg-incorp` | `sg-audit` |\n| Layout | `oneoff-recurring` 3-column fee tables | Year-based audit fee matrix |\n| Length | ~15 H1 sections | 60 slides |\n| Deliverable | Word | PPT |\n\n## Section Block promotion notes\n\n- Methodology (IPPF) and 5-phase lifecycle slides \u2014 candidate if reused across audit proposals\n- Fee payment schedule notes \u2014 candidate boilerplate"}, {"id": "examples/incorp-sg-rikvin-employment-pass", "type": "Reference Proposal", "title": "InCorp SG \u2014 Rikvin Employment Pass Application", "description": "Singapore Word proposal focused on Rikvin immigration services (DP, PEP/ONE Pass, education verification). Structural index only.", "tags": ["incorp", "region:SG", "jurisdiction:SG", "Word", "rikvin", "employment-pass", "immigration"], "group": "examples", "sz": 30, "body": "# Reference: Rikvin Employment Pass (SG)\n\nLayer 1 extraction: [extraction spine](/references/extractions/incorp-sg-employment-pass/spine.md).\n\n\n## Format\n\n| Field | Value |\n|-------|-------|\n| Region | SG |\n| BU | In.Corp / Rikvin |\n| Deliverable | Word (legacy In.Corp template + Rikvin footer) |\n| Output shell | Not Ascentium brand shell |\n\n## Section spine\n\nSame SG Word envelope through credentials as the cs-ep anchor sample \u2014 **immigration-only subset**.\n\n## Fee modules\n\n| Module | Table | Services |\n|--------|-------|----------|\n| DP Services | tbl[4] | Dependent Pass, LTVP |\n| PEP Services | tbl[5] | ONE Pass |\n| Other Services | tbl[6] | Education verification (tiered `from {{fee_amount}}`) |\n\n### Fee column pattern\n\n`Services` | `One-off Fee (SGD)` | `Recurring Fee (SGD)` \u2014 per-application one-off, recurring usually `-`.\n\nMaps to layout `oneoff-recurring`.\n\n## Rikvin disclaimer pattern\n\nAfter each immigration fee block: services provided by RIKVIN PTE. LTD. (UEN / EA licence) as independent subsidiary.\n\n## Section Block promotion notes\n\n- Rikvin disclaimer is a strong candidate for `Section Block` once placeholderized\n- Shared SG credentials front-matter overlaps CS+EP sample"}, {"id": "examples/incorp-vn-cs-tax-payroll-tax-hr", "type": "Reference Proposal", "title": "Ascentium VN \u2014 CS / Tax / Payroll / HR", "description": "11-slide Vietnam services PPT with Ascentium brand intro and USD fee schedules for corporate services, accounting/tax, and HR/payroll modules.", "tags": ["incorp", "region:VN", "jurisdiction:VN", "PPT", "corporate-services", "tax", "payroll", "HR"], "group": "examples", "sz": 28, "body": "# Reference: Ascentium VN CS / Tax / Payroll / HR\n\nLayer 1 extraction: [extraction spine](/references/extractions/incorp-vn-cs-tax-payroll-tax-hr/spine.md).\n\n\n## Format\n\n| Field | Value |\n|-------|-------|\n| Region | VN |\n| BU | Ascentium |\n| Deliverable | PPT (11 slides) |\n| Currency | USD |\n\n## Slide spine\n\n| # | Section |\n|---|---------|\n| 1 | Cover |\n| 2\u20135 | Brand intro (management, KPIs, footprint, offerings) |\n| 6\u20137 | **Vietnam Fee Schedule** \u2014 Corporate Services |\n| 8 | Accounting & Tax Compliance |\n| 9 | HR and Payroll |\n| 10\u201311 | We Are Ascentium + Contact (sealed tail) |\n\n## Fee pattern\n\n| # | Service | Occurrence | Fees (USD) |\n\nThree fee-schedule slides by service line. Supports ranges (`{{fee_amount}} \u2013 {{fee_amount}}`) and TBC rows.\n\n## Shell relationship\n\nIntro + sealed tail match Ascentium PPT shell rhythm; content slides 6\u20139 are proposal-specific."}, {"id": "examples/incorp-vn-services-zh-cn", "type": "Reference Proposal", "title": "Ascentium VN \u2014 Services Template (zh-CN)", "description": "Simplified Chinese Vietnam services PPT template with merge placeholders for client, services, fees, and appendix tables. Shell-oriented sample.", "tags": ["incorp", "region:VN", "jurisdiction:VN", "PPT", "zh-CN", "template"], "group": "examples", "sz": 29, "body": "# Reference: Ascentium VN Services Template (zh-CN)\n\nLayer 1 extraction: [extraction spine](/references/extractions/incorp-vn-services-zh-cn/spine.md).\n\n\n## Format\n\n| Field | Value |\n|-------|-------|\n| Region | VN |\n| BU | Ascentium |\n| Deliverable | PPT (10 slides) |\n| Language | **zh-CN** |\n\n## Slide spine\n\n| # | Section |\n|---|---------|\n| 1 | `[[client_company_name]]` - \u4e13\u4e1a\u670d\u52a1\u63d0\u6848 |\n| 2 | \u521b\u59cb\u7ba1\u7406\u5c42 |\n| 3\u20136 | \u54c1\u724c\u4ecb\u7ecd / \u96c6\u56e2\u6210\u5458 / \u7f51\u7edc / \u670d\u52a1\u9879\u76ee |\n| 7 | \u670d\u52a1\u65b9\u6848 \u2013 \u8d8a\u5357\u6709\u9650\u8d23\u4efb\u516c\u53f8 \u2014 **placeholder fee table** |\n| 8\u20139 | Appendix (`[[appendix_*]]` placeholders) |\n| 10 | \u8054\u7cfb\u6211\u4eec \u2014 `[[user_email]]`, `[[user_mobile]]` |\n\n## Placeholder pattern (slide 7)\n\n| Field | Placeholder |\n|-------|-------------|\n| Package | `[[solution_package_name]]` |\n| Service | `[[service_name]]` |\n| Scope | `[[scope_of_work]]` |\n| Frequency | `[[billing_frequency]]` |\n| Fee | `[[service_fee]]` |\n\n## Role\n\n**Locale reference** for `vn-incorp` \u2014 zh-CN placeholder PPT shell (`[[merge]]` rows). Canonical filled fees: anchor `incorp-vn-cs-tax-payroll-tax-hr`. See [locale references](/meta/locale-references.md)."}, {"id": "layouts/fee-billing", "type": "Quotation Layout", "title": "Service \u00b7 Fee \u00b7 Billing frequency", "description": "Three-column fee table \u2014 service description, fee amount/text, billing frequency label. Global fallback layout; default for MY.", "tags": ["layout", "quotation", "billing-frequency"], "group": "layouts", "sz": 28, "body": "# Layout: `fee-billing`\n\nDescribes **column shape**, not a region. Legacy id was `malaysia` (used as global default).\n\n## Columns\n\n| Column | Purpose |\n|--------|---------|\n| Service | Category heading + nested bullets + conditional notes |\n| Fee | Professional fee, exclusions, conditional fee text |\n| Billing Frequency | e.g. once-off / annual / blank |\n\n## Row JSON shape\n\n```json\n{\n  \"row_id\": \"row-1\",\n  \"source_type\": \"package\",\n  \"source_id\": \"PKG-MY-INC-CS\",\n  \"is_custom\": false,\n  \"title\": \"Incorporation\",\n  \"scope_bullets\": [\"{{scope_bullet}}\"],\n  \"fees\": {\n    \"currency\": \"MYR\",\n    \"amount\": null,\n    \"billing_frequency\": \"once-off\"\n  }\n}\n```\n\n## Related layouts\n\n- [oneoff-recurring](/layouts/oneoff-recurring.md)\n- [multi-frequency](/layouts/multi-frequency.md)\n\n## Templates using this layout\n\n*(No draft template yet \u2014 default for InCorp MY per [region routing](/meta/region-routing.md).)*"}, {"id": "layouts/multi-frequency", "type": "Quotation Layout", "title": "Scope \u00b7 Multi-frequency fees", "description": "Fee table with Monthly, Quarterly, Annual, Once-off, and Total columns. Any region may use this layout; default for PH and AU.", "tags": ["layout", "quotation", "multi-frequency"], "group": "layouts", "sz": 30, "body": "# Layout: `multi-frequency`\n\nDescribes **column shape**, not a region. Legacy id was `philippines_australia` (misleading name).\n\n## Columns\n\n| Column | Key in `fees` |\n|--------|----------------|\n| Scope of Work | `title` + `scope_text` |\n| Monthly | `fees.monthly` |\n| Quarterly | `fees.quarterly` |\n| Annual | `fees.annual` |\n| Once-off | `fees.once_off` |\n| Total | `fees.total` \u2014 **derived** via [fee-table-total-column](/computations/fee-table-total-column.md) when `show_total_column: true` |\n\nOptional section-level **Total** toggle (`data.show_total`). Per-row Total is materialized at compose time \u2014 do not paste amounts in Section Blocks.\n\n## Row JSON shape\n\n```json\n{\n  \"row_id\": \"row-1\",\n  \"title\": \"Business Registration\",\n  \"scope_text\": \"{{scope_description}}\",\n  \"fees\": {\n    \"currency\": \"PHP\",\n    \"monthly\": null,\n    \"quarterly\": null,\n    \"annual\": null,\n    \"once_off\": null,\n    \"total\": null\n  }\n}\n```\n\n## Related layouts\n\n- [oneoff-recurring](/layouts/oneoff-recurring.md)\n- [fee-billing](/layouts/fee-billing.md)\n\n## Templates using this layout\n\n* [au-advisory](/templates/au-advisory.md) \u2014 InCorp AU Word\n* [ph-incorp](/templates/ph-incorp.md) \u2014 InCorp PH corporate secretarial"}, {"id": "layouts/oneoff-recurring", "type": "Quotation Layout", "title": "Scope \u00b7 One-off \u00b7 Recurring", "description": "Three-column fee table \u2014 scope/services, one-off fee, recurring fee. Any region may use this layout; default for SG.", "tags": ["layout", "quotation", "oneoff", "recurring"], "group": "layouts", "sz": 30, "body": "# Layout: `oneoff-recurring`\n\nDescribes **column shape**, not a region. See [layout registry](/layouts/index.md) and [region defaults](/meta/region-routing.md).\n\n## Columns\n\n| Column | Header in Word (typical) | Purpose |\n|--------|--------------------------|---------|\n| `scope` | Services | Category heading + scope bullets |\n| `one_off` | One-off Fee | Once-off amount / text or `-` |\n| `recurring` | Recurring Fee | Recurring amount / text or `-` |\n\nCurrency is per row/region (SGD, USD, \u2026) \u2014 not fixed by layout.\n\n## Row JSON shape\n\n```json\n{\n  \"row_id\": \"row-1\",\n  \"source_type\": \"sku\",\n  \"source_id\": \"SG-INC-001\",\n  \"is_custom\": false,\n  \"title\": \"Incorporation\",\n  \"scope_bullets\": [\"{{scope_bullet}}\"],\n  \"fees\": {\n    \"currency\": \"SGD\",\n    \"one_off\": { \"amount\": null, \"display\": \"{{fee_amount}} per entity\" },\n    \"recurring\": null\n  }\n}\n```\n\n## Catalog mapping\n\n| Catalog field | Layout field |\n|---------------|--------------|\n| `service_name` | `title` |\n| scope bullets | `scope_bullets` |\n| `one_off_*` | `fees.one_off` |\n| `recurring_*` + period | `fees.recurring` |\n\n## Related layouts\n\n- [multi-frequency](/layouts/multi-frequency.md) \u2014 multiple billing period columns\n- [fee-billing](/layouts/fee-billing.md) \u2014 Service \u00b7 Fee \u00b7 Billing Frequency\n\n## Templates using this layout\n\n* [sg-incorp](/templates/sg-incorp.md) \u2014 default for InCorp SG"}, {"id": "meta/bu-region-jurisdiction", "type": "Reference", "title": "BU, region, and jurisdiction", "description": "Market taxonomy \u2014 BU, issuing region, and entity/service jurisdiction. Distinguishes multi-entity outbound deals from single-document proposal scope.", "tags": ["meta", "vocabulary", "bu", "region", "jurisdiction"], "group": "meta", "sz": 46, "body": "# BU, region, jurisdiction\n\nAvoid the phrase **\u300cclient jurisdiction\u300d** \u2014 it conflates three different things (see below).\n\n## Core definitions\n\n| Concept | Question it answers | Example |\n|---------|---------------------|---------|\n| **BU** | Which brand / business unit? | `incorp`, `harneys` |\n| **Region** | Which **our** office **issues** this proposal? | InCorp SG, Harneys UK, InCorp VN |\n| **Entity jurisdiction** | Where is the **legal entity being formed or served** domiciled? | BVI holdco, SG opco, VN subsidiary |\n| **Service jurisdiction** *(optional)* | Where are the **scoped services
