[project]
name = "evaluate-cli"
version = "0.1.0"
description = "Evaluation workers for OpenKMS — ASR pipeline compare and LLM judge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "openkms-cli",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
pipeline = [
    "boto3>=1.26.0",
]
judge = [
    "deepeval>=2.0.0",
]
aliyun = [
    "alibabacloud_docmind_api20220711>=1.4.0",
    "alibabacloud_tea_openapi>=0.3.0",
]

[project.scripts]
evaluate-cli = "evaluate_cli.__main__:run"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["evaluate_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
openkms-cli = { path = "../openkms-cli", editable = true }

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
